# The umbrella carries no configuration of its own: every key a deployable
# needs is in its own chart's values.yaml, so one file governs both a
# per-service release and this one. A second copy here would be the first
# thing to drift, and the drift would be invisible — both renders succeed and
# only one matches what is running, and a key set here silently wins over the
# subchart's own.
#
# The per-environment overlay goes on the command line or in a values file
# beside this one, under each subchart's name; deploy/helm/README.md holds
# that command, and why an umbrella release and a per-service one conflict.
{}
