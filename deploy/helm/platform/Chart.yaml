apiVersion: v2
name: platform
description: >-
  The umbrella (§15.3) — every deployable in one release, in Appendix C's
  order. A chart per service exists so a service can be rolled on its own;
  this one exists so an environment can be stood up whole.
type: application
version: 0.1.0
dependencies:
  # No `condition` keys. A service is either built and deployable or it is not
  # in this list, and a chart switched off by a value would render nothing while
  # reading as present — the same failure §15.3 argues against for
  # `service.enabled`, one level up. A service chart joins this list with the
  # change that adds it (Appendix C).
  - name: catalog
    version: 0.1.0
    repository: file://../catalog
  - name: ordering
    version: 0.1.0
    repository: file://../ordering
  - name: inventory
    version: 0.1.0
    repository: file://../inventory
  - name: payments
    version: 0.1.0
    repository: file://../payments
  - name: shipping
    version: 0.1.0
    repository: file://../shipping
  - name: notifications
    version: 0.1.0
    repository: file://../notifications
  # After the worker's chart, whose hook migrates the schema this host reads
  # (ADR-118). A list order is not a Helm install order, so the rollout holds
  # the order between per-service releases; here one release runs the one hook.
  - name: notifications-api
    version: 0.1.0
    repository: file://../notifications-api
  - name: privacy
    version: 0.1.0
    repository: file://../privacy
  - name: gateway
    version: 0.1.0
    repository: file://../gateway
  - name: web-bff
    version: 0.1.0
    repository: file://../web-bff
  # After web-bff, whose hook migrates the schema this release reads (ADR-153),
  # on notifications-api's terms above.
  - name: web-bff-assistant
    version: 0.1.0
    repository: file://../web-bff-assistant
