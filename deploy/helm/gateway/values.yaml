# The gateway's chart is not a service chart with the database parts deleted
# (§15.3). It has no migrator, no client credentials, and two keys no service
# has — and every one of those differences is something it will not start
# without, or will start wrongly without.

workload:
  name: gateway

replicaCount: 3

# §15.5's canary track, and OFF is what every ordinary release means.
#
# Turned on, this chart renders the SECOND of two Deployments that answer to the
# one Service: its objects take a `-canary` suffix, its pods carry
# `app.kubernetes.io/track: canary`, and the Service, Ingress, HPA and
# PodDisruptionBudget are suppressed because the stable release owns those names
# (ADR-022). The share of traffic it serves is its replica count over the total,
# which is why `deploy/canary/canary.py` does the arithmetic and refuses the
# weights a replica ratio cannot express.
#
# Set by the rollout, not by an operator: `deploy/canary/` drives it.
canary:
  enabled: false

image:
  registry: registry.example.com/commerce
  api: gateway
  # No migrator key: the gateway owns no database (§10.1), so §7.4's
  # migration hook has nothing to run for it. This chart also carries no
  # templates/migrate-job.yaml — §15.3's point that the gateway's chart is not
  # a service chart with the database parts deleted — so the absence is
  # structural and the missing key is the values half of the same statement.
  # smoke.sh asserts the two halves agree, because either one alone is a claim
  # nothing checks.
  tag: ""
  pullPolicy: IfNotPresent

ports:
  - name: http
    containerPort: 8080

resources:
  requests: { cpu: 200m, memory: 128Mi }
  limits:   { memory: 256Mi }

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 30          # every external request passes through here
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Spread across nodes as a rule and across zones as a preference (§15.3).
topologySpread:
  maxSkew: 1
  whenUnsatisfiable:
    node: DoNotSchedule
    zone: ScheduleAnyway

terminationGracePeriodSeconds: 45

probes:
  # The same three §13.5 defines, and the gateway needs them stated as much as
  # any service: MapCommonHealthEndpoints exposes the endpoints, and a chart
  # that never references them means nothing asks. Readiness is honest here
  # even though the set is empty (§4.2) — "the process is up" is exactly the
  # question, because no dependency of the gateway's gates its readiness. It
  # proxies four services and depends on all of them; what it does not do is
  # report unready when one is down, which would take the edge out of rotation
  # for a fault it is meant to pass through. The host declares that at the call
  # site rather than leaving the empty set to pass on its own:
  # MapCommonHealthEndpoints(ownsNoReadinessDependencies: true), which is what
  # stops "declared empty" and "was never wired up" reading identically from
  # out here.
  probePort: http
  liveness:  { path: /health/live,  initialDelaySeconds: 10, periodSeconds: 10 }
  readiness: { path: /health/ready, initialDelaySeconds: 5,  periodSeconds: 5 }
  startup:   { path: /health/startup, failureThreshold: 30,  periodSeconds: 2 }

service:
  enabled: true

identity:
  # Authority only. The gateway validates JWTs (§11.2) but calls nobody —
  # YARP forwards the caller's token — so there is no clientSecretRef here
  # and no gateway entry in External Secrets (§11.5, §15.4).
  authority: https://id.example.com/realms/commerce
  # False, and written down rather than absent: §15.4's
  # required-for-some-hosts category is a claim a chart has to make, not one to
  # infer from a missing key.
  clientCredentials: false

# The gateway owns no schema and reads no broker connection, so both are off
# and the container's environment carries no Secret at all.
database:
  enabled: false
broker:
  enabled: false

# §8.1's Redis connections, and this host takes neither. Written down rather
# than omitted, on database and broker's terms (§15.3): a capability is a claim
# a chart makes, not one to infer from a missing key.
redis:
  enabled: false

observability:
  otlpEndpoint: http://otel-collector.observability:4317

ingress:
  # True in every Kubernetes environment: TLS terminates at the load balancer
  # or Ingress (§10.1), so RemoteIpAddress is the ingress on every request
  # until UseForwardedHeaders runs. The same key is false in §14.1's Compose,
  # where the gateway IS the edge — not an inconsistency to reconcile, but one
  # setting correctly describing two topologies.
  enabled: true
  className: nginx
  host: api.example.com
  tls:
    secretName: gateway-tls
  annotations: {}
  # EMPTY, and required — the same shape as image.tag above and for a sharper
  # reason. These are the ingress controller's pod CIDRs, not the cluster's,
  # and anything trusted here can set X-Forwarded-For.
  #
  # A plausible-looking default is an active security decision taken on behalf
  # of a cluster nobody has seen. Wrong low, the real ingress is untrusted, its
  # forwarded header is ignored, and §10.3's per-client rate limit degrades to
  # one global bucket — a denial of service against legitimate users, wearing
  # the name of a defence. Wrong high, any pod that happens to sit in the
  # trusted range picks its own rate-limit partition, and its own client IP in
  # every log line §13.4 writes.
  #
  # Neither failure is visible in a render or a rollout, so the value has to
  # come from whoever knows the cluster. Empty means the chart refuses to
  # template until an overlay supplies it; §15.3 shows the shape.
  trustedNetworks: []

cors:
  # Off. Browsers reach the platform through the CDN on the same origin
  # (§10.2), so no preflight ever arrives. Off is a complete configuration;
  # on without origins is not (§15.4).
  enabled: false
  # origins: [ "https://shop.example.com" ]  # becomes mandatory the moment
  # enabled flips to true — GetRequiredSection, so the chart fails the pod
  # rather than serving a policy that rejects every browser.
  origins: []

# The gateway's own ConfigMap, rendered by templates/edge-config.yaml — the two
# keys no service has.
#
# A SUFFIX, not a name: the mounted reference and the ConfigMap's own metadata
# both derive from workload.name, so they cannot disagree. This held the full
# name "gateway-edge" and matched only while workload.name was "gateway" —
# an overlay renaming the workload mounted one ConfigMap and rendered another.
extraConfigMaps:
  - edge

# ADR-065's fence: denied both ways but for the edges named here. A peer inside
# the namespace is a workload and a port name; what runs outside it is a list
# of NetworkPolicy peers the deployment states, and an empty one is refused
# wherever a capability above dials it, since a rule with no peer admits all.
networkPolicy:
  ingressController: { from: [] }
  ingressFrom: []
  egressTo:
    - { workload: catalog-api, port: http }
    - { workload: ordering-api, port: http }
    - { workload: inventory-api, port: http }
    - { workload: payments-api, port: http }
    - { workload: web-bff, port: http }
  dns:
    to:
      - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
        podSelector: { matchLabels: { k8s-app: kube-dns } }
  telemetry:
    to:
      - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: observability } }
  identity: { to: [] }
