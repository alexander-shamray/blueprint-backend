# The charts whose host calls out under a grant of its own carry client
# credentials and no other chart does; which charts those are is the design
# rather than an oversight (§15.3, ADR-052).

workload:
  # §10.2's route file dials `http://web-bff:8080/`, and §14.1's container is
  # named to match — the service's name IS the routing configuration, in both
  # files.
  name: web-bff

replicaCount: 3

# §15.5's canary track, and OFF is what every ordinary release means.
#
# Turned on, this chart renders the SECOND of two Deployments that answer to the
# one Service: its objects take a `-canary` suffix, its pods carry
# `app.kubernetes.io/track: canary`, and the Service, Ingress, HPA and
# PodDisruptionBudget are suppressed because the stable release owns those names
# (ADR-022). The share of traffic it serves is its replica count over the total,
# which is why `deploy/canary/canary.py` does the arithmetic and refuses the
# weights a replica ratio cannot express.
#
# Set by the rollout, not by an operator: `deploy/canary/` drives it.
canary:
  enabled: false

image:
  registry: registry.example.com/commerce
  api: web-bff
  # ADR-051's projection schema, applied by the pre-upgrade hook (§7.4) before
  # any pod of this tag starts; smoke.sh asserts the key and
  # templates/migrate-job.yaml agree.
  migrator: bff-migrator
  tag: ""
  pullPolicy: IfNotPresent

ports:
  - name: http
    containerPort: 8080

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { memory: 256Mi }

migrationJob:
  # Smaller than the host's: the migrator opens one connection, applies a
  # migration and exits (§7.4). It is not serving anything.
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 256Mi }

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Spread across nodes as a rule and across zones as a preference (§15.3).
topologySpread:
  maxSkew: 1
  whenUnsatisfiable:
    node: DoNotSchedule
    zone: ScheduleAnyway

terminationGracePeriodSeconds: 45

probes:
  probePort: http
  liveness:  { path: /health/live,  initialDelaySeconds: 10, periodSeconds: 10 }
  readiness: { path: /health/ready, initialDelaySeconds: 5,  periodSeconds: 5 }
  startup:   { path: /health/startup, failureThreshold: 30,  periodSeconds: 2 }

service:
  enabled: true

ingress:
  # False. The BFF is reached through the gateway like every other host —
  # §10.2 routes to it, and a second door would bypass the edge's rate
  # limiting and forwarded-header handling.
  enabled: false

identity:
  authority: https://id.example.com/realms/commerce
  # Required by ValidateOnStart (§15.4): this host does call a peer (§9.7).
  # The secret is a reference, never a value.
  #
  # The switch is its own key rather than clientId's presence. Web.Bff binds
  # ServiceIdentityOptions unconditionally, so clearing clientId would render a
  # release whose pod then refuses to start — an opt-out that is not one. With
  # the boolean, all three values below are required and blank fails the render.
  clientCredentials: true
  clientId: web-bff
  scope: commerce-api
  clientSecretRef:
    name: web-bff-identity
    key: client-secret

# ADR-051's projection. GetConnectionString("Bff") at runtime, "BffMigrator"
# in the hook. It is the one readiness check (§13.5): Catalog's hop is not,
# since a BFF unready whenever Catalog is down takes itself out of rotation
# for a fault it exists to degrade around.
database:
  enabled: true
  connectionName: Bff
  runtimeSecretRef:
    name: web-bff-database
    key: connection-string
  migratorSecretRef:
    name: web-bff-migrator-secret
    key: connection-string

# The bus (§9), under the BFF's own account: one Secret per host, never a
# shared one (ADR-036). It must carry a connection string for `bff-svc`, which
# deploy/compose/rabbitmq/definitions.json declares and check_permissions.py
# holds to the code; provisioning it on a deployed broker is §15.4's obligation.
broker:
  enabled: true
  secretRef:
    name: web-bff-rabbitmq
    key: connection-string

# §8.1's Redis connections, and this host takes neither. Written down rather
# than omitted, on database and broker's terms (§15.3): a capability is a claim
# a chart makes, not one to infer from a missing key.
redis:
  enabled: false

observability:
  otlpEndpoint: http://otel-collector.observability:4317

extraConfigMaps: []
