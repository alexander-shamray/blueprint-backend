# Inventory, and the chart §15.3 prints. HTTP only: nothing calls this
# service synchronously (§9.7).

workload:
  # §10.2's route configuration dials this workload by this literal name —
  # _helpers.tpl argues why it is not release-derived.
  name: inventory-api

replicaCount: 3

# §15.5's canary track, and off is what every ordinary release means. Turned
# on, this chart renders a second Deployment behind the one Service, with a
# `-canary` suffix and a `track: canary` pod label, and suppresses the
# Service, Ingress, HPA and PodDisruptionBudget because the stable release
# owns those names (ADR-022). Its share of traffic is its replica count over
# the total, which is why `deploy/canary/canary.py` does the arithmetic and
# refuses a weight no replica ratio expresses. The rollout sets this, not an
# operator.
canary:
  enabled: false

image:
  # Registry namespace only. Each workload appends its own name, so the chart
  # can reference both the API and the migrator (§7.4) from one tag.
  registry: registry.example.com/commerce
  api: inventory-api
  migrator: inventory-migrator
  # Supplied by CI, never "latest"; both images share it. Deliberately empty
  # rather than a default: a deploy that cannot name its tag must fail, not
  # roll something. A config-only deploy reads the running value back (§15.1)
  # instead of falling through to this.
  tag: ""
  pullPolicy: IfNotPresent

ports:
  - name: http
    containerPort: 8080

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits:   { memory: 512Mi }          # No CPU limit — §15.3.

migrationJob:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 256Mi }

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Spread across nodes as a rule and across zones as a preference (§15.3).
topologySpread:
  maxSkew: 1
  whenUnsatisfiable:
    node: DoNotSchedule
    zone: ScheduleAnyway

# Must exceed the host's HostOptions.ShutdownTimeout — §15.3
# carries the argument.
terminationGracePeriodSeconds: 45

probes:
  probePort: http
  liveness:  { path: /health/live,  initialDelaySeconds: 10, periodSeconds: 10 }
  readiness: { path: /health/ready, initialDelaySeconds: 5,  periodSeconds: 5 }
  startup:   { path: /health/startup, failureThreshold: 30,  periodSeconds: 2 }

service:
  # True: reachable from the edge (§10.2).
  enabled: true

ingress:
  # False, and written down rather than omitted (§15.3). Traffic reaches this
  # workload through the edge (§10.2), and an Ingress here would be a second
  # door past it.
  enabled: false

identity:
  # The authority, to validate incoming JWTs (§11.2) — and nothing else.
  # Identity:Client is what a host presents when it calls a peer (§11.5), and
  # Inventory calls none: reservation and release travel over the broker
  # (§9.4). No clientId here means no Keycloak client, no secret in the
  # vault and nothing to rotate.
  authority: https://id.example.com/realms/commerce
  # False, and written down rather than absent: §15.4's
  # required-for-some-hosts category is a claim a chart has to make, not one to
  # infer from a missing key.
  clientCredentials: false

database:
  enabled: true
  # GetConnectionString("Inventory") at runtime, "InventoryMigrator" in the
  # hook.
  connectionName: Inventory
  runtimeSecretRef:
    name: inventory-database
    key: connection-string
  migratorSecretRef:
    name: inventory-migrator-secret
    key: connection-string

# The bus (§9): each service names its own Secret, holding a distinct broker
# account, because a shared principal makes queue arrival a boundary in name
# only (§9.4). The Secret must carry a connection string for the
# `inventory-svc` account, whose permissions
# deploy/compose/rabbitmq/definitions.json declares. Provisioning that account
# on a deployed broker is an obligation this repository states and does not
# check, the division §15.4 draws for every Secret; ADR-040 narrows what an
# unchecked realm can cost, and nothing here does even that much for a broker
# account.
broker:
  enabled: true
  secretRef:
    name: inventory-rabbitmq
    key: connection-string

# §8.1's two Redis connections. Required together: AddRedisConnections is one
# call and reads both eagerly, so this service either has Redis or does not.
# §8.5's IdempotencyBehavior is what reads a key today — it claims one on the
# coordination instance before any protected command runs.
redis:
  enabled: true
  # This service's own Secret, never another's: each connection string carries
  # the service's own ACL user (§8.1). Two keys rather than one value, because
  # idempotency claims pointed at the allkeys-lru instance are a duplicate
  # write that only appears under memory pressure.
  secretRef:
    name: inventory-redis
    cacheKey: cache-connection-string
    coordinationKey: coordination-connection-string

observability:
  otlpEndpoint: http://otel-collector.observability:4317

extraConfigMaps: []

# ADR-065's fence: denied both ways but for the edges named here. A peer inside
# the namespace is a workload and a port name; what runs outside it is a list
# of NetworkPolicy peers the deployment states, and an empty one is refused
# wherever a capability above dials it, since a rule with no peer admits all.
# A port is the peer pod's; one stated here wins over the one its address dials.
networkPolicy:
  ingressFrom:
    - { workload: gateway, port: http }
  egressTo: []
  dns:
    to:
      - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
        podSelector: { matchLabels: { k8s-app: kube-dns } }
  telemetry:
    to:
      - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: observability } }
  identity: { to: [] }
  database: { port: 1433, to: [] }
  redis: { port: 6379, to: [] }
  broker: { port: 5672, to: [] }
