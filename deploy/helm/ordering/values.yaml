# Ordering, and the chart §15.3 prints. Two ports since ADR-052: §10.2's REST
# surface, and the HTTP/2-only endpoint that serves DeliveryAddresses.Get to a
# Shipping worker. A cleartext Kestrel endpoint cannot serve HTTP/1.1 and h2c
# at once — measured, and argued in Ordering.Api/appsettings.json.

workload:
  # §10.2's route file dials `http://ordering-api:8080/` as a literal, so this
  # value is that string — _helpers.tpl argues why it is not release-derived.
  name: ordering-api

replicaCount: 3

# §15.5's canary track, and OFF is what every ordinary release means.
#
# Turned on, this chart renders the SECOND of two Deployments that answer to the
# one Service: its objects take a `-canary` suffix, its pods carry
# `app.kubernetes.io/track: canary`, and the Service, Ingress, HPA and
# PodDisruptionBudget are suppressed because the stable release owns those names
# (ADR-022). The share of traffic it serves is its replica count over the total,
# which is why `deploy/canary/canary.py` does the arithmetic and refuses the
# weights a replica ratio cannot express.
#
# Set by the rollout, not by an operator: `deploy/canary/` drives it.
canary:
  enabled: false

image:
  # Registry namespace only. Each workload appends its own name, so the chart
  # can reference both the API and the migrator (§7.4) from one tag.
  registry: registry.example.com/commerce
  api: ordering-api
  migrator: ordering-migrator
  # Supplied by CI, never "latest"; both images share it. Deliberately empty
  # rather than a default: a deploy that cannot name its tag must fail, not
  # roll something. A config-only deploy reads the running value back (§15.1)
  # instead of falling through to this.
  tag: ""
  pullPolicy: IfNotPresent

ports:
  - name: http
    containerPort: 8080
  # 8081 is cluster-internal: no route reaches it (§10.2 routes HTTP), the
  # Ingress is disabled, and the RPC on it requires orders:delivery-address
  # (ADR-052).
  - name: grpc
    containerPort: 8081

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits:   { memory: 512Mi }          # No CPU limit — §15.3.

migrationJob:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 256Mi }

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Ordering is the host with the most to drain: four receive endpoints, a saga
# and an outbox dispatcher on a two-second tick (§9.4, §9.6). The number is
# still the framework's shutdown ceiling plus a margin rather than a per-service
# estimate — _deployment.tpl argues why 30 is not a margin over 30.
terminationGracePeriodSeconds: 45

probes:
  probePort: http
  liveness:  { path: /health/live,  initialDelaySeconds: 10, periodSeconds: 10 }
  readiness: { path: /health/ready, initialDelaySeconds: 5,  periodSeconds: 5 }
  startup:   { path: /health/startup, failureThreshold: 30,  periodSeconds: 2 }

service:
  # True: the gateway dials this workload by name. False is the worker case
  # (§15.3), and it is the ONE key separating Shipping's chart from this one —
  # the chapter said two until the charts were written, because it assumed a
  # service behind the edge would carry an Ingress of its own.
  enabled: true

ingress:
  # False, and written down rather than omitted (§15.3). Ordering is reached
  # through the gateway (§10.2); an Ingress here would be a second door past
  # the edge's rate limiting, CORS policy and forwarded-header handling.
  enabled: false

identity:
  # The authority, to validate incoming JWTs (§11.2) — and nothing else.
  # Identity:Client is what a host presents when it CALLS a peer (§11.5), and
  # Ordering calls none: prices come from a local projection (§6.4) and the
  # rest goes over the broker. No clientId here means no Keycloak client, no
  # secret in the vault and nothing to rotate.
  authority: https://id.example.com/realms/commerce
  # False, and written down rather than absent: §15.4's
  # required-for-some-hosts category is a claim a chart has to make, not one to
  # infer from a missing key. Exactly one chart in the platform sets it true.
  clientCredentials: false

database:
  enabled: true
  # GetConnectionString("Ordering") at runtime, "OrderingMigrator" in the hook.
  connectionName: Ordering
  runtimeSecretRef:
    name: ordering-database
    key: connection-string
  migratorSecretRef:
    name: ordering-migrator-secret
    key: connection-string

# The bus (§9). ONE SECRET PER SERVICE since #44, where both charts named
# `commerce-rabbitmq` and therefore one broker account. That account was
# `guest` locally — tagged administrator and reachable from any container —
# and a single shared principal is what made queue arrival a boundary in name
# only (§9.4): anything able to reach the broker could publish onto
# `ordering-commands` and be mapped as system-initiated.
#
# The Secret this names must carry a connection string for the `ordering-svc`
# account, whose permissions deploy/compose/rabbitmq/definitions.json declares
# and `check_permissions.py` holds to the code. **Provisioning those accounts
# on a deployed broker is an obligation this repository states and does not
# check** — the same division §15.4 draws for every Secret, and the same one
# ADR-033 and ADR-034 draw for the realm. ADR-040 narrows what an unchecked
# realm can cost without discharging the obligation: no host accepts a token
# with more than the revocation bound left to live, so a long-lived one is
# contained rather than detected, and the realm still owes the setting.
# Nothing here does even that much for a broker account.
broker:
  enabled: true
  secretRef:
    name: ordering-rabbitmq
    key: connection-string

# §8.1's two Redis connections. Required together: AddRedisConnections is one
# call and reads both eagerly, so this service either has Redis or does not.
# §8.5's IdempotencyBehavior is what reads a key today — it claims one on the
# coordination instance before any protected command runs.
redis:
  enabled: true
  # One Secret, two keys, because the two instances differ only in eviction
  # policy and are provisioned together (§8.1). Separate keys rather than one
  # value: pointing idempotency claims at the allkeys-lru instance is a
  # duplicate write that only appears under memory pressure.
  secretRef:
    name: commerce-redis
    cacheKey: cache-connection-string
    coordinationKey: coordination-connection-string

observability:
  otlpEndpoint: http://otel-collector.observability:4317

extraConfigMaps: []
