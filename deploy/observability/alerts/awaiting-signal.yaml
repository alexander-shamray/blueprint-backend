# §13.6's remaining three alerts, written out and DELIBERATELY NOT LOADED.
#
# Each one reads an instrument this platform does not publish yet. Loading them
# would be the exact defect §13.6 spends a callout on: "Two of the alerts in
# this document were written against signals that did not exist, and both looked
# correct: the dashboard is empty either way, whether the system is healthy or
# the metric was never published." A rule that cannot fire is not a weak alert,
# it is a silent one — and silence reads as health.
#
# So they live here instead, where they are visible, reviewable, and checked.
# check.py asserts three things about this file, and the third is the one that
# makes it self-clearing:
#
#   1. every rule here has a runbook, exactly as a loaded one does;
#   2. no rule here also appears in platform-alerts.yaml;
#   3. every metric named here is one that NOTHING publishes.
#
# The third means the day somebody ships the missing instrument, this gate goes
# red and names the rule to move. An "awaiting signal" list that nothing
# re-checks would quietly become a list of alerts nobody ever turned on.
#
# Naming what is owed rather than shipping a rule that cannot fire is the same
# move §13.7 makes for broker-fed read-model staleness: "an SLO nobody can
# compute is worse than an absence somebody has written down".
groups:
  - name: awaiting-signal
    rules:
      # Owed: ordering.saga.oldest_unfinalised.age, an observable gauge over
      # OrderFulfilmentState. §9.6's state machine persists every saga, so the
      # reading is a query away — there is simply no instrument over it.
      #
      # The state exclusion is not a refinement, it is the alert: every wait in
      # §9.6 other than the despatch one is bounded well inside an hour — five
      # minutes for the reservation, ten for a confirmation and ten for a stock
      # release, fifteen for a payment verdict, and thirty where Compensating
      # inherits an unanswered verdict and re-arms the wait once (#124) —
      # but the despatch wait is THREE DAYS by design. An unqualified hour would
      # page on the healthy path for most of a saga's real lifetime, and a
      # despatch that genuinely expires escalates to OrdersAwaitingReview below
      # rather than to this rule.
      #
      # The excluded state is `Confirmed`, and §13.6's prose — "excluding one
      # awaiting despatch" — describes it rather than naming it. There is no
      # `AwaitingDespatch` state: OrderFulfilmentSaga arms DespatchTimeout on
      # the transition INTO Confirmed, because the order is confirmed and now
      # waiting on Shipping. A selector spelled `AwaitingDespatch` would match
      # no series, exclude nothing, and page on every confirmed order an hour
      # after payment — a filter that reads as a safeguard and behaves as a
      # pager.
      # TWO BRANCHES, because excluding `Confirmed` outright leaves a permanent
      # blind spot — and it is the blind spot this runbook's own worst case
      # falls into. If the three-day DespatchTimeout is never delivered (the
      # scheduler failures stuck-saga.md spends half its length on), the saga
      # sits in `Confirmed` for ever: the first branch excludes it, and
      # OrdersAwaitingReview below cannot fire either, because the review row is
      # created BY that timeout. Nothing pages, and the order is stuck.
      #
      # So the second branch watches `Confirmed` against a threshold past the
      # deadline itself — four days against a three-day wait. It is not a
      # duplicate of the first: one asks "is a short wait taking an hour", the
      # other "did the long wait's own timeout arrive at all".
      - alert: StuckSaga
        expr: |
          max by (service_name) (
            ordering_saga_oldest_unfinalised_age_seconds{state!="Confirmed"}
          ) > 3600
          or
          max by (service_name) (
            ordering_saga_oldest_unfinalised_age_seconds{state="Confirmed"}
          ) > 345600
        for: 5m
        labels:
          severity: page
          owner: service
        annotations:
          summary: "A saga has been unfinalised past its wait"
          description: >-
            Orders are stuck. An hour for the short waits; four days for
            `Confirmed`, which is past the three-day despatch deadline — a
            saga still there has lost its own timeout, and no review row
            exists because that timeout is what creates one.
          runbook_url: docs/runbooks/stuck-saga.md

      # Owed: ordering.order_reviews.oldest.age, over ordering.OrderReviews.
      # StuckSaga above usually will not catch this, and §13.6 gives it a row
      # of its own for that reason. NOT because it never could: a
      # Compensating instance that survived an hour is exactly what StuckSaga
      # measures, and this comment said "will not" flatly while the lines
      # below described the case where it does. What makes the separate row
      # necessary is that the saga is normally FINALISED before its review
      # row ages to an hour, so there is no instance left to be stuck — but
      # "the saga has already finalised" is a property of the REASON, not
      # of the row, and this comment used to state it as though it were
      # universal. Reasons raised mid-wait from Compensating can sit beside
      # a live instance: payment_authorised_during_compensation, and — since
      # #126 — cancelled_after_confirmation, whose Compensating branch
      # escalates an OrderConfirmed arriving after the state was entered and
      # deliberately does not finalise. The rest are raised on the way out.
      # #143 adds TWO more, and the second breaks the timing argument that
      # used to close this comment. payment_authorised_during_compensation
      # is now also raised from AwaitingPayment, where no compensation has
      # started at all — the instance observed an early StockReleased,
      # withheld its ConfirmOrder and is waiting for its own OrderCancelled.
      # And cancelled_after_confirmation is now raised from
      # AwaitingConfirmation, by an OrderConfirmed arriving after a
      # cancellation was observed; that branch escalates and then
      # TRANSITIONS TO Confirmed, where the instance can sit out the
      # three-day despatch wait.
      #
      # So "every newly live row is bounded well inside the hour" is FALSE,
      # and stating it would have been the third universal this comment got
      # wrong. The bound is per WAIT rather than per state, and the waits
      # differ by three orders of magnitude: the ten-minute release wait, a
      # payment verdict bounded at thirty minutes from AuthorisePayment
      # (#124) and the fifteen-minute PaymentTimeout behind the
      # AwaitingPayment raising all end well inside the hour — the
      # AwaitingConfirmation raising does not, and an operator meeting that
      # row should expect a live instance in Confirmed rather than a
      # finalised one.
      #
      # That is a reason to read CurrentState rather than to infer it, which
      # is what order-review.md's step 2 now says. StuckSaga's own four-day
      # branch is what bounds this case, and the two alerts coinciding on
      # one order is the ordinary shape of it rather than a double fault.
      #
      # "Every other reason is raised on the way out" was the shape this
      # comment had after its first correction, and #126 falsified it the
      # same way the sentence before it had been falsified — a universal
      # asserted over a vocabulary that grows. What holds is the predicate:
      # a reason raised by a branch with no Finalize can outlive its row's
      # first hour, and only the branch knows.
      #
      # #124 narrowed that predicate without breaking it, and the narrowing
      # is worth stating because it runs in the direction nobody checks.
      # Compensating now finalises on a JOIN — the stock half settled and no
      # payment verdict outstanding — so the branch raising
      # payment_authorised_during_compensation carries a CONDITIONAL Finalize:
      # it ends the instance in the same transition that raises the row when
      # the stock half has already settled, and leaves it standing when it
      # has not. So "raised mid-wait" no longer implies a live instance
      # either. The predicate holds with "no Finalize" read as "no
      # UNCONDITIONAL Finalize", and the branch alone stopped being able to
      # answer — the instance is what says which.
      - alert: OrdersAwaitingReview
        expr: max by (service_name) (ordering_order_reviews_oldest_age_seconds) > 3600
        for: 5m
        labels:
          severity: ticket
          owner: service
        annotations:
          summary: "An order has been awaiting manual review for over an hour"
          description: >-
            A saga escalated work it cannot finish itself (§9.6): a wait that
            ran out, an authorisation that landed while compensation was
            already under way, or a confirmation that did — which is not the
            same as a cancellation existing, and not necessarily a customer
            cancelling. Do NOT refund before reading the runbook:
            Payments voids off OrderCancelled on its own and nothing here
            knows whether it has, so a manual refund may be the second one.
            The saga has
            usually finalised by now, so the saga-age alert will not catch it
            — but check the instance before assuming rather than reading the
            reason: some are raised mid-wait, and since #124 one of them
            finalises or not depending on what else the saga was still owed.
            The runbook branches on all of it.
          runbook_url: docs/runbooks/order-review.md

      # OWED AN INSTRUMENT, AND IT IS THE ONE NO GATE HERE CAN WATCH.
      #
      # This said "owed twice over" and named a missing consumer first. That
      # half is closed at the level §15.4 asks about: §8.5's PR gave
      # AddRedisConnections its first callers in Catalog and Ordering, so both
      # hosts REGISTER the cache stack and the two Redis rows are required.
      #
      # A correction on top of that correction: registering is not
      # constructing. This comment said a HybridCache "IS constructed in both
      # hosts", and DI builds a singleton when something resolves it — nothing
      # in src/ injects HybridCache at all. So no cache object exists, which
      # is a THIRD state after "no caller" and "a caller", and none of the
      # three is what this alert waits on.
      #
      # What is still owed is the instrument, below — and the note under it
      # already said wiring Redis would not supply it, so this file
      # half-anticipated its own correction.
      #
      # Measured against the pinned package rather than assumed:
      # Microsoft.Extensions.Caching.Hybrid 10.0.0 references
      # System.Diagnostics.Tracing and NOT System.Diagnostics.Metrics. It
      # reports through HybridCacheEventSource with PollingCounter — that is
      # EventCounters, not a Meter. §13.2's AddMeter for this name therefore
      # collects nothing, and wiring Redis would not change that. A registered
      # meter with no publisher is precisely the trap this file exists for, and
      # the AddMeter line is what makes it look wired.
      #
      # So the metric names below are what an EventCounters-to-OTel bridge would
      # plausibly export, and NOT names read off a running system. They are here
      # to keep the rule reviewable; whoever lands the bridge owns confirming
      # them, and check 5 will go red on the instrument arriving.
      #
      # The expression is derived rather than measured, per §13.6: a ratio is
      # computed from the hit and miss counters and is not published as one, so
      # what is written here is the expression and never an invented ratio name.
      - alert: CacheHitRatioCollapse
        # THE DENOMINATOR IS UNCLAMPED, and that is the whole of the
        # correctness here. An earlier draft wrapped it in `clamp_min(…, 1)` to
        # avoid dividing by zero — which turns an IDLE cache into a firing
        # alert: no hits and no misses gives 0 / 1 = 0, which is below 0.5.
        # Unclamped, 0 / 0 is NaN, the series drops out, and the rule stays
        # quiet until there is traffic to judge. Prometheus's own idiom, and
        # the reason it is the idiom.
        # EACH COUNTER DEFAULTS TO ZERO; THE DENOMINATOR STAYS UNCLAMPED. Two
        # separate traps, and the fixes pull in opposite directions.
        #
        # A cold cache can have misses and no hit series at all — the all-miss
        # case this rule is *for*. `sum()` over an absent vector is absent, so
        # the division produces nothing and the alert stays silent at a hit
        # ratio of zero. `or vector(0)` on each sum fixes that.
        #
        # But an earlier draft wrapped the denominator in `clamp_min(…, 1)` to
        # avoid dividing by zero, which fires on an IDLE cache: 0 / 1 = 0, below
        # 0.5. Unclamped, an idle cache gives 0 / 0 = NaN, the series drops out,
        # and the rule waits for traffic. Both properties hold together: with
        # misses and no hits it evaluates 0 / n; with neither it evaluates
        # 0 / 0 and stays quiet.
        expr: |
          (sum(rate(hybrid_cache_hits_total[10m])) or vector(0))
          /
          (
            (sum(rate(hybrid_cache_hits_total[10m])) or vector(0))
            +
            (sum(rate(hybrid_cache_misses_total[10m])) or vector(0))
          )
          < 0.5
        for: 10m
        labels:
          severity: page
          owner: platform
        annotations:
          summary: "Cache hit ratio below 50%"
          description: >-
            Redis lost its working set. Every miss becomes a database read, and
            the databases are sized for a warm cache (ADR-006).
          runbook_url: docs/runbooks/redis-cold.md

