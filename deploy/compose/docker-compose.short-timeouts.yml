# §14.1's by-hand lever for §9.6's five waits, cut to seconds so each expiry
# branch is reached without the test hook. Not part of `up`: add it to the
# full-stack command deploy/compose/README.md gives, never to the infra-only
# one, whose Ordering runs on the host. OrderFulfilmentTimeouts reads these
# (ADR-128) and refuses a value under a second.
services:
  ordering-api:
    environment:
      Saga__StockTimeoutDelay: "00:00:20"
      Saga__PaymentTimeoutDelay: "00:00:30"
      Saga__ConfirmationTimeoutDelay: "00:00:30"
      Saga__ReleaseTimeoutDelay: "00:00:30"
      Saga__DespatchTimeoutDelay: "00:01:00"
