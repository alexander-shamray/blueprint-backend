# §14.1's by-hand lever for §9.6's five waits: the saga's delays, cut from
# minutes and days to seconds, so a developer reaches each expiry branch of
# the compensation journey without the test hook. Not part of `up`; add it to
# the full-stack command deploy/compose/README.md gives, never to the
# infra-only one, whose Ordering runs on the host. Ordering reads these as
# OrderFulfilmentTimeouts (ADR-128) and refuses a value under a second.
services:
  ordering-api:
    environment:
      Saga__StockTimeoutDelay: "00:00:20"
      Saga__PaymentTimeoutDelay: "00:00:30"
      Saga__ConfirmationTimeoutDelay: "00:00:30"
      Saga__ReleaseTimeoutDelay: "00:00:30"
      Saga__DespatchTimeoutDelay: "00:01:00"
