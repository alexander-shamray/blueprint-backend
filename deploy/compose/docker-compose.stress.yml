# ADR-157's stress override, for deploy/observability/README.md's stress run
# alone, never a deployment: it lifts the edge's rate limits, unpaces the
# workers, scales Ordering (ADR-158), samples traces (ADR-160), bounds the
# observer (ADR-162) and carries the run's k6 (ADR-170). No other Compose file
# sets its environment keys or limits, so `up` without it restores them all.

# Not part of `up`: add it to the full-stack command deploy/compose/README.md
# gives. Each service's suite reads this file, so a value the service's
# validator would refuse fails a test rather than the run's start.

# Every request traced in full made Tempo the observer's largest cost, so a
# host keeps the share of its traces this names, each whole. Every host that
# exports telemetry merges this into its environment, and Common.Web's suite
# holds it.
x-trace-sampling: &trace-sampling
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "0.1"

services:
  # Every client comes from one address, so §10.3's anonymous window would
  # measure only itself; each budget is far past what one host can drive.
  # The edge's request lines would refill the log queue ADR-159 empties.
  gateway:
    environment:
      <<: *trace-sampling
      RateLimits__AnonymousPermitLimit: "1000000"
      RateLimits__AuthenticatedTokenLimit: "1000000"
      RateLimits__AuthenticatedTokensPerPeriod: "1000000"
      Logging__LogLevel__Microsoft.AspNetCore.Hosting: "Warning"
      Logging__LogLevel__Yarp.ReverseProxy.Forwarder: "Warning"

  catalog-api:
    environment:
      <<: *trace-sampling

  inventory-api:
    environment:
      <<: *trace-sampling

  payments-api:
    environment:
      <<: *trace-sampling

  privacy-api:
    environment:
      <<: *trace-sampling

  notifications-api:
    environment:
      <<: *trace-sampling

  web-bff:
    environment:
      <<: *trace-sampling

  # The carrier answers at once (WireMock), so a large batch on a short tick
  # takes its booking rate out of the run. A fulfilment pass books its rows
  # in turn, so the lease covers fifty of CarrierPacingOptions'
  # FulfilmentRowBudget, rounded up.
  shipping-worker:
    environment:
      <<: *trace-sampling
      CarrierPacing__FulfilmentClaimBatchSize: "50"
      CarrierPacing__FulfilmentLeaseSeconds: "2160"
      CarrierPacing__FulfilmentTick: "00:00:01"
      CarrierPacing__TrackingClaimBatchSize: "200"
      CarrierPacing__TrackingTick: "00:00:01"
      CarrierPacing__TrackingPollInterval: "00:00:05"

  # The relay is MailPit and the push providers are WireMock. Both loops send
  # a pass's rows at once, so the default leases already cover any batch.
  notifications-worker:
    environment:
      <<: *trace-sampling
      SendPacing__SendClaimBatchSize: "200"
      SendPacing__SendTick: "00:00:01"
      SendPacing__PushClaimBatchSize: "200"
      SendPacing__PushTick: "00:00:01"

  # Ordering's chart floor, autoscaling.minReplicas, since each replica runs an
  # outbox dispatcher and one would measure a third of the drain the chart
  # deploys. The gateway reaches it by name, so the host port goes.
  ordering-api:
    environment:
      <<: *trace-sampling
    ports: !reset []
    deploy:
      replicas: 3

  # The observer shares the machine it measures, so it is held to a part of
  # it, and the collector's memory_limiter takes its ceiling from mem_limit.
  # Adding or dropping the override recreates both containers, and the LGTM
  # container's stores go with it.
  grafana:
    cpus: "2"
    mem_limit: 8g

  otel-collector:
    cpus: "1"
    mem_limit: 512m

  # The generator, on the stack's network rather than on Windows, where its
  # requests crossed Docker Desktop's port forward. Started by `run` alone,
  # never by `up`. The repository's paths are mounted where the run's own
  # relative paths find them, and STRESS_OUT is written through to the host.
  k6:
    image: grafana/k6:2.3.0
    profiles: [ "stress-run" ]
    working_dir: /repo
    volumes:
      - ../observability/stress:/repo/deploy/observability/stress:ro
      - ../../artifacts/stress:/repo/artifacts/stress
    environment:
      - KEYCLOAK_ADMIN_PASSWORD
      - BASE_URL=http://gateway:8080
      - KEYCLOAK_URL=http://keycloak:8080
      - PROM_URL=http://grafana:3000/api/datasources/proxy/uid/prometheus
