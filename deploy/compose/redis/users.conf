# §8.1's per-service ACL users, read as the configuration file of both Redis
# instances in §14.1's model. Each key pattern is its host's ApplicationName,
# the prefix RedisKeys writes into every key (§8.3), and each grant is §8.1's.
# The passwords are §14.1's local defaults (docs/secrets.md).

# The default user may PING and nothing else: what the healthchecks ask.
user default on nopass resetkeys resetchannels -@all +ping

user catalog-svc on >local-dev-catalog ~Catalog.Api:* +@read +@write +@keyspace +@connection +eval -@dangerous +client|setname +client|setinfo
user inventory-svc on >local-dev-inventory ~Inventory.Api:* +@read +@write +@keyspace +@connection +eval -@dangerous +client|setname +client|setinfo
user ordering-svc on >local-dev-ordering ~Ordering.Api:* +@read +@write +@keyspace +@connection +eval -@dangerous +client|setname +client|setinfo
