# The collector §14.1 mounts. OTLP in on both protocols, plus a scrape of the
# broker, batch, OTLP out to the LGTM container — which ingests OTLP directly
# on 4318.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # The only receiver that pulls. The broker publishes Prometheus text, not
  # OTLP, and the LGTM container's own Prometheus scrapes nothing but itself,
  # so without this §13.6's queue alerts read a series nobody publishes.
  # Per-queue output is switched on in rabbitmq/Dockerfile; port 15692 is
  # reachable on the Compose network only.
  prometheus/rabbitmq:
    config:
      scrape_configs:
        - job_name: rabbitmq
          scrape_interval: 15s
          static_configs:
            - targets: [ "rabbitmq:15692" ]

processors:
  # First in every pipeline, so a full collector refuses what it is sent and
  # stays up, rather than being killed with all it holds. Sized as a share of
  # the container's limit, which only the stress override sets (ADR-162).
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25

  batch:

  # §15.5's canary compares two tracks, and this is what makes the label it
  # compares on exist.
  #
  # `deployment.track` is a RESOURCE attribute (§13.2, set from
  # OTEL_RESOURCE_ATTRIBUTES by the chart). Under the standard OTLP-to-
  # Prometheus mapping, resource attributes other than service.name,
  # service.namespace and service.instance.id do not become labels on each
  # series — they land in `target_info` instead. So a query filtering
  # `deployment_track="canary"` matches NOTHING, `read_prometheus` returns
  # null, and `analyse` reads that as an absent series and rolls back: every
  # rung, every time, on a canary that is behaving perfectly.
  #
  # Copying it onto the datapoint is what turns it into a label. Only this one
  # attribute, because every promoted resource attribute is a label on every
  # series of every service and cardinality is paid for per series;
  # `deployment.track` has two values.
  #
  # THE DEPLOYED COLLECTOR MUST DO THE SAME. This file is §14.1's local one and
  # the cluster's is not in this repository, so the requirement is recorded in
  # ADR-022 and in deploy/canary/README.md rather than being satisfied here for
  # an environment this cannot reach.
  # `datapoint.attributes`, spelled with its context prefix. Written as a bare
  # `attributes[…]` the collector accepts it and logs "one or more paths were
  # modified to include their context prefix, please rewrite them accordingly"
  # — measured by running this file against the pinned image, which is also how
  # the statement below was established to parse at all. A form the tool
  # rewrites for you is a form it may stop rewriting.
  transform/canary-track:
    metric_statements:
      - context: datapoint
        statements:
          - set(datapoint.attributes["deployment.track"], resource.attributes["deployment.track"])
            where resource.attributes["deployment.track"] != nil

exporters:
  otlphttp:
    endpoint: http://grafana:4318

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp]
    metrics:
      receivers: [otlp, prometheus/rabbitmq]
      processors: [memory_limiter, transform/canary-track, batch]
      exporters: [otlphttp]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp]
