# §14.1's baseline index, which declares no service of its own: a unit's
# environment lives in the file below that names it, for the reason §14.1
# gives. §14.1 also owns how `include` resolves a unit's relative paths and
# how the `.env` beside this file reaches every included one.
name: commerce

include:
  # The shared baseline: SQL Server, both Redis instances, the broker,
  # Keycloak, the collector, Grafana, and the volumes they own. One file
  # because it is shared by construction — nothing in it belongs to a service,
  # so splitting it per service would divide it along a line that is not there.
  - infrastructure.yml

  # One file per deployable unit, a host's as much as a service's; README.md
  # lists them.
  - services/catalog.yml
  - services/gateway.yml
  - services/ordering.yml
  - services/web-bff.yml
  - services/inventory.yml
  - services/payments.yml
  - services/shipping.yml
  - services/notifications.yml
