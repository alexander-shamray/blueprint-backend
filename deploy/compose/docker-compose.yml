# The baseline environment of §14.1, delivered in Appendix C's order:
# infrastructure at PR-06, each application block with the PR that builds
# its image. docs/backend-architecture/14-local-development.md is the
# specification; this file must stay reconciled with it.
#
# This file is an index and declares no service of its own. A unit's
# environment lives in the file below that names it, so two agents adding or
# changing two services never meet in one file — docs/change-locality.md's rule
# applied to the one deployment artefact every service PR has to edit.
#
# `include` resolves a relative path against the directory of the file that
# declares it rather than against this one, which is why a `build.context`
# under `services/` is written one level deeper than the same path would be
# here, and why `infrastructure.yml`, which sits beside this file, spells its
# paths relative to the compose directory. Measured with `docker compose config`,
# because a bind mount that resolves to the wrong directory is a container that
# starts and reads nothing.
#
# Interpolation does NOT follow that rule and it would be a poor thing to
# assume either way: `.env` beside this file reaches every included file, so
# §14.1's `${…}` defaults mean the same thing wherever they live. Measured the
# same way.
name: commerce

include:
  # The shared baseline: SQL Server, both Redis instances, the broker,
  # Keycloak, the collector, Grafana, and the volumes they own. One file
  # because it is shared by construction — nothing in it belongs to a service,
  # so splitting it per service would divide it along a line that is not there.
  - infrastructure.yml

  # One file per deployable unit. A service arriving adds a file and this one
  # line, and touches nothing already written, which is the whole of why the
  # split exists. The gateway and the BFF are hosts rather than services —
  # docs/change-locality.md section 3 says so — and they are here for the
  # reason `classes.yml` gives them a class at all: a host owns its deployment
  # exactly as a service owns its own.
  - services/catalog.yml
  - services/gateway.yml
  - services/ordering.yml
  - services/web-bff.yml
  - services/inventory.yml
