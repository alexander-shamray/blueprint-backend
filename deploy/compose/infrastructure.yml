# The shared baseline of §14.1, included by deploy/compose/docker-compose.yml:
# what every service talks to, plus the volumes that outlive a `down`. No
# service owns any of it. docs/backend-architecture/14-local-development.md
# specifies it; its paths resolve against the compose directory, as the
# including file sits there too.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD:-Local_Dev_Pa55w0rd!}"
      MSSQL_PID: Developer
    # Every mapping in the model publishes on 127.0.0.1, this file's and every
    # unit's alike: the credentials here are development defaults (§14.1), so
    # the interface is the control in front of them, and a mapping with no
    # host-IP prefix binds every interface. §14.1's endpoint callout argues it.
    ports: [ "127.0.0.1:1433:1433" ]
    volumes: [ sql-data:/var/opt/mssql ]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Two Redis instances, because eviction policy cannot be shared — §8.1.
  redis-cache:
    image: redis:8.10.0-alpine
    # §8.1's per-service ACL users, as the configuration file both instances read.
    command: redis-server /usr/local/etc/redis/users.conf --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports: [ "127.0.0.1:6379:6379" ]
    volumes: [ ./redis/users.conf:/usr/local/etc/redis/users.conf:ro ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  redis-coordination:
    image: redis:8.10.0-alpine
    # noeviction: locks and idempotency keys must never be evicted. The
    # {service}:denylist: namespace §8.1 reserves beside them has no writer
    # (ADR-033). Appendonly so a restart does not silently release held locks.
    command: redis-server /usr/local/etc/redis/users.conf --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    ports: [ "127.0.0.1:6380:6379" ]
    volumes: [ "redis-coordination-data:/data", "./redis/users.conf:/usr/local/etc/redis/users.conf:ro" ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  # Built rather than pulled, and the only infrastructure service that is
  # (§14.1). rabbitmq/Dockerfile adds the delayed message exchange plugin
  # §9.6's saga timeouts are scheduled through (ADR-021); the base image
  # is still an official tag, one line inside it.
  rabbitmq:
    build:
      context: rabbitmq
    ports: [ "127.0.0.1:5672:5672", "127.0.0.1:15672:15672" ]
    volumes: [ rabbit-data:/var/lib/rabbitmq ]
    healthcheck:
      # Both applications, asked of the running node in one call (§14.1): a
      # broker without the plugin runs healthy while every saga schedule hangs
      # (ADR-021). The cookie test comes first, because this runs as root and a
      # call that creates the cookie ahead of the broker leaves it unreadable.
      # erlang:error is the non-zero exit, and halt would stop the broker.
      test: ["CMD-SHELL", "test -f /var/lib/rabbitmq/.erlang.cookie && rabbitmqctl eval 'A = [N || {N, _, _} <- application:which_applications()], [rabbit, rabbitmq_delayed_message_exchange] -- A =:= [] orelse erlang:error(not_running).'"]
      interval: 30s
      # Quick while starting so `up --wait` is not held for a steady-state
      # interval; the key's floor is §14.1's.
      start_period: 60s
      start_interval: 2s
      retries: 3

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1-1
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # One issuer, whichever host asks: Keycloak otherwise derives it from
      # each request's Host header, so a token minted through localhost:8080
      # fails ValidateIssuer against the discovery document catalog-api reads
      # at http://keycloak:8080/.
      KC_HOSTNAME: http://localhost:8080
      # ...which leaves the container-side route to be restored: with a fixed
      # hostname Keycloak would otherwise advertise localhost:8080 for the
      # backchannel too, and catalog-api cannot reach that. Dynamic backchannel
      # resolves the endpoints from the request host while the issuer stays
      # frontend, which is exactly the split this needs.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Turns on /health/ready, on the management port, which is what the
      # healthcheck below reads. Off by default.
      KC_HEALTH_ENABLED: "true"
    ports: [ "127.0.0.1:8080:8080" ]
    volumes: [ ./keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro ]
    # The image has a shell but no curl or wget, so the check is a bash TCP
    # redirection against the management port, Keycloak's documented form.
    # Without it `up --wait` returns before the realm has finished importing.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '\"status\": \"UP\"'"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ADR-106's local object store: SeaweedFS, because its S3 API takes a pre-signed PUT, scopes a credential pair to
  # a bucket prefix and serves an anonymous read from one prefix alone, which is the §10.8 permission model. Two
  # credential pairs, neither able to list or delete; object-store/s3.json holds them and object-store/policies/
  # what each may do. A deployment supplies its own store.
  object-store:
    image: chrislusf/seaweedfs:4.47
    command: [ "server", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data" ]
    # The S3 endpoint a client PUTs to (§10.8), so a phone on this machine reaches what the BFF signed.
    ports: [ "127.0.0.1:8333:8333" ]
    volumes: [ "object-store-data:/data", "./object-store/s3.json:/etc/seaweedfs/s3.json:ro" ]
    healthcheck:
      # 127.0.0.1 and not localhost, which busybox resolves to ::1 first; the S3 listener is IPv4.
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status" ]
      interval: 5s
      retries: 20
      start_period: 10s

  # The bucket, the two policies and the one-day expiry on uploads/ (§10.8), as a one-shot like the migrators.
  # Idempotent, so a second `up` leaves the first one's bucket, policies and rule as they were.
  object-store-init:
    image: chrislusf/seaweedfs:4.47
    entrypoint: [ "/bin/sh", "-c", "weed shell -master=object-store:9333 < /etc/seaweedfs/init.txt" ]
    volumes:
      - ./object-store/init.txt:/etc/seaweedfs/init.txt:ro
      - ./object-store/policies:/etc/seaweedfs/policies:ro
    depends_on:
      object-store: { condition: service_healthy }
    restart: "no"

  # §10.8: the public image is served by the layer in front of the store, which sets nosniff. products/ alone, GET
  # and HEAD alone, and nothing from uploads/.
  image-edge:
    image: nginx:1.31.0-alpine
    ports: [ "127.0.0.1:9000:8080" ]
    volumes: [ "./object-store/edge.conf:/etc/nginx/conf.d/default.conf:ro" ]
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz" ]
      interval: 5s
      retries: 10
    depends_on:
      object-store: { condition: service_healthy }

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2
    command: [ "--config=/etc/otel/config.yaml" ]
    volumes: [ ./otel/config.yaml:/etc/otel/config.yaml:ro ]
    ports: [ "127.0.0.1:4317:4317", "127.0.0.1:4318:4318" ]

  grafana:
    image: grafana/otel-lgtm:0.38.1
    # The bundled Prometheus takes no rule-file flag or variable, so its own
    # config gains the rule_files key at start instead of being copied here;
    # the guard keeps a restart from appending it twice. Only the loaded file
    # is named, because awaiting-signal.yaml's rules cannot fire (§13.6).
    command:
      - bash
      - -c
      - >-
        rm -f /tmp/ready;
        grep -q '^rule_files:' prometheus.yaml
        || echo 'rule_files: [ /etc/prometheus/rules/platform-alerts.yaml ]' >> prometheus.yaml;
        exec ./run-all.sh
    # run-all.sh touches /tmp/ready once every component is up; the command
    # removes it first, so a restart is not read healthy from the last run.
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      retries: 30
      start_period: 30s
    ports: [ "127.0.0.1:3000:3000" ]
    volumes:
      - ../observability/alerts/platform-alerts.yaml:/etc/prometheus/rules/platform-alerts.yaml:ro
      - ../observability/dashboards:/etc/platform/dashboards:ro
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/platform.yaml:ro

volumes:
  sql-data:
  redis-coordination-data:
  rabbit-data:
  object-store-data:
