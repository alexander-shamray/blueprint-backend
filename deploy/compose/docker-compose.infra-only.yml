# §14.1's inner-loop override, a profile per application service: §14.1 says
# why a profile excludes one and why every unit the index includes joins this
# list. Take the host command from deploy/compose/README.md, whose Kestrel
# exports move a host-run Catalog off 8080, Keycloak's published port.
services:
  catalog-migrator:
    profiles: [ "excluded" ]
  catalog-api:
    profiles: [ "excluded" ]
  gateway:
    profiles: [ "excluded" ]
  ordering-migrator:
    profiles: [ "excluded" ]
  ordering-api:
    profiles: [ "excluded" ]
  bff-migrator:
    profiles: [ "excluded" ]
  web-bff:
    profiles: [ "excluded" ]
  inventory-migrator:
    profiles: [ "excluded" ]
  inventory-api:
    profiles: [ "excluded" ]
  payments-migrator:
    profiles: [ "excluded" ]
  payments-api:
    profiles: [ "excluded" ]
  shipping-migrator:
    profiles: [ "excluded" ]
  shipping-worker:
    profiles: [ "excluded" ]
  notifications-migrator:
    profiles: [ "excluded" ]
  notifications-worker:
    profiles: [ "excluded" ]
