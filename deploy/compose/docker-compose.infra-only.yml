# §14.1's inner-loop override: infrastructure in containers, the service on
# the host with a debugger attached. Assigning a profile removes a service
# from the default `up` — profiles gate activation, and nothing activates
# this one — which is the declarative way to exclude a service an override
# file cannot delete. Every service under services/ joins this list in the PR
# that adds its file, and this file stays a shared surface for the reason a
# profile is: an override merges over a resolved model, so it cannot be split
# per service the way the model itself now is.
#
# Both commands run from the repository root — one working directory:
#
#   docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.infra-only.yml up -d
#
# ...then the host process. **Take that second command from README.md rather
# than from here**, and this comment used to paste it: since PR-19, Catalog's
# appsettings.json declares Kestrel:Endpoints, which suppresses
# ASPNETCORE_URLS and ASPNETCORE_HTTP_PORTS entirely and pins 8080 — Keycloak's
# published port. A host-run Catalog therefore needs two
# Kestrel__Endpoints__…__Url exports, and a copy of the invocation here would
# be one more place for them to be missing.
services:
  catalog-migrator:
    profiles: [ "excluded" ]
  catalog-api:
    profiles: [ "excluded" ]
  gateway:
    profiles: [ "excluded" ]
  ordering-migrator:
    profiles: [ "excluded" ]
  ordering-api:
    profiles: [ "excluded" ]
  web-bff:
    profiles: [ "excluded" ]
  inventory-migrator:
    profiles: [ "excluded" ]
  inventory-api:
    profiles: [ "excluded" ]
