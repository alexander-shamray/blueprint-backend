server {
    listen 8080;

    # The compose healthcheck, answered here so a store that is still starting does not make the edge unready.
    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # §10.8: the public image is served from products/ alone, never uploads/, and only to a read.
    location /products/ {
        limit_except GET HEAD {
            deny all;
        }

        proxy_pass http://object-store:8333/product-images/products/;

        # §10.6's header, which §10.8 makes the serving layer's to set: the store does not.
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        return 404;
    }
}
