# Notifications: the pair tools/new-service renders from the template's unit (§4.5).
services:
  # §14.1's pair rule: a {service}-migrator one-shot plus the service itself,
  # gated on `condition: service_completed_successfully` — every service owns
  # a database and none may migrate at startup (§4.1, ADR-007).
  notifications-migrator:
    build:
      context: ../../..
      dockerfile: src/Services/Notifications/Notifications.Migrator/Dockerfile
    environment:
      # Migrator identity (DDL) — §7.1. Locally both keys resolve to the one
      # sa login (§14.2's stated simplification); the KEY still differs, so
      # the migrator reads the name it will read in production. The default is
      # inline because .env.example promises every variable one — §14.1's bare
      # `${…}` would break `docker compose up` on a clean checkout.
      ConnectionStrings__NotificationsMigrator: "${NOTIFICATIONS_MIGRATOR_CONNECTION:-Server=sql;Database=Notifications;User Id=sa;Password=${SQL_PASSWORD:-Local_Dev_Pa55w0rd!};TrustServerCertificate=True}"
    depends_on:
      sql: { condition: service_healthy }
    restart: "no"

  # Notifications' relay, a sink: every message the stack sends lands here and nowhere else. Both ports bind
  # loopback alone: the UI shows every message to whoever reaches it, and SMTP is what a worker run on the host
  # under docker-compose.infra-only.yml submits to. The tag is the one the suite starts (§14.1).
  mailpit:
    image: axllent/mailpit:v1.31.3
    environment:
      # The API that stages a refusing or failing relay, at PUT /api/v1/chaos.
      MP_ENABLE_CHAOS: "true"
    ports: [ "127.0.0.1:1025:1025", "127.0.0.1:8025:8025" ]

  notifications-worker:
    build:
      context: ../../..
      dockerfile: src/Services/Notifications/Notifications.Worker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Runtime identity (DML only) — never the migrator connection.
      ConnectionStrings__Notifications: "${NOTIFICATIONS_CONNECTION:-Server=sql;Database=Notifications;User Id=sa;Password=${SQL_PASSWORD:-Local_Dev_Pa55w0rd!};TrustServerCertificate=True}"
      # The bus (§9). AddMassTransitMessaging throws without it, so this line is
      # what lets the host start. A plain value, §14.1's local default rather
      # than a secret, under this service's own account rather than the base
      # image's administrator `guest`, which 20-commerce.conf removes (ADR-036).
      ConnectionStrings__RabbitMq: "amqp://notifications-svc:local-dev-notifications@rabbitmq:5672"
      # The authority, to validate inbound tokens (§11.2). Read eagerly by
      # AddJwtAuthentication, which throws naming the key — so this line is
      # what lets the host start, exactly like the bus one above.
      Identity__Authority: "http://keycloak:8080/realms/commerce"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      # The relay, read and validated at start (§15.4). None and no credential are Development's alone: the
      # sink takes plain, unauthenticated submission, so this unit carries no Mail__UserName or Mail__Password.
      Mail__Host: "mailpit"
      Mail__Port: "1025"
      Mail__From: "Commerce <no-reply@commerce.test>"
      Mail__Security: "None"
      # ADR-052's contact read: the realm's admin API, under the realm that issues this host's token. Read and
      # checked at start; plain HTTP is Development's alone (§15.4).
      ContactSource__BaseUrl: "http://keycloak:8080/"
      ContactSource__Realm: "commerce"
      # Required by ValidateOnStart (§15.4); the default is the realm export's. roles is the scope whose mapper
      # writes the realm-management roles this host checks; it takes no commerce-api, so no service accepts it.
      Identity__Client__ClientId: "notifications-worker"
      Identity__Client__ClientSecret: "${NOTIFICATIONS_CLIENT_SECRET:-local-dev-notifications-secret}"
      Identity__Client__Scope: "roles"
      # Made-up values: a developer's stack is no jurisdiction, and a real one belongs in a values file (ADR-053
      # rule 1). Every shipped language, so a local message shows all three; a list binds by index (§15.4).
      Jurisdiction__Languages__0: "en"
      Jurisdiction__Languages__1: "kk"
      Jurisdiction__Languages__2: "ru"
      Jurisdiction__TimeZone: "Asia/Kathmandu"
      Jurisdiction__LogRetention: "1001.00:00:00"
      Jurisdiction__ContactRetention: "13.00:00:00"
      Jurisdiction__OrderRetention: "97.00:00:00"
      # ADR-052's give-up age: a notice a day late is worse than none, and an
      # operator lengthens it during an outage rather than a release.
      Delivery__GiveUpAge: "1.00:00:00"
    # §13.5's readiness, asked by the host itself through HealthProbe, because
    # the image has no shell or HTTP client; the timeout outlasts the probe's.
    healthcheck:
      test: [ "CMD", "dotnet", "Notifications.Worker.dll", "--probe" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      notifications-migrator: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      mailpit: { condition: service_healthy }
      # The first contact read asks the realm for a token, which races the import under service_started.
      keycloak: { condition: service_healthy }
