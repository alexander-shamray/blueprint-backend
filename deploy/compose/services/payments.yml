# Payments's deployment (§14.1), included by deploy/compose/docker-compose.yml.
# Rendered by tools/new-service from the template service's unit file: the
# pair rule below belongs to the chapter, and the file boundary belongs to
# docs/change-locality.md, so a Payments PR edits this file and never
# another service's.
#
# `include` resolves a relative path against the directory of the file that
# declares it, so the repository root — the build context — is three levels up
# from here.
services:
  # §14.1's pair rule: a {service}-migrator one-shot plus the service itself,
  # gated on `condition: service_completed_successfully` — every service owns
  # a database and none may migrate at startup (§4.1, ADR-007).
  payments-migrator:
    build:
      context: ../../..
      dockerfile: src/Services/Payments/Payments.Migrator/Dockerfile
    environment:
      # Migrator identity (DDL) — §7.1. Locally both keys resolve to the one
      # sa login (§14.2's stated simplification); the KEY still differs, so
      # the migrator reads the name it will read in production. The default is
      # inline because .env.example promises every variable one — §14.1's bare
      # `${…}` would break `docker compose up` on a clean checkout.
      ConnectionStrings__PaymentsMigrator: "${PAYMENTS_MIGRATOR_CONNECTION:-Server=sql;Database=Payments;User Id=sa;Password=${SQL_PASSWORD:-Local_Dev_Pa55w0rd!};TrustServerCertificate=True}"
    depends_on:
      sql: { condition: service_healthy }
    restart: "no"

  # §3.2's provider, simulated (spec section 9). Payments' own dependency,
  # so it lives in Payments' unit rather than the shared baseline, and
  # docker-compose.infra-only.yml keeps it, since a Payments host run from an
  # IDE needs it as much as a containerised one. The tag is
  # Directory.Packages.props' WireMock.Net pin: one engine, one version, one
  # set of mappings for this container and the tests.
  psp-simulator:
    image: sheyenrath/wiremock.net:2.12.0
    # The image does not read static mappings by default; without this flag
    # every request answers 404 and spec section 9's mappings never load.
    command: [ "--ReadStaticMappings", "true" ]
    volumes:
      - ../psp-simulator/mappings:/app/__admin/mappings:ro
    ports: [ "127.0.0.1:5190:80" ]

  payments-api:
    build:
      context: ../../..
      dockerfile: src/Services/Payments/Payments.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Runtime identity (DML only) — never the migrator connection.
      ConnectionStrings__Payments: "${PAYMENTS_CONNECTION:-Server=sql;Database=Payments;User Id=sa;Password=${SQL_PASSWORD:-Local_Dev_Pa55w0rd!};TrustServerCertificate=True}"
      # The bus (§9), read by AddMassTransitMessaging — which throws without
      # it, so this line is what lets the host start. A plain value, no ${…}
      # variable: this is §14.1's local default, not a secret with a production
      # shape, and .env.example's contract covers variables, not constants.
      #
      # `payments-svc`, not `guest`: the broker enforces per-service write
      # permissions (§9.4), so no principal reachable from any container can
      # publish onto another service's queue; deploy/compose/rabbitmq/Dockerfile
      # carries which ones.
      ConnectionStrings__RabbitMq: "amqp://payments-svc:local-dev-payments@rabbitmq:5672"
      # The authority, to validate inbound tokens (§11.2). Read eagerly by
      # AddJwtAuthentication, which throws naming the key — so this line is
      # what lets the host start, exactly like the bus one above. No
      # Identity__Client__*: Payments calls no peer synchronously, and outbound
      # identity belongs to the BFF alone (§9.7, §11.5).
      Identity__Authority: "http://keycloak:8080/realms/commerce"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      PaymentProvider__BaseUrl: "http://psp-simulator/"
      # §14.1's local-development exception: the simulator ignores it.
      PaymentProvider__ApiKey: "local-dev-psp"
    ports: [ "127.0.0.1:5104:8080" ]
    depends_on:
      payments-migrator: { condition: service_completed_successfully }
      psp-simulator: { condition: service_started }
      rabbitmq: { condition: service_healthy }
      # service_healthy since infrastructure.yml's keycloak declares a
      # healthcheck. The API
      # itself does not need it — JwtBearer fetches the discovery document
      # lazily, on the first request that carries a token — but `up --wait`
      # gates on every service's health, and the value is for whoever types the
      # README's token command the moment it returns. Under service_started
      # that command races the realm import and can be handed a 404.
      keycloak: { condition: service_healthy }
