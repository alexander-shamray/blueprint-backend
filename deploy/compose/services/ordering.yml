# Ordering: /v1/orders, where no route is anonymous (ADR-030).
services:
  ordering-migrator:
    build:
      context: ../../..
      dockerfile: src/Services/Ordering/Ordering.Migrator/Dockerfile
    environment:
      # Migrator identity (DDL) — §7.1. Locally both keys resolve to the one
      # sa login (§14.2's stated simplification); the KEY still differs, so
      # the migrator reads the name it will read in production. The default is
      # inline because .env.example promises every variable one — §14.1's bare
      # `${…}` would break `docker compose up` on a clean checkout.
      ConnectionStrings__OrderingMigrator: "${ORDERING_MIGRATOR_CONNECTION:-Server=sql;Database=Ordering;User Id=sa;Password=${SQL_PASSWORD:-Local_Dev_Pa55w0rd!};TrustServerCertificate=True}"
    depends_on:
      sql: { condition: service_healthy }
    restart: "no"

  ordering-api:
    build:
      context: ../../..
      dockerfile: src/Services/Ordering/Ordering.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Runtime identity (DML only) — never the migrator connection.
      ConnectionStrings__Ordering: "${ORDERING_CONNECTION:-Server=sql;Database=Ordering;User Id=sa;Password=${SQL_PASSWORD:-Local_Dev_Pa55w0rd!};TrustServerCertificate=True}"
      # The bus (§9). AddMassTransitMessaging throws without it, so this line is
      # what lets the host start. A plain value, §14.1's local default rather
      # than a secret, under this service's own account rather than `guest`,
      # which is tagged administrator and reachable from any container (ADR-036).
      ConnectionStrings__RabbitMq: "amqp://ordering-svc:local-dev-ordering@rabbitmq:5672"
      # The authority, to validate inbound tokens (§11.2). Read eagerly by
      # AddJwtAuthentication, which throws naming the key — so this line is
      # what lets the host start, exactly like the bus one above. No
      # Identity__Client__*: Ordering calls no peer synchronously, and §15.4
      # requires them only of a host that does.
      Identity__Authority: "http://keycloak:8080/realms/commerce"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      # §8.1's two connections, both read eagerly by AddRedisConnections (§8.2),
      # so an absent key is a host that will not start; PlaceOrderCommand claims
      # §8.5's key on the coordination one before the order exists. 6379 on
      # both: each container listens on Redis's own port.
      ConnectionStrings__RedisCache: "redis-cache:6379,user=ordering-svc,password=local-dev-ordering"
      ConnectionStrings__RedisCoordination: "redis-coordination:6379,user=ordering-svc,password=local-dev-ordering"
    ports: [ "127.0.0.1:5101:8080" ]
    # §13.5's readiness, asked by the host itself through HealthProbe, because
    # the image has no shell or HTTP client; the timeout outlasts the probe's.
    healthcheck:
      test: [ "CMD", "dotnet", "Ordering.Api.dll", "--probe" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      ordering-migrator: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      # service_healthy since infrastructure.yml's keycloak declares a healthcheck; the host itself does not need it.
      keycloak: { condition: service_healthy }
      # Both Redis instances — see services/catalog.yml for why service_healthy
      # rather than service_started.
      redis-cache: { condition: service_healthy }
      redis-coordination: { condition: service_healthy }
