# The BFF: POST /v1/checkout/quote (ADR-045), minting its own token (§11.5),
# ADR-117's device registration under the caller's token, and ADR-051's order
# projection, migrated by the one-shot beside it.
services:
  # §14.1's pair rule: a migrator one-shot and the host it gates, on
  # `condition: service_completed_successfully`, because no host may migrate
  # at startup (§4.1, ADR-007). Named bff-migrator for the key it reads.
  bff-migrator:
    image: ${BLUEPRINT_REGISTRY:-blueprint.local}/bff-migrator:${BLUEPRINT_TAG:-local}
    build:
      context: ../../..
      dockerfile: src/BFF/Web.Bff.Migrator/Dockerfile
    # Read-only like the chart's pods (ADR-082), so compose.yml's `up --wait` proves it.
    read_only: true
    tmpfs: [ /tmp ]
    environment:
      # Migrator identity (DDL) — §7.1. Locally both keys resolve to the one
      # sa login (§14.2's stated simplification); the KEY still differs.
      ConnectionStrings__BffMigrator: "${BFF_MIGRATOR_CONNECTION:-Server=sql;Database=Bff;User Id=sa;Password=${SQL_PASSWORD:-Local_Dev_Pa55w0rd!};TrustServerCertificate=True}"
      # The job host reads DOTNET_ENVIRONMENT and defaults to Production, where
      # ADR-079 refuses this string's TrustServerCertificate=True.
      DOTNET_ENVIRONMENT: Development
    depends_on:
      sql: { condition: service_healthy }
    restart: "no"

  # Client credentials, because this host calls a peer synchronously (§9.7);
  # §15.4 says which other hosts do. Named web-bff, matching the Aspire
  # resource (§14.2) and the YARP destination (§10.2) — the gateway resolves
  # the destination by hostname, so the container name is the routing
  # configuration.
  web-bff:
    image: ${BLUEPRINT_REGISTRY:-blueprint.local}/web-bff:${BLUEPRINT_TAG:-local}
    build:
      context: ../../..
      dockerfile: src/BFF/Web.Bff/Dockerfile
    # Read-only like the chart's pods (ADR-082), so compose.yml's `up --wait` proves it.
    read_only: true
    tmpfs: [ /tmp ]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Runtime identity (DML only) — never the migrator connection. The host
      # refuses to start without it, and SQL and the bus are its readiness
      # checks: Catalog's hop deliberately is not, since a BFF unready whenever
      # Catalog is down takes itself out of rotation for a fault it exists to
      # degrade around (§13.5).
      ConnectionStrings__Bff: "${BFF_CONNECTION:-Server=sql;Database=Bff;User Id=sa;Password=${SQL_PASSWORD:-Local_Dev_Pa55w0rd!};TrustServerCertificate=True}"
      # The bus (§9), under the BFF's own account, which writes no contract (ADR-036, ADR-051).
      # A plain value, §14.1's local default; AddMassTransitMessaging throws without it.
      ConnectionStrings__RabbitMq: "amqp://bff-svc:local-dev-bff@rabbitmq:5672"
      Identity__Authority: "http://keycloak:8080/realms/commerce"
      # Required by ValidateOnStart (§15.4) — this host refuses to boot without
      # all three, which is the whole point of the [Required] attributes on
      # ServiceIdentityOptions. Local values only; production mounts a secret.
      #
      # The client id must exist in the realm, and RealmClientTests is what
      # says so: a name here that Keycloak has never heard of satisfies
      # ValidateOnStart, boots cleanly, and fails every pricing call at the
      # token endpoint.
      Identity__Client__ClientId: "web-bff"
      Identity__Client__ClientSecret: "${BFF_CLIENT_SECRET:-local-dev-secret}"
      # The scope that becomes the audience every service validates (§11.5).
      # Not the same claim as `aud`, and nothing but the realm's audience
      # mapper makes one imply the other.
      Identity__Client__Scope: "commerce-api"
      # §10.8's upload: the store a client PUTs to, so the endpoint is the one the host's browser reaches
      # (loopback, path style) and not the compose-network name Catalog uses. The pair can write uploads/ and
      # nothing else; object-store/s3.json owns it, and docs/secrets.md lists it as a local default.
      ProductImages__Store__Endpoint: "http://127.0.0.1:8333"
      ProductImages__Store__Bucket: "product-images"
      ProductImages__Store__Region: "us-east-1"
      ProductImages__Store__PathStyle: "true"
      ProductImages__Store__AccessKey: "bff-images-svc"
      ProductImages__Store__SecretKey: "local-dev-bff-images"
      # ADR-117's app list, which a registration's app id and platform must match (§10.10). Placeholder ids: an
      # adopter names its own apps.
      Push__Apps__0__AppId: "com.example.shop"
      Push__Apps__0__Platform: "fcm"
      Push__Apps__1__AppId: "com.example.shop.ios"
      Push__Apps__1__Platform: "apns"
      # ADR-156's keyless provider, so this stack, and the client e2e jobs that start it, reach the assistant with
      # no provider key: it answers every turn with one fixed reply, and the host refuses it outside Development.
      Assistant__Provider: "scripted"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    ports: [ "127.0.0.1:5200:8080" ]
    # Compose runs one replica, so the gateway's assistant destination (ADR-153)
    # is this container under a second name rather than a second container.
    networks:
      default:
        aliases: [ web-bff-assistant ]
    # §13.5's readiness, asked by the host itself through HealthProbe, because
    # the image has no shell or HTTP client; the timeout outlasts the probe's.
    healthcheck:
      test: [ "CMD", "dotnet", "Web.Bff.dll", "--probe" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      bff-migrator: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      # The bucket, so the first upload a developer signs has somewhere to land; signing itself dials nothing.
      object-store-init: { condition: service_completed_successfully }
      # Keycloak, because this host mints its own token and would otherwise
      # discover that on the first request.
      keycloak: { condition: service_healthy }
      # No catalog-api: the pricing hop is made per request and kept out of
      # readiness (§13.5), and Catalog's seed waits on this host instead (§14.3).
      # No notifications-api, on the same terms for the registration hop.
