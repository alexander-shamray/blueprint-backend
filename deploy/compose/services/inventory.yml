# Inventory: /v1/inventory/stock and /v1/inventory/reservations, behind a token (ADR-030).
services:
  # §14.1's pair rule: a {service}-migrator one-shot plus the service itself,
  # gated on `condition: service_completed_successfully` — every service owns
  # a database and none may migrate at startup (§4.1, ADR-007).
  inventory-migrator:
    build:
      context: ../../..
      dockerfile: src/Services/Inventory/Inventory.Migrator/Dockerfile
    environment:
      # Migrator identity (DDL) — §7.1. Locally both keys resolve to the one
      # sa login (§14.2's stated simplification); the KEY still differs, so
      # the migrator reads the name it will read in production. The default is
      # inline because .env.example promises every variable one — §14.1's bare
      # `${…}` would break `docker compose up` on a clean checkout.
      ConnectionStrings__InventoryMigrator: "${INVENTORY_MIGRATOR_CONNECTION:-Server=sql;Database=Inventory;User Id=sa;Password=${SQL_PASSWORD:-Local_Dev_Pa55w0rd!};TrustServerCertificate=True}"
      # §14.3's gate, both halves: the flag, and the environment name the job
      # host reads, which is DOTNET_ENVIRONMENT and not ASPNETCORE_ENVIRONMENT.
      DOTNET_ENVIRONMENT: Development
      Seed__Enabled: "true"
    depends_on:
      sql: { condition: service_healthy }
    restart: "no"

  inventory-api:
    build:
      context: ../../..
      dockerfile: src/Services/Inventory/Inventory.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Runtime identity (DML only) — never the migrator connection.
      ConnectionStrings__Inventory: "${INVENTORY_CONNECTION:-Server=sql;Database=Inventory;User Id=sa;Password=${SQL_PASSWORD:-Local_Dev_Pa55w0rd!};TrustServerCertificate=True}"
      # The bus (§9). AddMassTransitMessaging throws without it, so this line is
      # what lets the host start. A plain value, §14.1's local default rather
      # than a secret, under this service's own account rather than `guest`,
      # which is tagged administrator and reachable from any container (ADR-036).
      ConnectionStrings__RabbitMq: "amqp://inventory-svc:local-dev-inventory@rabbitmq:5672"
      # The authority, to validate inbound tokens (§11.2). Read eagerly by
      # AddJwtAuthentication, which throws naming the key — so this line is
      # what lets the host start, exactly like the bus one above. No
      # Identity__Client__*: Inventory calls no peer synchronously, and §15.4
      # requires them only of a host that does.
      Identity__Authority: "http://keycloak:8080/realms/commerce"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      # §8.1's two connections, both read eagerly by AddRedisConnections (§8.2),
      # so an absent key is a host that will not start rather than a cache
      # silently reading the database. 6379 on both: each container listens on
      # Redis's own port, and 6380 exists only on the host side.
      ConnectionStrings__RedisCache: "redis-cache:6379,user=inventory-svc,password=local-dev-inventory"
      ConnectionStrings__RedisCoordination: "redis-coordination:6379,user=inventory-svc,password=local-dev-inventory"
    ports: [ "127.0.0.1:5103:8080" ]
    # §13.5's readiness, asked by the host itself through HealthProbe, because
    # the image has no shell or HTTP client; the timeout outlasts the probe's.
    healthcheck:
      test: [ "CMD", "dotnet", "Inventory.Api.dll", "--probe" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      inventory-migrator: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      # service_healthy since infrastructure.yml's keycloak declares a healthcheck; the host itself does not need it.
      keycloak: { condition: service_healthy }
      # service_healthy, not service_started: AddRedisConnections sets
      # AbortOnConnectFail = false (§8.1), so the host would start against a
      # Redis still booting and its first command would fail on §8.5's claim.
      redis-cache: { condition: service_healthy }
      redis-coordination: { condition: service_healthy }
      # §14.3's seed is published once, and a fanout publish with no queue bound
      # is dropped, so Catalog, which consumes it, is ready first.
      catalog-api: { condition: service_healthy }
