# Shipping's deployment (§14.1), included by deploy/compose/docker-compose.yml.
# Rendered by tools/new-service from the template service's unit file: the
# pair rule below belongs to the chapter, and the file boundary belongs to
# docs/change-locality.md, so a PR for Shipping edits this file and
# never another service's.
#
# `include` resolves a relative path against the directory of the file that
# declares it, so the repository root — the build context — is three levels up
# from here.
services:
  # §14.1's pair rule: a {service}-migrator one-shot plus the service itself,
  # gated on `condition: service_completed_successfully` — every service owns
  # a database and none may migrate at startup (§4.1, ADR-007).
  shipping-migrator:
    build:
      context: ../../..
      dockerfile: src/Services/Shipping/Shipping.Migrator/Dockerfile
    environment:
      # Migrator identity (DDL) — §7.1. Locally both keys resolve to the one
      # sa login (§14.2's stated simplification); the KEY still differs, so
      # the migrator reads the name it will read in production. The default is
      # inline because .env.example promises every variable one — §14.1's bare
      # `${…}` would break `docker compose up` on a clean checkout.
      ConnectionStrings__ShippingMigrator: "${SHIPPING_MIGRATOR_CONNECTION:-Server=sql;Database=Shipping;User Id=sa;Password=${SQL_PASSWORD:-Local_Dev_Pa55w0rd!};TrustServerCertificate=True}"
    depends_on:
      sql: { condition: service_healthy }
    restart: "no"

  # §3.2's carrier, simulated (spec section 9). Shipping's own dependency,
  # so it lives in Shipping's unit rather than the shared baseline, and
  # docker-compose.infra-only.yml keeps it, since a Shipping host run from an
  # IDE needs it as much as a containerised one. The tag is
  # Directory.Packages.props' WireMock.Net pin: one engine, one version, one
  # set of mappings for this container and the tests.
  carrier-simulator:
    image: sheyenrath/wiremock.net:2.12.0
    # The image does not read static mappings by default; without this flag
    # every request answers 404 and spec section 9's mappings never load.
    command: [ "--ReadStaticMappings", "true" ]
    volumes:
      - ../carrier-simulator/mappings:/app/__admin/mappings:ro
    ports: [ "127.0.0.1:5191:80" ]

  shipping-worker:
    build:
      context: ../../..
      dockerfile: src/Services/Shipping/Shipping.Worker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Runtime identity (DML only) — never the migrator connection.
      ConnectionStrings__Shipping: "${SHIPPING_CONNECTION:-Server=sql;Database=Shipping;User Id=sa;Password=${SQL_PASSWORD:-Local_Dev_Pa55w0rd!};TrustServerCertificate=True}"
      # The bus (§9), read by AddMassTransitMessaging — which throws without
      # it, so this line is what lets the host start. A plain value, no ${…}
      # variable: this is §14.1's local default, not a secret with a
      # production shape, and .env.example's contract covers variables.
      #
      # `shipping-svc` rather than `guest`: that account is tagged
      # `administrator` and the base image ships `loopback_users.guest =
      # false`, so one principal reachable from any container could publish
      # onto `ordering-commands` as system-initiated (§9.4). The broker's
      # per-service write permissions live in rabbitmq/Dockerfile.
      ConnectionStrings__RabbitMq: "amqp://shipping-svc:local-dev-shipping@rabbitmq:5672"
      # The authority, to validate inbound tokens (§11.2). Read eagerly by
      # AddJwtAuthentication, which throws naming the key — so this line is
      # what lets the host start, exactly like the bus one above.
      Identity__Authority: "http://keycloak:8080/realms/commerce"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      Carrier__BaseUrl: "http://carrier-simulator/"
      # §14.1's local-development exception: the simulator ignores it.
      Carrier__ApiKey: "local-dev-carrier"
      # ADR-052's read. The host name is the Compose service and the
      # Kubernetes Service alike; the port is Ordering's HTTP/2-only endpoint,
      # because a cleartext Kestrel endpoint cannot serve HTTP/1.1 and h2c at
      # once.
      AddressSource__BaseUrl: "http://ordering-api:8081"
      # Required by ValidateOnStart (§15.4): this host calls a peer (ADR-052),
      # so it refuses to boot without all three. Local values only; production
      # mounts a secret, and the default here is the realm export's.
      Identity__Client__ClientId: "shipping-worker"
      Identity__Client__ClientSecret: "${SHIPPING_CLIENT_SECRET:-local-dev-shipping-secret}"
      # The scope that becomes the audience every service validates (§11.5),
      # and the scope whose mapper writes the permission claim this host holds
      # itself to (ADR-052).
      Identity__Client__Scope: "commerce-api"
      # Made-up windows: a developer's stack is no jurisdiction, and a real
      # window belongs in a values file rather than in a file everybody runs
      # (ADR-053 rule 1).
      Jurisdiction__AddressRetention: "11.00:00:00"
      Jurisdiction__TrackingRetention: "23.00:00:00"
      # ADR-052's give-up age, required by ValidateOnStart (§15.4), and the
      # chart's value rather than a made-up one: it is sized to reach
      # OrderFulfilmentSaga.DespatchTimeoutDelay, which a laptop shares.
      Fulfilment__GiveUpAge: "3.00:00:00"
    depends_on:
      shipping-migrator: { condition: service_completed_successfully }
      carrier-simulator: { condition: service_started }
      # Without it the worker's first pass meets a host name that does not
      # resolve yet and backs the claimed row off for nothing.
      ordering-api: { condition: service_started }
      rabbitmq: { condition: service_healthy }
      # service_healthy, because the worker's first pass asks the realm for a
      # client-credentials token (§11.5, CachingTokenClient). Under
      # service_started that request races the realm import and fails as an
      # outage would, so the claimed row backs off for a realm that was only
      # still starting.
      keycloak: { condition: service_healthy }
