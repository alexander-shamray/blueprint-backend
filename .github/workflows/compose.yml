name: Compose

# A separate workflow rather than a job in ci.yml because path filtering is
# per-workflow: the smoke pulls every image the model names, so it runs only
# when the model, a file it mounts from deploy/observability/, a file a host's
# healthcheck reads, or this one changes, so a bumped §14.1 image pin is
# smoke-tested here rather than in the solution build.

# The model's application blocks carry build: stanzas, so the smoke compiles
# the solution inside Docker — what the timeout below is sized for. ci.yml's image
# matrix proves a Dockerfile against a source change; this smoke filters in only
# what a host's healthcheck reads: the probe, the endpoints it asks and the
# files that bind each host's port.
on:
  pull_request:
    paths:
      - 'deploy/compose/**'
      - 'deploy/observability/alerts/platform-alerts.yaml'
      - 'deploy/observability/dashboards/**'
      - 'src/BuildingBlocks/Common.Web/HealthProbe.cs'
      - 'src/BuildingBlocks/Common.Web/HealthCheckExtensions.cs'
      - 'src/**/Program.cs'
      - 'src/**/appsettings*.json'
      - 'src/**/Dockerfile'
      - '.github/workflows/compose.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/compose/**'
      - 'deploy/observability/alerts/platform-alerts.yaml'
      - 'deploy/observability/dashboards/**'
      - 'src/BuildingBlocks/Common.Web/HealthProbe.cs'
      - 'src/BuildingBlocks/Common.Web/HealthCheckExtensions.cs'
      - 'src/**/Program.cs'
      - 'src/**/appsettings*.json'
      - 'src/**/Dockerfile'
      - '.github/workflows/compose.yml'

permissions:
  contents: read

concurrency:
  group: compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Every .NET image builds with its own restore and publish, from the layer
    # cache the runner keeps when it has one and from nothing when it has
    # not, and not from a pulled `main`: this job tests the change's own
    # sources (ADR-134). 45 is headroom for a cold cache and registry, not a
    # sum of the images, so a new service does not move it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Syntax and interpolation first — seconds, no pulls, and a YAML error
      # should not cost an image download to find.
      - name: Validate the file
        run: docker compose -f deploy/compose/docker-compose.yml config -q

      # The build comes before `up` so a layer cache can serve it: `up` alone
      # builds each service with nothing restored, which was eight of the
      # job's nine minutes. One cache scope per service, because a scope that
      # several targets export to keeps only the last one's layers. A source
      # change still misses the layers from its COPY on, so the images are
      # still built from this change's own sources (ADR-134); only the restore
      # and the SDK layers above them are reused.
      - name: Name each built service's cache scope
        id: scopes
        run: |
          {
            echo 'set<<EOF'
            docker compose -f deploy/compose/docker-compose.yml config --format json |
              jq -r '.services | to_entries[] | select(.value.build) | .key |
                "\(.).cache-from=type=gha,scope=compose-\(.)",
                "\(.).cache-to=type=gha,scope=compose-\(.),mode=max"'
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the images with the layer cache
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: deploy/compose/docker-compose.yml
          load: true
          set: ${{ steps.scopes.outputs.set }}

      # --wait exits non-zero if a healthcheck never passes, or if a container
      # exits before the wait completes, so every healthcheck the model
      # declares is asserted directly — Keycloak's among them, which makes
      # realm readiness part of what `up --wait` proves rather than something
      # the first token request discovers. A service without a healthcheck is
      # only asserted to start. One-shots are the carve-out: a service another
      # gates on with `service_completed_successfully` satisfies --wait by
      # exiting 0 and fails it by exiting non-zero, so the migrator's exit code
      # is part of what this smoke asserts.
      - name: Start and wait for healthy
        run: docker compose -f deploy/compose/docker-compose.yml up -d --wait --quiet-pull --no-build

      # --wait proved the grafana service's components are up, not what they
      # loaded. A rule file its Prometheus stopped reading would start green,
      # so the loaded count is held to the file's, polled briefly for the first
      # evaluation, and each dashboard's uid is read from its own JSON.
      - name: The local Grafana loaded the platform rules and dashboards
        run: |
          expected=$(grep -cE '^\s*- alert:' deploy/observability/alerts/platform-alerts.yaml)
          [ "$expected" -gt 0 ] || { echo "::error::no alert rule counted in the file"; exit 1; }
          loaded=
          for _ in $(seq 15); do
            loaded=$(curl -sf http://localhost:3000/api/prometheus/prometheus/api/v1/rules |
              jq '[.data.groups[].rules[] | select(.type == "alerting")] | length') &&
              [ "$loaded" = "$expected" ] && break
            sleep 2
          done
          echo "alert rules: $expected in platform-alerts.yaml, ${loaded:-none} loaded"
          [ "$loaded" = "$expected" ]
          for uid in $(jq -r .uid deploy/observability/dashboards/*.json); do
            curl -sf "http://localhost:3000/api/dashboards/uid/$uid" > /dev/null ||
              { echo "::error::dashboard $uid is not provisioned"; exit 1; }
            echo "dashboard $uid provisioned"
          done

      # The rule count above says the queue alerts are loaded, and a loaded rule
      # that reads a series nobody publishes cannot fire. So the subject here is
      # the series: an `_error` queue is declared on the live broker and its
      # depth must reach the local Prometheus with a `queue` label. No service
      # has faulted a message yet, so the probe makes the queue it reads.
      - name: The broker's per-queue depth reaches the local Prometheus
        run: |
          # A failed curl must fail the pipe: jq answers an empty input with 0 status.
          set -o pipefail
          compose="docker compose -f deploy/compose/docker-compose.yml"
          $compose exec -T rabbitmq rabbitmqctl add_user probe probe
          $compose exec -T rabbitmq rabbitmqctl set_user_tags probe administrator
          $compose exec -T rabbitmq rabbitmqctl set_permissions probe '.*' '.*' '.*'
          $compose exec -T rabbitmq rabbitmqadmin -u probe -p probe declare queue \
            --name compose-smoke_error --type classic --durable true
          series=0
          positive='^[1-9][0-9]*$'
          for _ in $(seq 45); do
            series=$(curl -sf -G http://localhost:3000/api/datasources/proxy/uid/prometheus/api/v1/query \
              --data-urlencode 'query=count(rabbitmq_queue_messages{queue=~".+_error"})' |
              jq -r '.data.result[0].value[1] // 0') && [[ $series =~ $positive ]] && break
            sleep 2
          done
          echo "rabbitmq_queue_messages series for an _error queue: ${series:-none}"
          [[ $series =~ $positive ]] ||
            { echo "::error::rabbitmq_queue_messages has no series for an _error queue"; exit 1; }

      - name: Show state on failure
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml ps -a && docker compose -f deploy/compose/docker-compose.yml logs --tail 50

      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml down -v
