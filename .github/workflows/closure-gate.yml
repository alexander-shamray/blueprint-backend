name: Closure gate

# A pull request states what it closes three times — the `| Closes |` row, the
# keywords GitHub's linker reads out of the body, and the keywords in the
# commit bodies — and the three are honoured by different machinery. What has
# to agree is what the merge does and what the pull request says it does: a
# closure the commits carry has to appear in the description, and the table has
# to match what GitHub linked, in both directions. A description closure no
# commit repeats is the ordinary case and is not compared, because requiring it
# would make a commit keyword mandatory and fail a correct pull request.

# Its own workflow rather than a job in ci.yml because it judges a property of
# every pull request rather than of a tree, so nothing but the gate itself is
# derived from the checkout and there is no inputs list to drift. `edited` has
# to be a trigger: a description can withdraw a closure the commits already
# made permanent with no push following, and adding `edited` to ci.yml would
# rebuild and retest the solution for every typo in a body.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  # The gate reads the pull request's body, its commits and GitHub's own
  # `closingIssuesReferences`. Read is the whole of what it needs; it changes
  # nothing and posts nothing.
  pull-requests: read

concurrency:
  group: closure-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Proposal and enforcement are two executions, and that split is the design of
# this job. A bare checkout on `pull_request` gives the merge ref, so the gate
# judging a branch would be the gate that branch ships. The version worth
# worrying about is accidental rather than malicious: a refactor making
# `check()` return `[]` on a path nobody considered, with the suite edited in
# the same change to match, is green. So the suite runs the head copy — testing
# a proposed gate is the point of that step — and the enforcing copy is read
# out of the base commit.

# `pull_request_target` is the other documented answer and is worse: a writable
# token against a base checkout, buying a much larger hazard to solve a
# read-only problem.

# The residual: `pull_request` runs the workflow definition from the head ref,
# so a pull request can edit or delete the enforcing step and the run that
# judges it is the edited one. Base-sourcing the gate narrows the accidental
# case and leaves the deliberate one. What closes it is a required status check
# on `main`, which fails a pull request whose `closure-gate` check never
# reports.
jobs:
  closure-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The enforcing copy comes out of the base commit, which a shallow
          # checkout does not have. This is the honest cost of not letting a
          # pull request supply its own judge.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The head copy, deliberately: this step's subject is the gate this pull
      # request proposes, so a proposal that fails its own suite belongs red
      # here. Running it at all is the licence gate's terms — a gate observed
      # only against a well-formed input says nothing about what it would
      # catch — and every test in that suite is a negative case.
      - name: Test the proposed gate
        working-directory: .github/closure-gate
        run: python -m unittest

      # The base copy, deliberately, for the reason at the top of this file.
      #
      # A base that carries no gate fails rather than falling back to the head
      # copy. Falling back is the silent-pass shape this file exists to refuse,
      # on exactly the pull requests where nobody is watching for it. `main`
      # carries the gate, so the only way to reach that branch is a base older
      # than it, which is a rebase somebody performs knowingly.
      - name: Take the enforcing gate from the base commit
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GATE: .github/closure-gate/closure_gate.py
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_SHA:$GATE" 2>/dev/null; then
            echo "The base commit carries no $GATE, so there is no copy of the"
            echo "gate that this pull request did not write. Rebase onto a base"
            echo "that has it. Falling back to the head copy is the silent pass"
            echo "this job exists to refuse, so it is not offered."
            echo "::error::base commit $BASE_SHA carries no $GATE"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/closure-gate"
          git show "$BASE_SHA:$GATE" > "$RUNNER_TEMP/closure-gate/closure_gate.py"
          # Fail on an empty subject rather than run a gate that reads nothing
          # and reports a pass — the rule the gate applies to its own input.
          if [ ! -s "$RUNNER_TEMP/closure-gate/closure_gate.py" ]; then
            echo "::error::$GATE at $BASE_SHA is empty"
            exit 1
          fi
          # The workflow is in this comparison as well as the gate: see the
          # residual at the top of this file.
          if ! git diff --quiet "$BASE_SHA" -- .github/closure-gate/ .github/workflows/closure-gate.yml; then
            echo "::notice::this pull request modifies the closure gate or its workflow; the gate below is the copy at $BASE_SHA"
          fi
          echo "enforcing with the gate as of $BASE_SHA"

      # One `gh` call, and it is the only network in the check. The deciding
      # takes JSON on stdin and is pure — deploy/canary/canary.py's split, for
      # its reason: what is tested is the judgement, not the fetch.
      # `closingIssuesReferences` is GitHub's own parse of the body, which is
      # what makes this a comparison rather than a second implementation of a
      # linker nobody here has the spec for.

      # `shell: bash` rather than the default: the default `run` shell is
      # `bash -e` with no pipefail, so a failing `gh` would be masked by
      # whatever the right-hand side exited with. The gate would exit 2 on the
      # empty input anyway, but relying on that is relying on a second bug to
      # cover the first.
      - name: What the PR says it closes matches what merging it closes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --json number,url,body,commits,closingIssuesReferences,headRefOid |
            python "$RUNNER_TEMP/closure-gate/closure_gate.py"
