name: CI

on:
  pull_request:
    # No `labeled` or `unlabeled`: a label changes nothing that builds or
    # tests, and the one gate that reads a label is the comment gate's, a step
    # of gates.yml, so a label reruns that alone. No `edited`: gates.yml's
    # gates judge a body edit, so it does not rebuild the solution.
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  # The backfill of ADR-109: `publish-images` is path-filtered, so a service no
  # push has touched since signing began has no signed image for deploy.yml to
  # verify. A dispatch from main builds, pushes and signs every image once.
  workflow_dispatch:

# Read-only by default. A job needing more says so, and none holds a write grant
# beside a pull request's code (ADR-197).
permissions:
  contents: read

env:
  # The one owner of the registry address (ADR-109); deploy.yml carries a
  # copy that pipeline-gate holds to this one. It must be lower case, because a
  # registry refuses an upper-case name, and nothing here lower-cases it:
  # github.repository keeps the case it was registered in.
  REGISTRY: ghcr.io/${{ github.repository }}
  # Every artefact here is read by a later job of its own run or by a person
  # looking at a recent one (ADR-199), and an SBOM a signed image needs is in
  # its attestation (ADR-109).
  ARTIFACT_RETENTION_DAYS: 14

concurrency:
  # On main each commit has a group of its own: a run cancelled, or replaced
  # while pending, between a push and its signature leaves an image that
  # deploy.yml's verifier refuses, and a group holds one pending run (ADR-109).
  # A rerun has one too, so rerunning a stale head cannot cancel the required
  # checks of a newer head's run on the same ref.
  group: >-
    ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}${{
    github.run_attempt != '1' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Beside the build, never after it (§15.1): it reads Directory.Packages.props,
  # Appendix B and every .csproj, .props and .targets as text, so it needs no
  # restore and no SDK. The project files are in the subject because a project
  # file can still restore a package Directory.Packages.props never mentions.
  # Scanning downstream of a build is scanning that a build failure skips.

  # This is §15.1's "SCA + secret scan" node, both halves. They share a job
  # because they share every property it is arranged around: stdlib Python over
  # text, no restore, no SDK, no network. There is no path filter, and that is
  # the design: a credential can arrive in any file in the repository, so a
  # filter could only make this skippable.
  licence-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The secret scan runs ahead of the licence steps. Both are cheap and
      # neither gates the other, so the order is about what each failure costs:
      # a credential in the tree is compromised from the moment the branch is
      # pushed, where a licence problem is a decision to take rather than a
      # rotation to perform. Its own tests come first, on the pattern every
      # gate here follows — a green run against this repository says the tree
      # is clean, which says nothing about what the scanner would catch.
      - name: Test the secret scan
        working-directory: .github/secret-scan
        run: python -m unittest

      # No working-directory. The scanner resolves the repository root from
      # __file__, so the cwd decides nothing and the root is the honest place
      # to invoke it from.
      - name: Scan the working tree for credentials
        run: python .github/secret-scan/secret_scan.py

      # The gate's own tests first. Run against this repository it passes, which
      # says nothing about what it would catch — the carve-outs of §4.4 are
      # branches that only a negative case exercises.
      - name: Test the gate
        working-directory: .github/licence-gate
        run: python -m unittest

      - name: Check every pin against the licence register
        working-directory: .github/licence-gate
        run: python licence_gate.py

  # The review loop's own helpers. Nothing in CI runs these scripts, which is
  # why the suite belongs here: a test nobody runs rots, and the judgements it
  # covers are the ones /ship and the sweeps rest on.

  # Beside the licence gate rather than inside `build`, on its argument: stdlib
  # Python over text and a few `bash` fragments, so it needs no restore, no
  # Docker and no network — each suite that reaches `gh` stubs it on PATH.
  review-helpers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test the review helpers
        run: python -m unittest discover -s .claude/scripts

      # The budget's ceilings are Windows figures, so only its suite runs here;
      # a session runs the budget itself (docs/testing.md).
      - name: Test the review helpers' time budget
        working-directory: tools/suite-budget
        run: python -m unittest

  # The edit-target guard has branches no Linux runner can reach, and the job
  # above is `ubuntu-latest`, so they could regress with every required check
  # green. Windows has the junction fallback, the only link primitive an
  # unprivileged session gets; `..` after a link, which Windows collapses
  # before the filesystem sees it where POSIX resolves it against the link's
  # target; and the on-disk case `realpath` answers with. macOS has APFS
  # mounting case-insensitively by default, so a checkout prefix spelled in
  # another case is the same directory there and a different string on Linux —
  # the guard asks the filesystem rather than the platform.

  # The index hook's lock is the second thing here a Linux runner cannot
  # judge. `msvcrt.locking` and `fcntl.flock` are different primitives, the
  # job above runs only the second, and the hook is invoked through Windows
  # `py` by `settings.json` — so a regression in the branch this repository's
  # own sessions take would merge green.

  # A module each rather than the whole `discover`, and that is a property of
  # the modules rather than a preference: both need nothing but Python and a
  # filesystem, where the suite beside them needs `bash`, `grep`, `git` and
  # `jq` on PATH. Widening this job to the directory would adopt that whole
  # toolchain on every platform in the matrix.

  # Only when `.claude/` or this workflow changed, which `changes` answers: a
  # Windows or macOS minute costs more than a Linux one, by tools/ci-cost's
  # RATES, and what the matrix proves is a property of the hooks and scripts
  # it tests, which read across `.claude/`, not of every commit. Nothing
  # requires the job, so a skipped one holds no merge.
  edit-target-guard:
    needs: changes
    if: needs.changes.outputs.guard == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # `-v` for the link-primitive line the module prints: a green run does
      # not say whether the junction fallback was reached or whether symbolic
      # links were available, and which of the two happened is why this job
      # exists.
      - name: Test the edit-target guard
        run: python -m unittest discover -s .claude/scripts -p "test_edit_target_guard.py" -v

      # `-v` here for the same reason: the lock's platform branch is chosen at
      # import, and a green run that named no case would not say which.
      - name: Test the index hook
        run: python -m unittest discover -s .claude/scripts -p "test_refresh_index.py" -v

  # The inventory gates, beside the licence gate rather than inside `build` for the same reason it is: stdlib
  # Python over text, so no restore, and no build failure skips them. Both are §15.1's own instruction. The path
  # filter and the image matrix are deployable inventories, and one that stops covering the newest surface is the
  # failure .harness/agent-rules.md names as the most-repeated, so neither check trusts its own parser: each fails
  # on an empty subject rather than reporting a complete list it never read.
  pipeline-gate:
    runs-on: ubuntu-latest
    # Read only still: the issue-form gate below lists the repository's labels.
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test the gate
        working-directory: .github/pipeline-gate
        run: python -m unittest

      # The coverage reporter's suite runs here rather than beside the
      # reporter, on the rule licence-gate and canary already follow: test the
      # tool, then run it. The suite exists because a wrong merge is silent —
      # a colliding key or a `max` that should have been a sum prints a
      # plausible figure and nothing goes red. Stdlib, no restore, so it
      # belongs in the fast job rather than behind the build.
      - name: Test the coverage reporter
        working-directory: .github/coverage
        run: python -m unittest

      # The output gate's suite runs here, apart from its gate: the gate reads
      # what a build left behind, so it waits on one, while its suite builds
      # every tree it walks and needs no SDK. The split buys the suite a failure
      # that waits on no build, which matters most for its tests that read this
      # checkout, the ones that go red when the gate stops looking at a tree.
      - name: Test the output gate
        working-directory: .github/output-gate
        run: python -m unittest

      # The reader of every gate's workflow filter, and the workflow files it
      # reads, which this job sees on every pull request where the gates'
      # own workflows see only theirs (ADR-132).
      - name: Test the workflow-filter reader
        working-directory: deploy/workflow_paths
        run: python -m unittest

      - name: Every deployable is matched by a path filter
        run: python .github/pipeline-gate/pipeline_gate.py filters

      - name: Every image is built by some service
        run: python .github/pipeline-gate/pipeline_gate.py images

      - name: The integration shards partition the stage
        run: python .github/pipeline-gate/pipeline_gate.py shards

      - name: Every third-party action is pinned to a commit
        run: python .github/pipeline-gate/pipeline_gate.py actions

      - name: No job a pull request reaches holds a write grant beside a checkout
        run: python .github/pipeline-gate/pipeline_gate.py grants

      - name: Every workflow pushed on main is watched by the red-main alert
        run: python .github/pipeline-gate/pipeline_gate.py alerts

      - name: A pull request skips the stages only for a change none of them reads
        run: python .github/pipeline-gate/pipeline_gate.py code

      # §3.2's table against the code that publishes and consumes, stdlib
      # Python over text like the inventories above, so it belongs here.
      - name: Test the messaging gate
        working-directory: .github/messaging-gate
        run: python -m unittest

      - name: §3.2's table matches what every host publishes and consumes
        run: python .github/messaging-gate/messaging_gate.py check

      # ADR-096's marker over the chapters, stdlib Python over text like the
      # messaging gate above.
      - name: Test the domain-name gate
        working-directory: .github/domain-name-gate
        run: python -m unittest

      - name: A chapter names a reference service only as evidence
        run: python .github/domain-name-gate/domain_name_gate.py check

      # The planning rule (.harness/agent-rules.md), over the plans directory rather than a list.
      - name: Test the plan-size gate
        working-directory: .github/plan-size-gate
        run: python -m unittest

      - name: Every plan written after the planning rule is under its size
        run: python .github/plan-size-gate/plan_size_gate.py

      # The issue form against the vocabularies it mirrors and the labels its
      # answers name; the labels are the one input read over the network.
      - name: Test the issue-form gate
        working-directory: .github/issue-form-gate
        run: python -m unittest

      - name: Every issue-form choice is its owner's word and a label here
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          gh label list --repo "$GITHUB_REPOSITORY" --limit 1000 --json name |
            python .github/issue-form-gate/issue_form_gate.py

      # The style guide's join rule, over the tracked tree: the SQL sits in
      # string literals no formatter reads.
      - name: Test the SQL style gate
        working-directory: .github/sql-style-gate
        run: python -m unittest

      - name: Every SQL join names its kind and keeps its ON off its line
        run: python .github/sql-style-gate/sql_style_gate.py

      # A Windows worktree's room for a path, over the tracked tree, so a long
      # name fails here rather than at the next fork.
      - name: Test the path-length gate
        working-directory: .github/path-length-gate
        run: python -m unittest

      - name: Every tracked path leaves a worktree room for its slug on Windows
        run: python .github/path-length-gate/path_length_gate.py

  # The other gates read the workflows as text for coverage and order; none
  # checks expression syntax, step-output references, action input names or the
  # shell in a `run:` block, and the signing steps cannot run before the first
  # push to main. The binary is pinned by version and checked against its
  # release's published digest, so the download is the one that was read.
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint

      # A lint that passes every workflow says nothing until it has been seen
      # to fail one. The fixture reads a step that does not exist, and the
      # message is matched so a failure for another reason does not count.
      - name: The linter fails a broken reference
        run: |
          if ./actionlint .github/workflow-lint/broken-reference.yml > fixture.out; then
            echo "actionlint passed the broken fixture"
            exit 1
          fi
          grep -F 'property "absent" is not defined' fixture.out

      - name: Lint every workflow
        run: ./actionlint

  # The scaffold has no template directory: it renders a new service from
  # src/Services/Catalog at run time, so there is one copy of the wiring rather
  # than two that drift. The risk that buys is that Catalog moves under the
  # script's anchors, and these tests render the real checkout — so a Catalog
  # change that breaks the scaffold fails here rather than in six months.
  #
  # It gates nothing. A broken scaffold does not make the solution wrong, and
  # holding the build behind it would say otherwise; a red job is the whole
  # signal that is wanted.
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # --verify re-renders a named commit (tools/new-service/README.md); a shallow checkout has none.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test the scaffold against this repository
        working-directory: tools/new-service
        run: python -m unittest

      # The scaffold's inverse renders into a copy and removes what it
      # rendered, so a splice added to the scaffold fails here until it is undone.
      - name: Test the remove-service tool against this repository
        working-directory: tools/remove-service
        run: python -m unittest

  # The job above renders a service and reads the text of it. It never compiles
  # one, and a whole class of breakage is invisible to a text check: anything
  # the scaffold removes. A Catalog test using a helper the scaffold strips
  # renders into a service that does not build, with every one of those tests
  # green.

  # A separate job rather than a step added to `scaffold`: that job needs no
  # restore and no SDK, the property §15.1 relies on to keep the licence gate
  # off the build's path, and adding .NET to it would spend that on every run.
  # This one runs beside `build` and gates nothing, for the reason the job above
  # gives: a broken scaffold does not make the solution wrong.
  scaffold-build:
    needs: changes
    # Nothing requires it, so it skips whole, as edit-target-guard does.
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # `Yankee` is the probe docs/repo-map.md documents and the scaffold's own suite
      # already uses — never a real service's name, because the create refuses
      # a name or a port a real service already holds.
      - name: Render a service
        run: python tools/new-service/new_service.py Yankee --port 5199

      # Compiled here, and the architecture tests run below as the layering gate;
      # the integration suites need SQL and RabbitMQ. The test project, not the service:
      # it references the rendered service transitively, so building it compiles
      # both halves, and the half a text check cannot see is in the tests.
      - name: Compile what it rendered
        run: dotnet build tests/Yankee.Api.Tests/Yankee.Api.Tests.csproj

      # The worker mode as well, beside the first: WORKER_PATCHES removes the
      # OpenAPI package and the tests that asked for the document, so a
      # template change that leans on either compiles as an API and not as a
      # worker. A worker publishes no port, so it cannot collide with Yankee's.
      - name: Render a worker
        run: python tools/new-service/new_service.py Xray --worker

      - name: Compile the worker it rendered
        run: dotnet build tests/Xray.Worker.Tests/Xray.Worker.Tests.csproj

      # And the pure consumer, whose tables cut what the other two keep: a
      # template change that leans on the outbox or the Domain project compiles
      # in both of those and fails here. It publishes no port either.
      - name: Render a pure consumer
        run: python tools/new-service/new_service.py Whiskey --pure-consumer

      - name: Compile the pure consumer it rendered
        run: dotnet build tests/Whiskey.Worker.Tests/Whiskey.Worker.Tests.csproj

      # Each mode's architecture tests, which read the rendered assemblies and
      # start no container: a template change that renders a layering violation
      # compiles above and fails here. Every project must run at least one,
      # because `dotnet test` exits zero on a filter that selected nothing; the
      # TRX's `executed`, as the stage gate reads it, since `total` counts skips.
      - name: Run the architecture tests it rendered
        run: |
          set -euo pipefail
          projects="Yankee.Domain Yankee.Application Yankee.Api Xray.Domain Xray.Application Xray.Worker"
          projects="$projects Whiskey.Application Whiskey.Worker"
          for project in $projects; do
            dotnet test "tests/$project.Tests/$project.Tests.csproj" \
              --filter "FullyQualifiedName~ArchitectureTests" \
              --logger "trx;LogFileName=$project.trx" --results-directory TestResults/scaffold
            if ! grep -Eq 'executed="[1-9][0-9]*"' "TestResults/scaffold/$project.trx"; then
              echo "::error::$project.Tests ran no architecture test"
              exit 1
            fi
          done

      # No cleanup step. The scaffold both creates untracked files and edits
      # tracked ones, so undoing it locally takes the commands
      # `tools/new-service/README.md` gives; here the checkout is discarded
      # with the runner.

  # It gates nothing: the report reads local transcripts and the measurement
  # the Actions API, and a red job is the whole signal that a parser or the
  # arithmetic drifted from what its suite pins. One job for both, because
  # each job bills at least a whole minute.
  token-usage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test the token-usage report
        working-directory: tools/token-usage
        run: python -m unittest

      - name: Test the Actions cost measurement
        working-directory: tools/ci-cost
        run: python -m unittest

  # It gates nothing: the sets are read by a person's runs, and a red job is
  # the signal that a parser or the committed data drifted from the suite.
  quality-sets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test the quality sets
        working-directory: tools/quality-sets
        run: python -m unittest

  # It gates nothing a build produces: the tool reaches a broker only when an
  # operator runs it, so a red job is the signal that its dry-run default, a
  # refusal or a replay's id and headers drifted from what the suite pins.
  dead-letters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test the dead-letter tool
        working-directory: tools/dead-letters
        run: python -m unittest

  # §15.1's fork: only services whose files changed are built and deployed. A
  # job of its own so that everything downstream can read one answer. The
  # filter is §15.1's, verbatim — including the shared anchor, which is the
  # part most easily lost: a version bump in Directory.Packages.props changes
  # every binary the pipeline produces and matches no service path, so without
  # those lines the one change the pin file exists to control is the one change
  # CI never rebuilds. `pipeline-gate` asserts the list below is complete.
  changes:
    runs-on: ubuntu-latest
    # A dispatch has no change to read, so every output but the package,
    # guard and restore-audit ones is true: the run exists to build and sign
    # every image once (ADR-109).
    outputs:
      catalog: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.catalog }}
      ordering: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.ordering }}
      inventory: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.inventory }}
      payments: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.payments }}
      shipping: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.shipping }}
      notifications: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.notifications }}
      privacy: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.privacy }}
      gateway: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.gateway }}
      bff: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.bff }}
      deploy: ${{ github.event_name == 'workflow_dispatch' || steps.changes.outputs.deploy }}
      # Empty on a dispatch, which has no change to read: they gate only the
      # packages job's pull-request check and the push to main (ADR-149, ADR-150).
      assistant: ${{ steps.changes.outputs.assistant }}
      anthropic: ${{ steps.changes.outputs.anthropic }}
      # Empty on a dispatch, which builds images and has no guard to test.
      guard: ${{ steps.changes.outputs.guard }}
      # Empty on a dispatch, which moves no package: the build's restore then
      # leaves an advisory to the scheduled audit (ADR-209).
      restore-audit: ${{ steps.changes.outputs.restore-audit }}
      # False only on a pull request: a push run is what tests two merged changes
      # together (§15.1). Only two real false answers skip, and readers test
      # `!= 'false'`, so an output lost at either end builds.
      code: ${{ github.event_name != 'pull_request' || steps.changes.outputs.code != 'false' || steps.changes.outputs.stage-inputs != 'false' }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect changed services
        id: changes
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Without this, negated patterns are silently ignored: the default
          # quantifier ('some') never evaluates the exclusion below.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            # Inputs every deployable compiles, including the three repo-root files.
            inputs: &inputs
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'global.json'
              # An input to every `docker build .` in the image jobs, and to
              # nothing the solution build can check: excluding a copied
              # project here is a broken image, and un-excluding a local secret
              # is one with credentials in it. Neither is visible to
              # `dotnet build`, and without this line a change to it rebuilds
              # no image at all.
              - '.dockerignore'
              # Copied into the publish stage by every application
              # Dockerfile, and ADR-019 makes it a build input rather than an
              # editor hint: a change to it alters what every image compiles
              # with, and the solution build cannot see the Docker context.
              - '.editorconfig'
              - 'src/BuildingBlocks/**'
              # The contract suite (§12.6) guards compatibility between
              # services, so it belongs to all of them. Owned by none, it
              # would run for none.
              - 'tests/Platform.*/**'
            # What every service shares: the inputs less the assistant's two
            # blocks, which only the BFF's image holds. A negation wins under
            # some-with-excludes, so the BFF takes the inputs instead; the
            # packages job reads its own filters below (ADR-150, ADR-151).
            shared: &shared
              - *inputs
              - '!src/BuildingBlocks/Common.Assistant/**'
              - '!src/BuildingBlocks/Common.Assistant.Anthropic/**'
            catalog:
              - *shared
              - 'src/Services/Catalog/**'
              - 'tests/Catalog.*/**'
            ordering:
              - *shared
              - 'src/Services/Ordering/**'
              - 'tests/Ordering.*/**'
            inventory:
              - *shared
              - 'src/Services/Inventory/**'
              - 'tests/Inventory.*/**'
            payments:
              - *shared
              - 'src/Services/Payments/**'
              - 'tests/Payments.*/**'
            # Shipping's filter reaches into Ordering's tree for the proto its
            # images copy, on the terms the BFF's entry below argues (§15.1).
            shipping:
              - *shared
              - 'src/Services/Shipping/**'
              - 'tests/Shipping.*/**'
              - 'src/Services/Ordering/Ordering.Api/Protos/**'
            notifications:
              - *shared
              - 'src/Services/Notifications/**'
              - 'tests/Notifications.*/**'
            privacy:
              - *shared
              - 'src/Services/Privacy/**'
              - 'tests/Privacy.*/**'
            # The gateway is a deployable like any other — its own image
            # (§15.2), its own chart (§15.3), its own Program.cs and route
            # file. Left out of this list, a change to that route file is never
            # rebuilt — and the route file is the one place in the platform
            # where a policy name is resolved at startup rather than at a call
            # site (§10.2), so a bad one is a host that refuses to boot on the
            # first deploy that does build it.
            gateway:
              - *shared
              - 'src/Gateway/**'
            # The BFF is a deployable too, and §15.1 argues why its filter
            # reaches into Catalog's, Inventory's and Notifications' trees for the protos
            # Web.Bff compiles.
            # `pipeline-gate filters` cannot see that case, because it asks
            # whether a deployable is reachable rather than whether a filter is
            # complete.
            bff:
              - *inputs
              - 'src/BFF/**'
              - 'src/Services/Catalog/Catalog.Api/Protos/**'
              - 'src/Services/Notifications/Notifications.Api/Protos/**'
              - 'src/Services/Inventory/Inventory.Api/Protos/**'
            # A chart or values change produces no new image and must still
            # reach the cluster (§15.1's "a config-only deploy needs a tag it
            # did not build"). deploy/compose/** is excluded because it reaches
            # no cluster; deploy/helm/** has a workflow of its own and is not
            # excluded, because a chart change has to roll.
            deploy:
              - 'deploy/**'
              - '!deploy/compose/**'
            # The two packages ADR-149 publishes, one filter each, because
            # each carries its own Version and only a changed one is pushed.
            assistant:
              - 'src/BuildingBlocks/Common.Assistant/**'
            anthropic:
              - 'src/BuildingBlocks/Common.Assistant.Anthropic/**'
            # What edit-target-guard's two suites read, the hooks, scripts,
            # settings and skill examples under `.claude/`, and the workflow
            # that defines its matrix. Whole, so a suite that reads one more
            # file there needs no edit here.
            guard:
              - '.claude/**'
              - '.github/workflows/ci.yml'
            # What can add or move a package, or change what NuGet's audit
            # does with an advisory: a change here is audited as an error by
            # the build's restore, and any other hears an advisory from
            # nuget-audit.yml instead (ADR-209).
            restore-audit:
              - 'Directory.Packages.props'
              - 'global.json'
              - '**/*.csproj'
              - '**/*.props'
              - '**/*.targets'
              - '**/*.slnx'
              # Each spelling NuGet reads on a case-sensitive runner.
              - '**/nuget.config'
              - '**/NuGet.config'
              - '**/NuGet.Config'
            # What the build and the test stages read, named by what they do
            # not, so a new path costs a build rather than skipping one. Only
            # `pipeline-gate code` and commit_builds.py read these beside the job.
            code:
              - '**'
              - '!.claude/**'
              - '!.github/**'
              - '!.harness/**'
              - '!docs/**'
              - '!*.md'
            # An exclusion is final, so what those exclude and a stage still
            # reads is a filter of its own: the gates the build and stage-gate
            # run, this workflow, and each document a test reads, which
            # `pipeline-gate code` holds to the tests.
            stage-inputs:
              - '.github/coverage/**'
              - '.github/output-gate/**'
              - '.github/pipeline-gate/**'
              - '.github/workflows/ci.yml'
              - 'docs/backend-architecture/13-observability.md'
              - 'docs/personal-data.md'

  # What IDE0055 cannot read — the byte-order mark and the final newline —
  # over every C# file but generated code; docs/style-guide.md
  # owns which rules those are. `--folder` reads the files without loading the
  # solution, so this needs no restore and no build to wait for.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: The source matches .editorconfig
        run: dotnet format whitespace --folder --verify-no-changes

  # The four checks that answer in under a minute run beside `build`,
  # `integration` and `scaffold-build` rather than ahead of them, and
  # `stage-gate` needs all four, so a red one still holds back every job that
  # needs it (ADR-202).

  # Each step of `build`, `integration` and `stage-gate` asks `changes` whether a
  # stage reads this change, but for those on `failure()`, or `always()` beside a
  # file or step output, which run only behind a step that ran. The jobs carry no
  # `if:` (`pipeline-gate code`): skipped steps pass, so the check keeps its name
  # and `needs:` still run.
  build:
    needs: changes
    runs-on: ubuntu-latest
    # Forty green runs before 2026-10-09 took at most 5.4 minutes here and 6.2
    # in the slowest integration shard, so 30 fails a hanging test in half an
    # hour rather than at GitHub's default of 360.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code != 'false'

      # No version named here. global.json is the pin (§4.4), and a version in
      # two places is a version that drifts.
      - uses: actions/setup-dotnet@v6
        if: needs.changes.outputs.code != 'false'
        with:
          global-json-file: global.json

      # The output gate below is stdlib Python, so it takes the same pin
      # every other Python job here does. The runner ships a
      # Python, and relying on it would make this the one job whose interpreter
      # nobody chose.
      - uses: actions/setup-python@v7
        if: needs.changes.outputs.code != 'false'
        with:
          python-version: '3.12'

      # An advisory is an error here only for a change that could move a package;
      # one published since the last push is nuget-audit.yml's to hear, so it
      # turns no unrelated pull request red (ADR-209). This job alone passes
      # it: one audit per change is the gate, and the shards add none.
      - run: >-
          dotnet restore Platform.slnx
          -p:NuGetAuditAsError=${{ needs.changes.outputs.restore-audit == 'true' }}
        if: needs.changes.outputs.code != 'false'

      - run: dotnet build Platform.slnx --no-restore -c Release
        if: needs.changes.outputs.code != 'false'

      # §4.1's rule that the source trees hold nothing a build wrote, as a
      # property CI re-measures. It runs behind the restore and the build and
      # ahead of the test stages: the restore writes one half of what would
      # land beside a `.csproj` and the build the other, so this is the first
      # moment it has an answer and the last before anything touches the tree.

      # What the outcome rests on, and why it is held by a gate rather than by
      # a second MSBuild property, is argued in `Directory.Build.props`' Output
      # comment, which owns that decision.
      - name: No build output landed beside the source
        if: needs.changes.outputs.code != 'false'
        run: python .github/output-gate/output_gate.py

      # The other half of §4.1, and the half only CI can check. The gate above
      # is portable: it refuses `bin/` and `obj/` anywhere under the source
      # trees, and it holds on any working tree whatever else the developer has
      # in flight. §4.1's sentence is wider than that — nothing a build wrote —
      # and the wider claim needs a before as well as an after.

      # Here there is one. `actions/checkout` left these trees byte-identical
      # to the commit and nothing between it and this line may touch them, so
      # anything these trees now hold that the commit did not is something the
      # restore or the build put there. `--ignored` because build output is
      # ignored by construction, and the case that hides is the one worth
      # catching.

      # A step rather than part of the gate, because the gate cannot know what
      # the tree looked like first. Run locally this check would fail on the
      # developer's own work in progress, so it lives where the precondition is
      # true and nowhere else.
      - name: The build left src/, tests/ and tools/ byte-identical
        if: needs.changes.outputs.code != 'false'
        run: |
          wrote="$(git status --porcelain --ignored -- src tests tools)"
          if [ -n "$wrote" ]; then
            echo "The restore or the build wrote into a source tree:"
            echo "$wrote"
            exit 1
          fi

      # Two of §15.1's three stages select from this build; the integration
      # stage is sharded into jobs of its own below. The service filters above
      # decide what to image and deploy, never which tests run, because §4.2's
      # gates read the whole dependency graph and §12.9's coverage figure is
      # over the whole run: `code` says all of them or none.

      # The first seam is instrumentation rather than category. §4.2's
      # architecture gates read GetReferencedAssemblies on the Domain
      # assemblies; coverage.runsettings instruments exactly those; and on this
      # runner an instrumented Domain assembly reports a `netstandard`
      # reference its source cannot have, where the same collector on Windows
      # leaves the file byte-identical. So the gates run first and
      # uninstrumented, where the question they ask is about the compiler's
      # output. Weakening the allow-list to admit `netstandard` was the
      # one-line alternative and is the wrong one: it would relax an
      # architecture rule everywhere and in every service the scaffold renders.

      # The second seam is the category (§12.4, docs/testing.md): the fast half
      # starts no container, proved with `docker events`, and the slow half
      # needs a daemon. Each integration shard builds for itself rather than
      # receiving this job's output, so its `--no-build` reads its own build.

      # The filters are exhaustive and disjoint by construction, so the
      # counts sum to the whole suite, and the stage gate below is what turns
      # that from a claim into a check in both directions: every test project
      # ran in some stage, and no test ran in two.

      # `--logger trx` is what the stage gate counts from, and it is not free:
      # it changes where the collector writes, so each stage leaves the run's
      # merged attachment and one partial per test project. The reporter merges
      # rather than assuming a single file, and its suite pins that.
      - name: Architecture gates
        if: needs.changes.outputs.code != 'false'
        run: >
          dotnet test Platform.slnx --no-build -c Release
          --filter "FullyQualifiedName~ArchitectureTests"
          --logger trx
          --results-directory ./TestResults/architecture

      # The collector is Microsoft.CodeCoverage, which arrives with
      # Microsoft.NET.Test.Sdk and is therefore already in every test project:
      # no package added, no licence-register entry owed.
      - name: Unit stage
        if: needs.changes.outputs.code != 'false'
        run: >
          dotnet test Platform.slnx --no-build -c Release
          --filter "FullyQualifiedName!~ArchitectureTests&Category!=Integration"
          --collect:"Code Coverage"
          --settings coverage.runsettings
          --logger trx
          --results-directory ./TestResults/unit

      - name: Hand the two stages to the stage gate
        if: needs.changes.outputs.code != 'false'
        uses: actions/upload-artifact@v7
        with:
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          name: stages-build
          path: TestResults
          if-no-files-found: error

  # Rebase landing puts every commit on main, and `build` compiles only the
  # head. A commit that does not compile costs a `git bisect` its whole range,
  # so each one before the head is built here; a red test in one costs a
  # single step, so tests are not run. A pull request of one commit has
  # nothing to build and passes.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # A commit whose diff from its parent no stage reads builds what that parent
      # did, so it is skipped by name. Decided ahead of the loop, whose checkouts
      # and clean take the script away, and through a file so that its failure
      # stops the step rather than reading as no commits.
      - name: Decide which commits build
        id: decide
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python .github/pipeline-gate/commit_builds.py "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/commits.txt"
          versions=""
          sdk_of='import json, sys; print(json.load(sys.stdin).get("sdk", {}).get("version", ""))'
          while read -r verdict sha _; do
            [ "$verdict" = build ] || continue
            # A commit with no global.json, or one naming no version, pins nothing: it takes the SDK above.
            git cat-file -e "$sha:global.json" 2>/dev/null || continue
            pinned=$(git show "$sha:global.json" | python -c "$sdk_of")
            [ -n "$pinned" ] || continue
            versions="$versions$pinned"$'\n'
          done < "$RUNNER_TEMP/commits.txt"
          {
            echo "sdks<<EOF"
            printf '%s' "$versions" | sort -u
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # An earlier commit can pin another SDK under `rollForward: disable`, and
      # without it installed that commit fails on the SDK, not on its build.
      - uses: actions/setup-dotnet@v6
        if: steps.decide.outputs.sdks != ''
        with:
          dotnet-version: ${{ steps.decide.outputs.sdks }}

      - name: Every commit before the head builds
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t verdicts < "$RUNNER_TEMP/commits.txt"
          echo "${#verdicts[@]} commit(s) besides the head"
          for line in "${verdicts[@]}"; do
            echo "$line"
            read -r verdict sha _ <<< "$line"
            [ "$verdict" = build ] || continue
            echo "::group::$sha"
            git checkout --quiet --detach "$sha"
            git clean -fdxq
            dotnet restore Platform.slnx
            dotnet build Platform.slnx --no-restore -c Release
            echo "::endgroup::"
          done

  # The integration stage, one shard per runner. The filters are a cascade:
  # each shard excludes every shard above it and `rest` excludes them all, so
  # the shards are disjoint and exhaustive whatever a namespace contains, and
  # a project no shard names runs in `rest`. The key is not `filter`, which
  # `pipeline-gate images` reads as an image's.
  integration:
    # Unnamed, a leg is labelled with every matrix value, `selects` included.
    name: integration (${{ matrix.shard }})
    needs: changes
    runs-on: ubuntu-latest
    # Sized with the build job's, above.
    timeout-minutes: 30
    strategy:
      # Each shard's failures are its own to report, so one red shard cancels none.
      fail-fast: false
      matrix:
        include:
          - shard: payments
            selects: FullyQualifiedName~Payments.
          - shard: ordering
            selects: FullyQualifiedName~Ordering.&FullyQualifiedName!~Payments.
          - shard: notifications
            selects: >-
              FullyQualifiedName~Notifications.&FullyQualifiedName!~Payments.&FullyQualifiedName!~Ordering.
          - shard: shipping
            selects: >-
              FullyQualifiedName~Shipping.&FullyQualifiedName!~Payments.&FullyQualifiedName!~Ordering.&FullyQualifiedName!~Notifications.
          - shard: platform
            selects: >-
              FullyQualifiedName~Platform.IntegrationTests.&FullyQualifiedName!~Payments.&FullyQualifiedName!~Ordering.&FullyQualifiedName!~Notifications.&FullyQualifiedName!~Shipping.
          - shard: rest
            selects: >-
              FullyQualifiedName!~Payments.&FullyQualifiedName!~Ordering.&FullyQualifiedName!~Notifications.&FullyQualifiedName!~Shipping.&FullyQualifiedName!~Platform.IntegrationTests.
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        if: needs.changes.outputs.code != 'false'
        with:
          global-json-file: global.json

      - run: dotnet restore Platform.slnx
        if: needs.changes.outputs.code != 'false'

      - run: dotnet build Platform.slnx --no-restore -c Release
        if: needs.changes.outputs.code != 'false'

      # ADR-010 already made real infrastructure non-optional, and a category
      # is not a skip: selected out, a test is not reported as passing;
      # selected in, it needs the daemon exactly as before. The runner has one.
      - name: Integration stage, ${{ matrix.shard }}
        id: stage
        if: needs.changes.outputs.code != 'false'
        env:
          PLATFORM_SIGHTINGS_DIR: ${{ github.workspace }}/TestResults/sightings
          FILTER: Category=Integration&${{ matrix.selects }}
        # A first attempt that fails on TestcontainersWarmUp's named failure runs
        # once more, since a type initialiser that threw never runs again in its
        # process and only a new one recovers (docs/testing.md). Without it a failure
        # is final; with it the whole shard reruns, a failure beside it too, and the
        # first attempt's results go, or the stage gate would count them twice.
        run: |
          set -o pipefail
          # A silent testhost would otherwise run to the job's timeout and name
          # nothing. Ten minutes without a test starting or ending, far above any
          # passing test, has blame dump and kill it, and the log name the test.
          # The dump is full: a mini one holds no managed heap, and an awaited
          # hang, the usual one here, shows on no thread's stack.
          stage() {
            dotnet test Platform.slnx --no-build -c Release --filter "$FILTER" \
              --collect:"Code Coverage" --settings coverage.runsettings \
              --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type full \
              --logger trx --results-directory ./TestResults/integration
          }
          if stage 2>&1 | tee first-attempt.log; then exit 0; fi
          grep -qF "Testcontainers' static initialisation failed" first-attempt.log || exit 1
          echo "::warning::TestcontainersWarmUp's named failure; running the shard again in a new process."
          echo "retried=true" >> "$GITHUB_OUTPUT"
          rm -rf ./TestResults/integration
          stage

      - name: Hand the shard to the stage gate
        if: needs.changes.outputs.code != 'false'
        uses: actions/upload-artifact@v7
        with:
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          name: stages-integration-${{ matrix.shard }}
          path: TestResults/integration
          if-no-files-found: error

      # The step above runs on success only, so a red shard keeps its results
      # here: the TRX, blame's sequence file and dump after a hang, and the first
      # attempt's log. Not on cancel, which the concurrency group does to every
      # superseded push; at the shard's usual pace a hang starts inside ten
      # minutes, retry included, so blame fails it before the job's timeout.
      - name: Keep a failed shard's results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          name: failed-integration-${{ matrix.shard }}
          path: |
            TestResults/integration
            first-attempt.log
          if-no-files-found: ignore
          # A full hang dump runs to gigabytes, and the default level's time
          # comes out of the job's timeout; level 1 still shrinks a dump well.
          compression-level: 1

      # A test that passed on something rare writes it here (Sightings.cs). Kept
      # and posted on the issue that tracks it, so a recurrence is read without
      # anyone opening this log. Not the stage gate's: it counts TestResults/integration.
      - name: Keep the sightings
        if: always() && hashFiles('TestResults/sightings/*.txt') != ''
        uses: actions/upload-artifact@v7
        with:
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          name: sightings-${{ matrix.shard }}
          path: TestResults/sightings

      # A retry hides the failure it recovered from, so integration-report posts
      # it where that failure is tracked, which counts each recurrence.
      - name: Note the warm-up retry
        if: always() && steps.stage.outputs.retried == 'true'
        env:
          OUTCOME: ${{ steps.stage.outcome }}
        run: echo "$OUTCOME" > warm-up-retry.txt

      - name: Keep the warm-up retry
        if: always() && steps.stage.outputs.retried == 'true'
        uses: actions/upload-artifact@v7
        with:
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          name: warm-up-retry-${{ matrix.shard }}
          path: warm-up-retry.txt

  # The grant to comment, in a job with no checkout: the shards run the branch's
  # tests and hold none (ADR-197). The artifacts are the record, so a fork's token,
  # which cannot comment, or a missed comment fails no run the shards passed. A red
  # shard's sighting is still a sighting, and a shard `changes` skipped wrote nothing.
  integration-report:
    needs: [changes, integration]
    if: ${{ !cancelled() && needs.integration.result != 'skipped' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: sightings-*
          path: sightings

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: warm-up-retry-*
          path: retries

      # A sighting is a flake that did not fail, so it goes where flakes are counted,
      # the flaky tests tracker (docs/harness/working-rules.md, CI), named by its file.
      - name: "Post the sightings on #1406"
        continue-on-error: true
        run: |
          shopt -s nullglob
          for f in sightings/sightings-*/*.txt; do
            shard=$(basename "$(dirname "$f")")
            {
              echo "A passing run saw $(basename "$f" .txt). Run $RUN_URL, shard ${shard#sightings-}, ref $REF_NAME."
              echo
              echo '```'
              head -c 60000 "$f"
              echo
              echo '```'
            } > body.md
            gh issue comment 1406 --body-file body.md
          done

      - name: "Post the warm-up retries on #960"
        continue-on-error: true
        run: |
          shopt -s nullglob
          for f in retries/warm-up-retry-*/warm-up-retry.txt; do
            shard=$(basename "$(dirname "$f")")
            gh issue comment 960 --body \
              "TestcontainersWarmUp's named failure, and the shard ran again in a new process.
              Run $RUN_URL, shard ${shard#warm-up-retry-}, ref $REF_NAME; the retry's outcome was $(cat "$f")."
          done

  # Every stage's results in one place, the only place both readers below can
  # judge the run whole. Not `if: always()`: after a failed stage there is
  # nothing to count, and a second red job would say the gate broke when the
  # suite did.
  stage-gate:
    needs: [changes, build, integration, licence-gate, pipeline-gate, format, workflow-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code != 'false'

      - uses: actions/setup-python@v7
        if: needs.changes.outputs.code != 'false'
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.code != 'false'
        with:
          name: stages-build
          path: TestResults

      # One directory per shard under integration/, and both readers walk it.
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.code != 'false'
        with:
          pattern: stages-integration-*
          path: TestResults/integration

      # `dotnet test` exits zero on a filter that matches no test (§12.1), so
      # every filtered stage can be green and empty. This asserts a floor on
      # each, that every test project in Platform.slnx ran in one of them, and
      # that none ran in two.
      - name: Every stage ran, ran enough, and ran once
        if: needs.changes.outputs.code != 'false'
        run: >
          python .github/pipeline-gate/pipeline_gate.py stages
          ./TestResults/architecture ./TestResults/unit ./TestResults/integration

      # Reported, never gated. §12.9 calls coverage a diagnostic rather than a
      # target and argues that a diagnostic wired to a build failure stops
      # being read and starts being satisfied, so the quality gate sits on the
      # step above instead: its subject is whether a suite ran at all, which is
      # a fact rather than a target.

      # It can still fail on a missing or unreadable report, and should: a
      # coverage step that shrugs at no data reports nothing on the day the
      # collector stops running, which reads exactly like a clean result. Both
      # stages, because the domain assemblies are exercised on both sides of
      # the category and §12.9 asks for the figure over the whole run.

      # One root per shard, so a shard whose collector wrote nothing is named
      # rather than hidden in the stage's total.
      - name: Report domain-layer coverage
        if: needs.changes.outputs.code != 'false'
        run: >
          python .github/coverage/domain_coverage.py
          ./TestResults/unit ./TestResults/integration/*

  # §15.1's per-service image build, closing the gap compose.yml names: that
  # smoke is filtered to deploy/compose/**, so a Dockerfile a source change
  # broke would surface on the next compose pull request. Here it surfaces on
  # the offending one, after the test stages, in the order §15.1 draws.

  # Built with an SBOM on a pull request, holding no grant while the branch's
  # Dockerfiles run; publish-images does the same on main and pushes, signs and
  # attests too, each by digest (ADR-109, ADR-197). `pipeline-gate images` asserts
  # every Dockerfile under src/ appears below and every build has its SBOM.
  images:
    # Skipped on main alone: a skipped job is never expanded, so its one check is
    # named with the expression below unevaluated, and no pull request reads that.
    if: ${{ github.ref != 'refs/heads/main' }}
    name: images (${{ matrix.image }})
    needs: [changes, stage-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy: &image-legs
      # One red image should not cancel the others: which Dockerfile broke is
      # the useful signal, and fail-fast reports the first alphabetically.
      fail-fast: false
      matrix:
        include:
          - filter: catalog
            image: catalog-api
            dockerfile: src/Services/Catalog/Catalog.Api/Dockerfile
          - filter: catalog
            image: catalog-migrator
            dockerfile: src/Services/Catalog/Catalog.Migrator/Dockerfile
          - filter: ordering
            image: ordering-api
            dockerfile: src/Services/Ordering/Ordering.Api/Dockerfile
          - filter: ordering
            image: ordering-migrator
            dockerfile: src/Services/Ordering/Ordering.Migrator/Dockerfile
          - filter: inventory
            image: inventory-api
            dockerfile: src/Services/Inventory/Inventory.Api/Dockerfile
          - filter: inventory
            image: inventory-migrator
            dockerfile: src/Services/Inventory/Inventory.Migrator/Dockerfile
          - filter: payments
            image: payments-api
            dockerfile: src/Services/Payments/Payments.Api/Dockerfile
          - filter: payments
            image: payments-migrator
            dockerfile: src/Services/Payments/Payments.Migrator/Dockerfile
          - filter: shipping
            image: shipping-worker
            dockerfile: src/Services/Shipping/Shipping.Worker/Dockerfile
          - filter: shipping
            image: shipping-migrator
            dockerfile: src/Services/Shipping/Shipping.Migrator/Dockerfile
          - filter: notifications
            image: notifications-api
            dockerfile: src/Services/Notifications/Notifications.Api/Dockerfile
          - filter: notifications
            image: notifications-worker
            dockerfile: src/Services/Notifications/Notifications.Worker/Dockerfile
          - filter: notifications
            image: notifications-migrator
            dockerfile: src/Services/Notifications/Notifications.Migrator/Dockerfile
          - filter: privacy
            image: privacy-api
            dockerfile: src/Services/Privacy/Privacy.Api/Dockerfile
          - filter: privacy
            image: privacy-migrator
            dockerfile: src/Services/Privacy/Privacy.Migrator/Dockerfile
          - filter: gateway
            image: gateway
            dockerfile: src/Gateway/Gateway.Api/Dockerfile
          - filter: bff
            image: web-bff
            dockerfile: src/BFF/Web.Bff/Dockerfile
          - filter: bff
            image: bff-migrator
            dockerfile: src/BFF/Web.Bff.Migrator/Dockerfile
    steps:
      # The index has to resolve, and nothing else here would say if it did
      # not. `needs.changes.outputs[matrix.filter]` on a name no filter defines
      # is the empty string rather than an error, so every `if` below would be
      # false and this job would report success having built nothing — the
      # failure `pipeline-gate images` catches at the name level and cannot
      # catch at the expression level. This step has no `if`, so it runs for
      # every matrix leg including the skipped ones.
      - name: The filter this leg reads resolves to a decision
        run: |
          case "${{ needs.changes.outputs[matrix.filter] }}" in
            true|false) echo "${{ matrix.filter }}=${{ needs.changes.outputs[matrix.filter] }}" ;;
            *) echo "::error::needs.changes.outputs[${{ matrix.filter }}] is not true/false. The images matrix names a filter the changes job does not output, so this image would never be built."; exit 1 ;;
          esac

      - uses: actions/checkout@v7
        if: ${{ needs.changes.outputs[matrix.filter] == 'true' }}
        with:
          persist-credentials: false

      # The build context is the repository root, exactly as §14.1's Compose
      # file sets it — these Dockerfiles copy csproj files from across the
      # solution, so a narrower context breaks the restore layer. The second
      # tag is the registry's, pushed only by publish-images; the label links the
      # package to this repository, so it inherits the repository's access.
      - name: Build ${{ matrix.image }}
        if: ${{ needs.changes.outputs[matrix.filter] == 'true' }}
        run: >
          bash .github/pipeline-gate/image_retry.sh run "Build"
          docker build
          --file ${{ matrix.dockerfile }}
          --tag ${{ matrix.image }}:${{ github.sha }}
          --tag "$REGISTRY/${{ matrix.image }}:${{ github.sha }}"
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          --label org.opencontainers.image.revision=${{ github.sha }}
          .

      # ADR-071: an SBOM from the built image, as SPDX JSON in a workflow
      # artefact. A third party's action reads the image, so it is pinned to a
      # commit and not a tag.
      - name: SBOM for ${{ matrix.image }}
        id: sbom
        if: ${{ needs.changes.outputs[matrix.filter] == 'true' }}
        continue-on-error: true
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ matrix.image }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json
          artifact-name: sbom-${{ matrix.image }}.spdx.json
          upload-artifact-retention: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Note the failed SBOM for ${{ matrix.image }}
        if: ${{ steps.sbom.outcome == 'failure' }}
        run: bash .github/pipeline-gate/image_retry.sh note "SBOM"

      - name: SBOM for ${{ matrix.image }}, second attempt
        if: ${{ steps.sbom.outcome == 'failure' }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ matrix.image }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json
          artifact-name: sbom-${{ matrix.image }}.spdx.json
          upload-artifact-retention: ${{ env.ARTIFACT_RETENTION_DAYS }}

      # A retry hides the failure it recovered from, so image-retry-report posts it.
      # Only after success, since a leg still red says so itself,
      # and a lost record is no reason to fail a leg that recovered.
      - name: Keep what a retry recovered from
        if: ${{ needs.changes.outputs[matrix.filter] == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          name: image-retry-${{ matrix.image }}
          path: ${{ runner.temp }}/image-retries.txt
          if-no-files-found: ignore

  # What main alone does (ADR-109). The job's own condition is what keeps its
  # grants off a pull request, since a job holds them from its first step and
  # `permissions:` takes no expression (ADR-197), and `pipeline-gate images` holds
  # its build to the line above and asserts its push, signature and two
  # attestations. Unnamed, so the check a pull request sees skip names no expression.
  publish-images:
    if: ${{ contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' }}
    needs: [changes, stage-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy: *image-legs
    steps:
      - name: The filter this leg reads resolves to a decision
        run: |
          case "${{ needs.changes.outputs[matrix.filter] }}" in
            true|false) echo "${{ matrix.filter }}=${{ needs.changes.outputs[matrix.filter] }}" ;;
            *) echo "::error::needs.changes.outputs[${{ matrix.filter }}] is not true/false. The images matrix names a filter the changes job does not output, so this image would never be built."; exit 1 ;;
          esac

      # The whole history, because the main tag moves only forward in it
      # (ADR-134) and the step that decides needs `git merge-base`.
      - uses: actions/checkout@v7
        if: ${{ needs.changes.outputs[matrix.filter] == 'true' }}
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build ${{ matrix.image }}
        if: ${{ needs.changes.outputs[matrix.filter] == 'true' }}
        run: >
          bash .github/pipeline-gate/image_retry.sh run "Build"
          docker build
          --file ${{ matrix.dockerfile }}
          --tag ${{ matrix.image }}:${{ github.sha }}
          --tag "$REGISTRY/${{ matrix.image }}:${{ github.sha }}"
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          --label org.opencontainers.image.revision=${{ github.sha }}
          .

      # The artefact is also the file the attestation below reads, so the two
      # cannot differ (ADR-109).
      - name: SBOM for ${{ matrix.image }}
        id: sbom
        if: ${{ needs.changes.outputs[matrix.filter] == 'true' }}
        continue-on-error: true
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ matrix.image }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json
          artifact-name: sbom-${{ matrix.image }}.spdx.json
          upload-artifact-retention: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Note the failed SBOM for ${{ matrix.image }}
        if: ${{ steps.sbom.outcome == 'failure' }}
        run: bash .github/pipeline-gate/image_retry.sh note "SBOM"

      - name: SBOM for ${{ matrix.image }}, second attempt
        if: ${{ steps.sbom.outcome == 'failure' }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ matrix.image }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json
          artifact-name: sbom-${{ matrix.image }}.spdx.json
          upload-artifact-retention: ${{ env.ARTIFACT_RETENTION_DAYS }}

      # Each carries the filter too, so a leg that built nothing signs nothing.
      - name: Sign in to the registry
        if: ${{ needs.changes.outputs[matrix.filter] == 'true' && contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The digest is read back from the local image after the push, and
      # everything below names the image by it. A tag can be pushed over, so a
      # signature or attestation made by tag could land on other bytes.
      - name: Push ${{ matrix.image }}
        id: push
        if: ${{ needs.changes.outputs[matrix.filter] == 'true' && contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          docker push "$REGISTRY/${{ matrix.image }}:${{ github.sha }}"
          pushed=$(docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY/${{ matrix.image }}:${{ github.sha }}")
          digest="${pushed##*@}"
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::The push of ${{ matrix.image }} reported no sha256 digest, so there is nothing to sign."
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: ${{ needs.changes.outputs[matrix.filter] == 'true' && contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' }}
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Keyless: the identity is this workflow on main, vouched for by the
      # job's OIDC token and recorded in Sigstore's public log (ADR-071). Signing
      # twice is safe, as .github/pipeline-gate/README.md argues.
      - name: Sign ${{ matrix.image }}
        if: ${{ needs.changes.outputs[matrix.filter] == 'true' && contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' }}
        run: bash .github/pipeline-gate/image_retry.sh run "Sign" cosign sign --yes "$REGISTRY/${{ matrix.image }}@$DIGEST"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Provenance for ${{ matrix.image }}
        id: provenance
        if: ${{ needs.changes.outputs[matrix.filter] == 'true' && contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Note the failed Provenance for ${{ matrix.image }}
        if: ${{ steps.provenance.outcome == 'failure' }}
        run: bash .github/pipeline-gate/image_retry.sh note "Provenance"

      - name: Provenance for ${{ matrix.image }}, second attempt
        if: ${{ steps.provenance.outcome == 'failure' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: SBOM attestation for ${{ matrix.image }}
        id: sbom_attestation
        if: ${{ needs.changes.outputs[matrix.filter] == 'true' && contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom-${{ matrix.image }}.spdx.json
          push-to-registry: true

      - name: Note the failed SBOM attestation for ${{ matrix.image }}
        if: ${{ steps.sbom_attestation.outcome == 'failure' }}
        run: bash .github/pipeline-gate/image_retry.sh note "SBOM attestation"

      - name: SBOM attestation for ${{ matrix.image }}, second attempt
        if: ${{ steps.sbom_attestation.outcome == 'failure' }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom-${{ matrix.image }}.spdx.json
          push-to-registry: true

      # The moving tag (ADR-134): the signed digest above under a second name,
      # moved only after the attestations, and only forward: runs finish out of
      # order (ADR-109), so the commit the tag names now must be an ancestor of
      # this one. A leg that built nothing leaves the tag where it was, and a
      # dispatch gives an image no push has touched its first.
      - name: Move the main tag of ${{ matrix.image }}
        if: ${{ needs.changes.outputs[matrix.filter] == 'true' && contains(fromJSON('["push","workflow_dispatch"]'), github.event_name) && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          tag="$REGISTRY/${{ matrix.image }}:main"
          if config=$(docker buildx imagetools inspect "$tag" --format '{{json .Image}}' 2>&1); then
            named=$(printf '%s' "$config" | jq -r '.config.Labels["org.opencontainers.image.revision"] // ""')
          elif printf '%s' "$config" | grep -Eqi 'not found|manifest unknown'; then
            named=""
          else
            echo "::error::The main tag of ${{ matrix.image }} could not be read, so it is not known to be older than this build: $config"
            exit 1
          fi
          if [ -n "$named" ]; then
            ancestor=0
            git merge-base --is-ancestor "$named" "$GITHUB_SHA" || ancestor=$?
            case "$ancestor" in
              0) ;;
              1) echo "::notice::The main tag of ${{ matrix.image }} names $named, which is not an ancestor of $GITHUB_SHA; a newer build finished first and the tag stays."; exit 0 ;;
              *) echo "::error::Could not compare $named with $GITHUB_SHA."; exit 1 ;;
            esac
          fi
          docker tag "$REGISTRY/${{ matrix.image }}:${{ github.sha }}" "$tag"
          docker push "$REGISTRY/${{ matrix.image }}:main"
          # From the registry: the local RepoDigests already hold $DIGEST from the push by sha.
          moved=$(docker buildx imagetools inspect "$tag" | awk '$1 == "Digest:" && !found { print $2; found = 1 }')
          if [ "$moved" != "$DIGEST" ]; then
            # Runs on main overlap (ADR-109): a newer build moving the tag since this push is the tag going forward.
            later=$(docker buildx imagetools inspect "$tag" --format '{{json .Image}}' | jq -r '.config.Labels["org.opencontainers.image.revision"] // ""')
            [ -z "$later" ] || git fetch --quiet origin "$later" 2>/dev/null || true
            if [ -n "$later" ] && [ "$later" != "$GITHUB_SHA" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$later"; then
              echo "::notice::The main tag of ${{ matrix.image }} names $later, a newer build that moved it after this push; the tag stays."
              exit 0
            fi
            echo "::error::The main tag of ${{ matrix.image }} was pushed but the registry has it name ${moved:-nothing}, not the signed digest $DIGEST."
            exit 1
          fi
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      # A retry hides the failure it recovered from, so image-retry-report posts it.
      # Only after success, since a leg still red says so itself,
      # and a lost record is no reason to fail a leg that recovered.
      - name: Keep what a retry recovered from
        if: ${{ needs.changes.outputs[matrix.filter] == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          name: image-retry-${{ matrix.image }}
          path: ${{ runner.temp }}/image-retries.txt
          if-no-files-found: ignore

  # The grant to comment, in a job with no checkout (ADR-197), as integration-report.
  # It runs past a red leg, since the other legs' records are still true.
  image-retry-report:
    needs: [images, publish-images]
    if: ${{ !cancelled() && (needs.images.result != 'skipped' || needs.publish-images.result != 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: image-retry-*
          path: retries

      # Where flakes are counted, as the sightings are (docs/harness/working-rules.md, CI).
      - name: "Post what the image retries recovered from on #1406"
        continue-on-error: true
        run: |
          shopt -s nullglob
          for f in retries/image-retry-*/image-retries.txt; do
            leg=$(basename "$(dirname "$f")")
            gh issue comment 1406 --body \
              "An image step failed and its retry recovered, so the leg stayed green.
              Run $RUN_URL, image ${leg#image-retry-}, ref $REF_NAME; retried: $(paste -sd, "$f")."
          done

  # ADR-149's two packages. Packed on every run a stage reads, once the test
  # stages pass, so a project that cannot pack fails its own pull request
  # (ADR-198). The pack runs the branch's MSBuild files, so this job holds no
  # grant (ADR-197).
  packages:
    if: needs.changes.outputs.code != 'false'
    needs: [changes, stage-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A second checkout and not a fetch, so this job holds no git credential
      # whatever the repository's visibility.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base
          persist-credentials: false

      # The pull request's half of the version rule; the feed's refusal is main's
      # backstop (ADR-150). A project absent at the base is new and has no
      # version to repeat.
      - name: A changed package carries a new Version
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          version() { sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p'; }
          failed=0
          for pair in "Common.Assistant:$ASSISTANT" "Common.Assistant.Anthropic:$ANTHROPIC"; do
            project=${pair%%:*}
            [ "${pair#*:}" = true ] || continue
            path="src/BuildingBlocks/$project/$project.csproj"
            head=$(version < "$path")
            if [ -z "$head" ]; then
              echo "::error::No <Version> read from $path, so the version rule cannot be checked."
              exit 1
            fi
            [ -f ".base/$path" ] || continue
            if [ "$(version < ".base/$path")" = "$head" ]; then
              echo "::error file=$path::$project changed and keeps the base's Version $head; a changed package ships under a new one (ADR-149)."
              failed=1
            fi
          done
          exit "$failed"
        env:
          ASSISTANT: ${{ needs.changes.outputs.assistant }}
          ANTHROPIC: ${{ needs.changes.outputs.anthropic }}

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # RepositoryUrl links each package to this repository on GitHub
      # Packages, which is what lets publish-packages' own token push it.
      - name: Pack both packages
        run: |
          for project in Common.Assistant Common.Assistant.Anthropic; do
            dotnet pack "src/BuildingBlocks/$project/$project.csproj" --configuration Release \
              "-p:RepositoryUrl=${{ github.server_url }}/${{ github.repository }}"
          done

      - name: Hand the packages to the push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.changes.outputs.assistant == 'true' || needs.changes.outputs.anthropic == 'true')
        uses: actions/upload-artifact@v7
        with:
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          name: packages
          path: artifacts/package/release/*.nupkg
          if-no-files-found: error

  # Pushes what the packages job packed, and only the package whose project
  # changed; nothing here builds, so the grant runs no MSBuild file (ADR-197).
  # There is no --skip-duplicate: a changed project that kept its
  # Version and got past the pull request's check is refused by the feed here,
  # instead of leaving a stale package.
  publish-packages:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.changes.outputs.assistant == 'true' || needs.changes.outputs.anthropic == 'true') }}
    needs: [changes, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      FEED: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
    steps:
      # For global.json alone: the SDK pin decides which `dotnet` pushes.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packed

      - name: Push Common.Assistant
        if: needs.changes.outputs.assistant == 'true'
        run: dotnet nuget push packed/Common.Assistant.[0-9]*.nupkg --source "$FEED" --api-key "$TOKEN"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Common.Assistant.Anthropic
        if: needs.changes.outputs.anthropic == 'true'
        run: dotnet nuget push packed/Common.Assistant.Anthropic.*.nupkg --source "$FEED" --api-key "$TOKEN"
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
