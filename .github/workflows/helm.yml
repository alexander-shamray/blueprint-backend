name: Helm

# A separate workflow rather than a job in ci.yml because path filtering is
# per-workflow, and this proves a tree most pull requests never touch. It is
# one of the `deploy/**` artefacts CI exercises directly rather than deploying
# (§15.1).

# It reaches no cluster. `helm template` renders locally, so what this asserts
# is that the charts produce the manifests §15.3, §15.4 and §7.4 describe;
# whether an API server would accept them is a deploy-time question (§15.1),
# named in smoke.sh as not covered.

# The paths below are not maintained here: smoke.sh declares them as
# SOURCE_INPUTS beside the reads that need them, and asserts that every path it
# reads is declared.
on:
  pull_request:
    paths:
      - 'deploy/helm/**'
      - '.github/workflows/helm.yml'
      - '.gitattributes'
      - 'src/Gateway/Gateway.Api/**'
      - 'src/BFF/Web.Bff/**'
      - 'src/Services/Catalog/**'
      - 'src/Services/Ordering/**'
      - 'src/Services/Inventory/**'
      - 'src/Services/Payments/**'
      - 'src/BuildingBlocks/Common.Web/HealthCheckExtensions.cs'
      - 'deploy/canary/**'
  push:
    branches: [main]
    paths:
      - 'deploy/helm/**'
      - '.github/workflows/helm.yml'
      - '.gitattributes'
      - 'src/Gateway/Gateway.Api/**'
      - 'src/BFF/Web.Bff/**'
      - 'src/Services/Catalog/**'
      - 'src/Services/Ordering/**'
      - 'src/Services/Inventory/**'
      - 'src/Services/Payments/**'
      - 'src/BuildingBlocks/Common.Web/HealthCheckExtensions.cs'
      - 'deploy/canary/**'

permissions:
  contents: read

concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    # No images, no containers, no restore: this renders text, so the whole run
    # is seconds.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version the charts were developed and verified against.
      # `latest` here would make a helm release note a way for this repository
      # to go red on a morning nobody changed anything — the same argument
      # global.json makes for the SDK (§4.4).
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Render every chart and assert what comes out
        run: bash deploy/helm/smoke.sh
