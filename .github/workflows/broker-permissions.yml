name: Broker permissions

# Split from `compose.yml` rather than added to it because path filtering is
# per-workflow: that smoke deliberately excludes `src/**`, so a job sharing
# its filter would either drag a long image-pulling smoke onto every messaging
# change or stop watching the code it checks. This gate reads text and needs no
# Docker, no broker and no restore.
#
# The paths below are not maintained here: check_permissions.py declares them
# as SOURCE_INPUTS beside the reads that need them, and asserts that both of
# this workflow's triggers cover every entry.
on:
  pull_request:
    paths:
      - 'deploy/compose/rabbitmq/**'
      - '.github/workflows/broker-permissions.yml'
      - 'src/Services/**'
      - 'src/BuildingBlocks/Common.Contracts/**'
      - 'tests/**'
  push:
    branches: [main]
    paths:
      - 'deploy/compose/rabbitmq/**'
      - '.github/workflows/broker-permissions.yml'
      - 'src/Services/**'
      - 'src/BuildingBlocks/Common.Contracts/**'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: broker-permissions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # The floor every Python job here pins, for the reason CLAUDE.md gives:
      # an unpinned run goes green on code the runner cannot execute.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The suite runs before the gate — CLAUDE.md's "tested and then run".
      # Its negatives are mutations that must go red, each with a positive
      # control beside it: a gate observed only green is one nobody has
      # established is looking at anything, and this one guards an
      # authorisation boundary.
      - name: The gate's negatives
        run: python -m unittest discover -s deploy/compose/rabbitmq

      - name: Broker permissions agree with the code
        run: python deploy/compose/rabbitmq/check_permissions.py
