name: Realm

# §11.3's token obligations, against the one realm this repository owns and,
# since ADR-043, against the realm every deployed release points at, between
# rollouts. ADR-033's revocation bound and ADR-034's no-refresh-token rule are
# both realm settings, which is what gives a realm something to be judged
# against.
on:
  pull_request:
    paths:
      - 'deploy/keycloak/**'
      - 'deploy/compose/keycloak/realm-export.json'
      - 'deploy/helm/**'
      - 'src/BuildingBlocks/Common.Web/AuthenticationExtensions.cs'
      - '.github/workflows/deploy.yml'
      - 'deploy/canary/**'
      - '.github/workflows/realm.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/keycloak/**'
      - 'deploy/compose/keycloak/realm-export.json'
      - 'deploy/helm/**'
      - 'src/BuildingBlocks/Common.Web/AuthenticationExtensions.cs'
      - '.github/workflows/deploy.yml'
      - 'deploy/canary/**'
      - '.github/workflows/realm.yml'
  # Hourly, and off the hour. The window is the time between a realm edit and
  # the next rollout, and a schedule bounds it to its own cadence: a run costs
  # two admin-API reads per release and one runner minute. Minute 17 rather
  # than 0 because GitHub sheds top-of-the-hour schedules under load, and a
  # dropped run is a silence rather than a red one -- the failure §13.6 spends
  # a callout on.

  # GitHub suspends a schedule after a stretch without a commit, and without a
  # red run: a stabilised service is exactly the one with no commits. What
  # closes that residual is a monitor outside GitHub asking whether this
  # workflow has run recently, at the cadence deploy/keycloak/README.md sets as
  # an operating decision.
  schedule:
    - cron: '17 * * * *'
  # A dispatch is how an operator re-runs the judgement after correcting a
  # realm, so the issue a red run filed can be closed on evidence rather than
  # on a promise. It runs the same job with the same guard.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed by subject rather than by ref. A scheduled run and a pushed gate run
  # both carry `refs/heads/main`, so under a ref-only key each cancelled the
  # other, and neither is a duplicate of the other. `cancel-in-progress` is for
  # two runs of one subject.

  # The two deployed triggers share one key, which keying by event name alone
  # would not have given them. A schedule and a dispatch judge the same realm,
  # and two in flight at once race the filing step's check-then-create: both
  # see no open issue, both file one. So they collapse to one group and the
  # diff-carrying triggers keep theirs by event and ref. A dispatch arriving
  # mid-schedule cancels the scheduled run, and a cancelled job runs no
  # `failure()` step, so the cancellation files nothing either.
  group: realm-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'deployed' || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

jobs:
  check:
    # The local half, and only on the two triggers that carry a diff. A
    # schedule has no diff to gate, and the `deployed` job below runs this
    # suite itself before judging anything.
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Stdlib Python over text and JSON, so this job needs no restore, no SDK
      # and no Keycloak. `read_admin.py` is the file that would need one, and
      # it does not run here -- there is no realm to read.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The suite runs before the gate -- CLAUDE.md's "tested and then run".
      # Every negative is a mutation that must go red, each paired with a
      # positive control, because a negative that passes when the pattern
      # matches nothing is indistinguishable from one that works. This gate
      # guards a security guarantee two ADRs state platform-wide.
      - name: The gate's negatives
        run: python -m unittest discover -s deploy/keycloak

      - name: This gate reads what its triggers cover
        run: python deploy/keycloak/realm_check.py inputs

      # `--kind local` names the subject, and the kind has no default on
      # purpose: §11.2's password grant is on in this realm and must be off in
      # a deployed one, so one obligation inverts between them. A check that
      # guessed which realm it had would pass a production realm on the local
      # realm's terms.
      - name: The local realm holds section 11's token obligations
        run: python deploy/keycloak/realm_check.py check --kind local

  deployed:
    # Opted in by a repository variable, and that is not the skip this
    # repository refuses. `deploy.yml` runs on `workflow_dispatch` alone
    # because a rollout on `push` would fail on every merge for want of a
    # cluster; an hourly job that went red in a repository with no environment
    # would train everyone to ignore a red pipeline twenty-four times a day.
    # The refused skip is the one that reads a runtime failure as absence; this
    # guard reads a configuration. Once `REALM_CHECK_SCHEDULED` is `enabled`,
    # nothing below is optional -- an absent credential, an unreadable release
    # and a realm that disagrees are all red, on the rollout's own rule.

    # A repository variable and not an Environment one, because a job-level
    # `if` is evaluated before the job's Environment is entered. The three
    # values the job uses are Environment-scoped, exactly as they are for the
    # rollout; only the opt-in sits one level up.
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.REALM_CHECK_SCHEDULED == 'enabled' }}
    runs-on: ubuntu-latest
    # Ten, where the rollout has 150: this job reads and never waits on a hook,
    # a rung or a dwell -- four `helm get values`, four token requests and
    # eight admin reads on a good hour. What stops a hung read is the judge
    # step's own shorter timeout below, because a job cancelled on its timeout
    # runs no `failure()` step, so the one failure this budget exists for would
    # be the one that filed nothing. The job's cap is the headroom the filing
    # step needs after the judge step has been stopped.
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      # `issues: write` is what a red run does, below. It is job-scoped
      # because the `check` job has no business filing anything, and it is the
      # only write permission any workflow here holds.
      issues: write
    env:
      NAMESPACE: commerce
    steps:
      # Judged from `main` and nothing else, on `deploy.yml`'s reasoning. A
      # schedule always runs the default branch's copy of this file, but
      # `workflow_dispatch` lets the caller choose any ref -- and this job
      # authenticates to the production realm with the production credential,
      # running whatever copy of `read_admin.py` and `realm_check.py` that ref
      # carries. An unmerged branch could read the realm with its own weakened
      # predicate and report it compliant.

      # This step is a guard against accident and not the boundary, because it
      # runs from the dispatched ref too. What holds the boundary is the
      # `production` Environment's deployment-branch restriction -- `main` and
      # nothing else -- stated as an obligation in docs/secrets.md beside the
      # credential it protects. This step is what tells somebody who dispatched
      # from a branch why nothing ran, in a repository where the Environment
      # has not been provisioned yet.
      - name: The realm is judged from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Refusing to judge the deployed realm from $GITHUB_REF. This job runs the gate and its own credential handling from the dispatched ref, so it is restricted to the protected branch."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No step authenticates to a cluster, exactly as in `deploy.yml` and for
      # the same reason: there is no cluster, no kubeconfig and no provider
      # anybody has chosen, so a login step written here would be a fiction
      # with credentials in it. `helm get values` below is the first command
      # that needs one; the realm read and the judgement after it need none.

      # The suite runs first here as well as in `check`, and the repetition is
      # the point: this is the copy of the gate that decides against a live
      # realm, so it is the copy that must have been observed red.
      - name: The realm gate's negatives
        run: python -m unittest discover -s deploy/keycloak

      # Every release, not one. The rollout judges the workload it is rolling;
      # between rollouts the question is whether any deployed workload points
      # at a realm that has drifted, and the set of workloads is the canary
      # plan's rather than a list restated here.

      # The same three calls the rollout makes, in the same order, and the
      # suite asserts that of both files. The realm is derived from the
      # release's own `identity.authority` and the origin is pinned from the
      # Environment, for the reasons `deploy.yml` argues beside its copy: a
      # realm named beside the chart is a check that passes on a realm nobody
      # deployed to, and an origin taken from the cluster hands whoever can
      # edit a release the address this job posts a client secret to.

      # Assigned, then read -- never `eval`, and never a process substitution,
      # both of which swallow a failed command. The derivation is captured into
      # a variable first, so `set -e` sees the gate refuse, and each
      # `NAME=value` line is then exported as a literal, which no shell
      # re-parses. The gate has already refused whitespace in either value;
      # this is what keeps that refusal load-bearing rather than the last line
      # of defence.
      - name: Every release points at a realm this deployment names, and each is read and judged
        id: judge
        # A step timeout, so a hung Helm or admin API is a failed step rather
        # than a cancelled job: `failure()` below fires on the first and not
        # on the second, and the gap between this and the job's cap is what
        # the filing step runs in. Six is generous for eight reads.
        timeout-minutes: 6
        run: |
          set -euo pipefail
          # Assigned, then looped -- the same lesson one line up. A command
          # substitution used as a `for` word list does not propagate its
          # failure under `set -e`: a non-zero `canary.py workloads` would
          # become an empty list, the loop would judge nothing and the step
          # would pass green with no issue filed. An empty answer is refused
          # as well, because a plan with no workloads is not a plan this job
          # has any business passing.
          WORKLOADS=$(python deploy/canary/canary.py workloads)
          if [ -z "$WORKLOADS" ]; then
            echo "::error::canary.py workloads named no release, so nothing would be judged."
            exit 1
          fi
          # One line, one release. An unquoted `$WORKLOADS` as the word list
          # would re-split the answer on whitespace and expand a glob against
          # the checkout, so a key the plan gate let through could name a
          # release the plan never did. `mapfile` keeps the line protocol the
          # subcommand emits, and the loop quotes the array.
          mapfile -t WORKLOAD_LIST <<< "$WORKLOADS"
          for WORKLOAD in "${WORKLOAD_LIST[@]}"; do
            echo "::group::$WORKLOAD"
            # `--all`, for the reason the rollout gives: `identity.authority`
            # has a default in every chart, and without it a release that
            # never overrode the value answers a document with no `identity`
            # key at all.
            helm get values "$WORKLOAD" -n "$NAMESPACE" --all -o json \
              > "$RUNNER_TEMP/$WORKLOAD.values.json"
            DERIVED=$(python deploy/keycloak/realm_check.py authority \
              --values "$RUNNER_TEMP/$WORKLOAD.values.json" \
              --trusted-origin "$KEYCLOAK_TRUSTED_ORIGIN")
            while IFS='=' read -r NAME VALUE; do
              export "$NAME=$VALUE"
            done <<< "$DERIVED"
            python deploy/keycloak/read_admin.py --out "$RUNNER_TEMP/$WORKLOAD.realm.json"
            python deploy/keycloak/realm_check.py check \
              --realm "$RUNNER_TEMP/$WORKLOAD.realm.json" --kind deployed
            echo "::endgroup::"
          done
        env:
          KEYCLOAK_TRUSTED_ORIGIN: ${{ vars.KEYCLOAK_TRUSTED_ORIGIN }}
          # KEYCLOAK_BASE_URL and KEYCLOAK_REALM are deliberately absent.
          # They are exported inside the loop from what `authority` derived,
          # and declaring them here would let an Environment variable name a
          # realm no release is pointed at.
          KEYCLOAK_CHECK_CLIENT_ID: ${{ vars.KEYCLOAK_CHECK_CLIENT_ID }}
          KEYCLOAK_CHECK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CHECK_CLIENT_SECRET }}

      # What a red run does: §13.6's rule is that an alert with no procedure is
      # a page nobody can act on, so it files an issue, or comments on the open
      # one, and `deploy/keycloak/README.md` is the procedure it points at.

      # An issue and not a runbook, because `docs/runbooks/` is one file per
      # Prometheus alert and `deploy/observability/check.py` fails the build on
      # a runbook with no alert behind it. Nothing in §13.6 fires this. And an
      # issue rather than a notification because a notification is read once
      # and an issue is open until somebody closes it: the next run comments
      # rather than filing again, so the tracker holds one issue per drift and
      # not one per hour.

      # `security` and `critical`, and the second is decided rather than
      # hedged. This step cannot tell a realm that drifted from a realm that
      # could not be read, and the rule that decides is the rollout's: a realm
      # nobody can see holds no guarantee anybody can state. The procedure asks
      # first which of the two it was, and an issue relabelled down after a
      # read of the log costs less than a five-hour token lifetime in
      # production filed as something to look at next week.

      # `github.token` and not a personal token, scoped by the job's
      # `issues: write` above. Only the `judge` step's failure files: a
      # dispatch refused for coming from a branch is not a drift.
      - name: A drifted realm is an issue, not a notification
        if: ${{ failure() && steps.judge.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="The deployed realm no longer holds section 11's token obligations, or could not be read"
          # `--limit 1000`, for the reason `.claude/scripts/gh-issue-list.sh`
          # gives: a listing that cannot see the open issue files a second one,
          # and the default is 30. One issue per drift is the promise above.
          EXISTING=$(gh issue list --state open --label security --limit 1000 \
            --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Still red on the scheduled check: $RUN_URL"
          else
            gh issue create --title "$TITLE" --label security --label critical --body "$(cat <<EOF
          The scheduled realm check (ADR-043) went red: $RUN_URL

          Either a deployed release points at a realm that no longer holds section 11's
          token obligations, or the realm could not be read at all. The run log says
          which, per workload. The procedure is in \`deploy/keycloak/README.md\` under
          *What a red scheduled run means*.

          The next rollout of every workload is already refused by \`deploy.yml\` until
          the realm is corrected, so nothing deploys onto the drift; what this issue
          tracks is the window in which the realm is live as it stands.

          Filed by \`.github/workflows/realm.yml\`. Each further red run comments here
          rather than filing again; close this issue on a green \`workflow_dispatch\` of
          the same workflow.
          EOF
          )"
          fi
