name: Deploy

# §15.5's canary, and §15.1's production leg of the pipeline. It reaches no
# cluster: there is no environment for this repository, no kubeconfig and no
# registry. What is asserted about it is asserted by `deploy/canary/canary.py`,
# whose suite runs on every change to this tree, and by the `check` job below,
# which reads this file.

# `workflow_dispatch` only, and the reason is `main` staying green: a canary on
# `push` would fail on every merge for want of a cluster, which trains everyone
# to ignore a red pipeline. When an environment exists, the trigger to add is
# `workflow_run` on a green CI over `main`, plus §15.1's manual approval gate;
# the steps below do not change.
on:
  workflow_dispatch:
    inputs:
      workload:
        description: 'Which deployable to roll (a key in deploy/canary/canary.json)'
        required: true
        type: choice
        options: [catalog-api, ordering-api, gateway, web-bff]
      tag:
        description: 'Image tag to promote. §15.3 refuses an empty one rather than rolling :latest.'
        required: true
        type: string
  # The gate runs on its own inputs, so a change to the plan, the script or
  # this file is checked without a deploy. The paths below are not maintained
  # here: `canary.py` declares them as SOURCE_INPUTS beside the reads that need
  # them, and asserts that both lists cover every entry.
  pull_request:
    paths:
      - 'deploy/canary/**'
      - '.github/workflows/deploy.yml'
      - 'deploy/helm/**'
      - 'deploy/observability/**'
      - 'src/**'
  push:
    branches: [main]
    paths:
      - 'deploy/canary/**'
      - '.github/workflows/deploy.yml'
      - 'deploy/helm/**'
      - 'deploy/observability/**'
      - 'src/**'

permissions:
  contents: read

concurrency:
  # Not cancel-in-progress: cancelling a rollout mid-ladder leaves a canary
  # Deployment serving traffic with nothing left to promote or retire it, which
  # is the one state this file exists to avoid. A second run queues.

  # Keyed by workload rather than by ref. Two manual dispatches of the same
  # workload from different branches are two runs against one stable release,
  # one HPA floor and one `<workload>-canary`; under a ref-scoped key they
  # proceed in parallel, each restoring a floor the other moved and each
  # uninstalling the other's canary. What must serialise is the cluster object,
  # and the branch a dispatch was launched from says nothing about which one
  # that is.
  group: deploy-${{ inputs.workload }}
  cancel-in-progress: false

jobs:
  # Stdlib Python over text, so it needs no cluster, no restore and no SDK --
  # the licence gate's terms, which is why it can gate the deploy below.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the canary's arithmetic
        working-directory: deploy/canary
        run: python -m unittest

      - name: The rollout plan agrees with the charts and the alerts
        run: python deploy/canary/canary.py check

  rollout:
    needs: check
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # Arithmetic rather than a round number. §15.5's ladder dwells ten minutes
    # on each of three rungs (30), and each of the three canary upgrades plus
    # the promotion may take the 20 minutes §15.1's callout requires for a
    # migration hook (80) — 110 in total, before the cleanup step. A cap below
    # that cancels a valid slow migration mid-rollout with no per-command
    # timeout hit, which is the one way to leave a canary serving with no step
    # left to remove it.
    timeout-minutes: 150
    environment: production
    env:
      NAMESPACE: commerce
      # A GitHub Environment scopes secrets and variables; it does not put them
      # in the process. The reader takes the standard variable, so it is bound
      # here explicitly rather than assumed to arrive.
      PROMETHEUS_URL: ${{ vars.PROMETHEUS_URL }}
    steps:
      # Production rolls from `main` and nothing else. `workflow_dispatch` lets
      # the caller choose any branch or tag, and `actions/checkout` then loads
      # the charts, the rollout script and the validation from that ref — so an
      # unmerged branch could deploy itself using its own weakened copy of the
      # tag preflight and the analysis thresholds. Every gate in this file is
      # code from the same ref it is gating, which is only safe when that ref
      # is the protected one.

      # A step rather than a job-level `if`: a skipped job says nothing, and
      # somebody who dispatched this on purpose should be told why it did not
      # run. It is a guard against accident and not the boundary, because it
      # runs from the dispatched ref too. What holds the boundary is the
      # `production` Environment's deployment-branch restriction — `main` and
      # nothing else — stated as an obligation in docs/secrets.md.
      - name: Production rolls from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Refusing to roll production from $GITHUB_REF. This job runs the charts, the rollout and its own validation from the dispatched ref, so it is restricted to the protected branch."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No step authenticates to a cluster, and naming that is better than a
      # comment implying it is handled. `ubuntu-latest` is a fresh hosted
      # runner with no kubeconfig, and a GitHub Environment scopes secrets
      # without materialising one, so the first `kubectl` below has no context
      # and this job cannot be dispatched as it stands. It is owed a checkout
      # of the cluster credential, and `helm` on the runner, which
      # `ubuntu-latest` ships but no line here pins. A login step for a
      # provider nobody has chosen would be a fiction with credentials in it.
      # `PROMETHEUS_URL` is bound in the job's `env` above, because that one
      # needs no provider to be correct.

      # The tag is validated before any Helm command sees it.
      # `--set-string image.tag="$TAG"` is not one assignment: Helm parses the
      # value with `strvals`, where a comma separates assignments, so a
      # dispatch of `deadbeef,image.registry=attacker.example` sets a valid
      # `image.tag` and overrides the registry, for the canary and the
      # promotion alike. The chart's own validation passes, because by then the
      # tag really is `deadbeef`. The rule is `commerce.tag`'s, so the two
      # cannot disagree, and it is tested — a regex inline here would be the
      # one part of this file nothing could exercise.

      # `--workload` because the budget is not the same for every chart: a
      # workload with a migrator derives `<workload>-migrate-<tag>`, which
      # Kubernetes stamps onto every pod as a label and refuses past 63. The
      # chart already checks it, at render time, which on this path is after
      # the stable track has been scaled to nineteen.
      - name: The tag has to be a tag
        run: python deploy/canary/canary.py validate-tag --value "$TAG" --workload "$WORKLOAD"
        env:
          TAG: ${{ inputs.tag }}
          WORKLOAD: ${{ inputs.workload }}

      # The realm is checked before the rollout changes anything: ADR-033's
      # revocation bound and ADR-034's no-refresh-token rule are realm
      # settings. "Before the rollout changes anything" and not "before the
      # cluster is touched", because the first of these three steps reads the
      # cluster; the first that changes it is the HPA patch below.

      # The credential is the `production` Environment's rather than CI's,
      # which is what answers ADR-040; docs/secrets.md carries its rights, its
      # provisioning and its rotation.

      # The realm is derived from the release and the origin is pinned from the
      # Environment, and docs/secrets.md argues why each has to come from where
      # it does. What this step adds is the order: the realm comes out of
      # `helm get values`, which answers what the release is running with and
      # what `-f stable-values.yaml` reinstalls, so the realm judged is the
      # realm installed.

      # It fails closed in every direction: an absent variable, an authority
      # this gate cannot split, a realm that cannot be read, a realm that
      # disagrees. The suite runs first here as well as in `realm.yml`, and the
      # repetition is the point: this job runs the gate from the dispatched
      # ref, so the copy that decides is the copy that must have been observed
      # red.
      - name: The realm gate's negatives
        run: python -m unittest discover -s deploy/keycloak

      # `-o json`, because stdlib parses that and no YAML. The same read
      # happens again below for the rollout's own `-f` file; it is cheap, and
      # sharing one file across forty lines of unrelated steps would couple
      # this check to the order of everything between them.
      - name: The realm to read is the realm this rollout installs
        run: |
          set -euo pipefail
          # `--all`, and its absence would stop every rollout. Without it
          # `helm get values` emits only the overrides the caller supplied and
          # omits the chart's own defaults, and `identity.authority` has a
          # default in every chart, so a release that never overrode it
          # answers a document with no `identity` key at all. `--all` is the
          # computed values, which is what the question is. The sibling
          # `helm get values ... -o yaml` below deliberately omits it: that one
          # produces the `-f` file for the upgrade, where re-supplying defaults
          # as explicit overrides is exactly what must not happen.
          helm get values "$WORKLOAD" -n "$NAMESPACE" --all -o json \
            > "$RUNNER_TEMP/installed.json"
          python deploy/keycloak/realm_check.py authority \
            --values "$RUNNER_TEMP/installed.json" \
            --trusted-origin "$KEYCLOAK_TRUSTED_ORIGIN" >> "$GITHUB_ENV"
        env:
          WORKLOAD: ${{ inputs.workload }}
          KEYCLOAK_TRUSTED_ORIGIN: ${{ vars.KEYCLOAK_TRUSTED_ORIGIN }}

      - name: Read the deployed realm
        run: python deploy/keycloak/read_admin.py --out "$RUNNER_TEMP/realm.json"
        env:
          # KEYCLOAK_BASE_URL and KEYCLOAK_REALM are deliberately absent. They
          # arrive through GITHUB_ENV from the step above, derived from the
          # chart value, and declaring them here would let an Environment
          # variable override the realm this rollout is installing.
          KEYCLOAK_CHECK_CLIENT_ID: ${{ vars.KEYCLOAK_CHECK_CLIENT_ID }}
          KEYCLOAK_CHECK_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CHECK_CLIENT_SECRET }}

      - name: The deployed realm holds section 11's token obligations
        run: >
          python deploy/keycloak/realm_check.py check
          --realm "$RUNNER_TEMP/realm.json" --kind deployed

      # The authority that was checked is the one every Helm call below
      # installs. Reading it from the running release and then upgrading to a
      # checked-out chart is not the same question: `-f stable-values.yaml`
      # carries the caller's overrides, so an authority that came from the old
      # chart's default is replaced by the new chart's default. Pinning it as
      # an explicit override closes that by construction — it is set once here
      # and every `helm upgrade` in this job takes it — and `--set-string` is
      # safe for this value because `realm_check.py authority` has already
      # refused whitespace, a query, a fragment and a second path segment.
      - name: The checked authority is the one that gets installed
        run: |
          set -euo pipefail
          echo "CHECKED_AUTHORITY=${KEYCLOAK_BASE_URL}/realms/${KEYCLOAK_REALM}" \
            >> "$GITHUB_ENV"

      - name: The first rung has a price, and it is paid before anything rolls
        run: |
          set -euo pipefail
          NEEDED=$(python deploy/canary/canary.py required --step 0)
          echo "The first step needs $NEEDED stable replicas (ADR-022)."
          # §15.5's 5% is one pod in twenty, so a three-replica service cannot
          # express it: one canary already serves 25%. Scaling up is what
          # makes the requested weight the served weight, and `canary.py plan`
          # refuses rather than rounding. §15.3's autoscaling.maxReplicas is
          # exactly this 19 plus one canary on the service charts, and higher
          # on the gateway, where the 19 is what the weight costs rather than
          # all the chart allows.

          # The HPA's floor moves first, and a `kubectl scale` alone would not
          # hold. These charts enable an autoscaler on the stable track, and
          # _deployment.tpl says `replicas` is a managed field the HPA writes
          # back, so a raised count decays toward the autoscaler's floor across
          # the dwells and `plan` then computes its share against a replica
          # count the cluster no longer has. Raising the floor is what makes
          # the number stick; restoring it is owed from the moment it is
          # raised, which the `if: always()` step at the end of this job does.

          # `--ignore-not-found` rather than a redirect into an empty string.
          # That form turns every failure into "there is no HPA" — an expired
          # credential, a network blip, an API server saying 403 — and the
          # rollout would then scale the Deployment without raising a floor
          # that does exist, so the autoscaler pulls the stable count back down
          # and every weight the ladder computes is against a number the
          # cluster does not have. Only a genuinely absent HPA may yield an
          # empty string here.
          FLOOR=$(kubectl get hpa "$WORKLOAD" -n "$NAMESPACE" \
            --ignore-not-found -o jsonpath='{.spec.minReplicas}')
          echo "HPA_FLOOR=$FLOOR" >> "$GITHUB_ENV"

          # The target is a maximum, because this step may only scale up.
          # `$NEEDED` is what the first rung's weight requires, not what the
          # service is currently running: a workload the autoscaler has taken
          # to 20 under load would be forced down to 19, and an HPA floor
          # already above 19 would be lowered to it. Reducing production
          # capacity to start a canary is the opposite of what a canary is for,
          # and it happens at the busiest moment. Taking the maximum keeps the
          # weight honest too — more stable pods only make the canary's share
          # smaller than the rung asked for, and `plan` treats the requested
          # weight as a ceiling.

          # One read of the replica count, used both for the maximum above and
          # for the value the cleanup restores. Two reads of one number is how
          # a message ends up naming a figure the check beside it would reject.
          CURRENT=$(kubectl get deployment "$WORKLOAD" -n "$NAMESPACE" \
            -o jsonpath='{.spec.replicas}')
          echo "STABLE_REPLICAS_BEFORE=$CURRENT" >> "$GITHUB_ENV"

          for candidate in "$CURRENT" "$FLOOR"; do
            if [ -n "$candidate" ] && [ "$candidate" -gt "$NEEDED" ]; then
              NEEDED="$candidate"
            fi
          done
          echo "Scaling the stable track to $NEEDED (never below what it runs now)."

          # The Deployment's own replica count, recorded whether or not there
          # is an HPA. `autoscaling.enabled: false` is a supported chart
          # configuration (§15.3), and under it there is no floor for the
          # cleanup to restore, so this is the value it scales back to.
          if [ -n "$FLOOR" ]; then
            kubectl patch hpa "$WORKLOAD" -n "$NAMESPACE" \
              --type=merge -p "{\"spec\":{\"minReplicas\":$NEEDED}}"
          fi

          kubectl scale deployment "$WORKLOAD" --replicas="$NEEDED" -n "$NAMESPACE"
          # Bounded, because an unbounded wait here does not fail — it
          # consumes the job. A scale-up that cannot schedule the replicas it
          # asked for would block until the job's cap, and a job cancelled on
          # its timeout is not the same as a step that failed: the
          # `if: always()` cleanup is not reliably reached, so the raised HPA
          # floor stays raised with nothing left to run.
          kubectl rollout status deployment "$WORKLOAD" -n "$NAMESPACE" --timeout=10m
        env:
          WORKLOAD: ${{ inputs.workload }}

      - name: Climb the ladder
        run: |
          set -euo pipefail

          STEPS=$(python deploy/canary/canary.py steps)
          STABLE=$(kubectl get deployment "$WORKLOAD" -n "$NAMESPACE" -o jsonpath='{.spec.replicas}')

          # `deploy/helm/*/charts/` is gitignored, and every service chart
          # depends on `file://../common`. Without this, the install below
          # reports `commerce-common` missing in charts/ and the canary never
          # reaches a pod.
          CHART_DIR="deploy/helm/$(python deploy/canary/canary.py chart --workload "$WORKLOAD")"
          helm dependency update "$CHART_DIR"

          # Once, before the ladder, and used by both the canary installs and
          # the promotion. `helm get values` returns the release's own
          # overrides rather than the coalesced set, so applying it over the
          # new chart picks up new defaults while keeping what the environment
          # chose. Nothing in this loop touches the stable release, so one
          # fetch is the same answer every rung.
          helm get values "$WORKLOAD" -n "$NAMESPACE" -o yaml > stable-values.yaml

          for STEP in $(seq 0 $((STEPS - 1))); do
            # `plan` prints CANARY_* assignments rather than JSON so this
            # stays a shell script instead of five inline `python -c`
            # invocations, each of them a quoting bug in the one file nothing
            # here can test. It exits non-zero when the requested weight is
            # not expressible at the current replica count, and `set -e` is
            # what makes that a stopped rollout rather than a stale plan
            # reused.

            # Assign, then eval. `eval "$(cmd)"` swallows a failed cmd: the
            # substitution yields an empty string, `eval ""` returns success
            # and `set -e` never fires, so a refused weight would be ignored
            # and the loop would carry the previous rung's CANARY_* values
            # into this one. A plain assignment propagates the substitution's
            # status.
            PLAN=$(python deploy/canary/canary.py plan \
              --workload "$WORKLOAD" --stable "$STABLE" --step "$STEP")
            eval "$PLAN"

            # The last rung is handled before the canary is touched, because
            # 100% is not a weight: `plan` returns `final`, with
            # `stableReplicas: 0`, rather than a share. Promotion is a
            # different operation from a rung, and it belongs before the code
            # that performs one — run in rung order it would re-run §7.4's
            # migration hook for nothing and announce a share the cluster was
            # not serving.
            if [ "$CANARY_FINAL" = "True" ]; then
              echo "The canary is the release; promoting the tag onto the stable release."
              # The chart argument is required: `helm upgrade` is
              # `[RELEASE] [CHART]`, and `--reuse-values` reuses the values,
              # not the chart, so without it this fails at cutover with the
              # canary still serving.

              # `--atomic` because this is the one command in the file that
              # mutates the stable release. Without it a failed hook, rollout
              # or wait leaves production partially upgraded, and uninstalling
              # the canary afterwards cannot put the previous revision back —
              # the rollback this mechanism advertises would be gone at
              # precisely the moment it is needed. It is deliberately absent
              # from the canary installs: there a failure is handled by
              # removing the canary, and rolling back to an earlier canary
              # revision is not a state anybody wants.

              # `-f stable-values.yaml` rather than `--reuse-values`. The
              # latter carries forward the values coalesced from the previous
              # chart and ignores defaults the new one introduces, so the
              # canary and the promotion could render different configuration
              # at cutover, or the promotion could fail on a value the new
              # chart added. Both ends now apply the same overrides over the
              # same chart, which is the only way the thing promoted is the
              # thing that was measured.
              helm upgrade "$WORKLOAD" "deploy/helm/$CANARY_CHART" \
                -n "$NAMESPACE" \
                -f stable-values.yaml --set-string image.tag="$TAG" \
                --set-string identity.authority="$CHECKED_AUTHORITY" \
                --atomic --wait --timeout 20m
              helm uninstall "$WORKLOAD-canary" -n "$NAMESPACE"
              break
            fi

            echo "step $STEP: $CANARY_CANARY_REPLICAS canary pod(s), ${CANARY_ACHIEVED}% served"

            # The canary is a second release of the same chart, differing only
            # in `canary.enabled`, its replica count and the image tag. The
            # stable release is not touched anywhere in this loop, which is
            # what makes the rollback below cost the canary's own pods and
            # nothing else (ADR-022).

            # It inherits the stable release's values, and `--install` is why
            # it has to: a new release inherits nothing, so without `-f` every
            # environment value falls through to the chart's own default and
            # the canary comes up against the default identity provider, OTLP
            # endpoint and database — a pod that is not a canary of anything.
            # The gateway fails loudly, because `edge-config.yaml` refuses an
            # empty `ingress.trustedNetworks`; the rest would install and be
            # wrong.

            # `--timeout` because Helm blocks on a hook whatever `--wait` says,
            # and its default is shorter than the migration budget §15.1,
            # deploy/helm/README.md and docs/runbooks/migration-failure.md
            # agree on. ADR-022 makes the canary release the one that runs
            # §7.4's hook, which is why this command is the one that must not
            # inherit the default.

            # `--set autoscaling.enabled=false` is not belt and braces: see
            # _autoscaling.tpl. The values inherited from the stable release
            # have the HPA on, and `_deployment.tpl` omits `replicas` whenever
            # it is, so without this flag the canary Deployment carries no
            # replica count and the API server defaults it to one, making
            # every rung of the ladder a single pod. Autoscaling stays off on
            # the canary because an HPA would move the weight underneath the
            # analysis: the served share is a replica ratio.
            helm upgrade --install "$WORKLOAD-canary" "deploy/helm/$CANARY_CHART" \
              --set-string identity.authority="$CHECKED_AUTHORITY" \
              -n "$NAMESPACE" \
              -f stable-values.yaml \
              --set canary.enabled=true \
              --set replicaCount="$CANARY_CANARY_REPLICAS" \
              --set autoscaling.enabled=false \
              --set-string image.tag="$TAG" \
              --wait --timeout 20m

            # The window equals the dwell, which is what makes the reading
            # §15.5's "watch": a rate over the dwell, read at the end of it.
            sleep "$((CANARY_DWELL_MINUTES * 60))"
            python deploy/canary/read_prometheus.py \
              --service "$CANARY_SERVICE_NAME" \
              --window "${CANARY_DWELL_MINUTES}m" \
              --out readings.json

            if ! python deploy/canary/canary.py analyse --readings readings.json; then
              echo "::error::Rolling back at step $STEP."
              helm uninstall "$WORKLOAD-canary" -n "$NAMESPACE"
              exit 1
            fi
          done
        env:
          WORKLOAD: ${{ inputs.workload }}
          TAG: ${{ inputs.tag }}

      # One mechanism, at the end, for every path. `if: always()` is scoped to
      # the job, which is the unit every one of these is undone for: it runs
      # after a promote, after a rollback, after a failure in any step, and
      # after a cancellation. A restore called at each outcome misses `set -e`,
      # and a `trap EXIT` in the climb step misses the scale-up step before it,
      # where the floor is raised.

      # Three things are undone here, and the canary is the one that matters
      # most. A failure between the install and either exit — an unreachable
      # Prometheus, a Helm timeout, the analyse step erroring rather than
      # returning a verdict — bypasses both explicit `helm uninstall` calls
      # under `set -e`, and a step that restores only the autoscaler leaves a
      # canary of an unproven build serving a share of production
      # indefinitely.
      - name: Undo everything the rollout raised
        if: always()
        run: |
          failed=0

          # The canary first: it is the one serving traffic.
          #
          # `--ignore-not-found` on the uninstall rather than a `helm status`
          # guard. That guard exits non-zero for an absent release and for an
          # expired credential, a network failure or an API server saying no,
          # so every one of those would skip the canary silently, in the step
          # whose whole job is to make sure it is gone. The flag makes absence
          # the only ignored outcome.
          echo "Removing the canary release if the rollout left one."
          helm uninstall "$WORKLOAD-canary" -n "$NAMESPACE" --ignore-not-found || failed=1

          if [ -n "${HPA_FLOOR:-}" ]; then
            kubectl patch hpa "$WORKLOAD" -n "$NAMESPACE" \
              --type=merge -p "{\"spec\":{\"minReplicas\":$HPA_FLOOR}}" || failed=1
          elif [ -n "${STABLE_REPLICAS_BEFORE:-}" ]; then
            # No HPA to own the count, so the scale-up is this step's to undo.
            kubectl scale deployment "$WORKLOAD" \
              --replicas="$STABLE_REPLICAS_BEFORE" -n "$NAMESPACE" || failed=1
          fi

          # Not `|| true` swallowing the lot. A cleanup that fails is a
          # cluster left in the state this step exists to prevent, and
          # reporting success would hide exactly that. Each command is allowed
          # to fail without skipping the ones after it, and then the step
          # fails.
          exit "$failed"
        env:
          WORKLOAD: ${{ inputs.workload }}
