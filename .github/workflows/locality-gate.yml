name: Locality gate

# A pull request declares a class and a touch set in its body, and its diff has
# to sit inside both — docs/change-locality.md section 3. The gate under
# .github/locality-gate/ judges every changed path twice: against the class's
# tree set in classes.yml, and against the declared touch set. A Catalog change
# that also edits Ordering is inside Class A's tree set and outside its own row.
#
# Its own workflow rather than a job in ci.yml because it judges a property of
# every pull request rather than of a tree, and because `edited` has to be a
# trigger — a body is edited without a push, and ci.yml on `edited` would
# rebuild the solution for every typo in a description.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  # The gate reads the pull request's body and its file list. Read is the
  # whole of what it needs; it changes nothing and posts nothing.
  pull-requests: read

concurrency:
  group: locality-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Proposal and enforcement are two executions, on the closure gate's design:
# the suite runs the head copy, because testing a proposed gate is the point of
# that step, and the enforcing copy is read out of the base commit, so a pull
# request may change the gate freely without changing what judges it. The map
# travels with the gate, so a pull request that widens Class D to reach src/**
# is judged by the base's map and not its own.

# The bootstrap is the one departure from the closure gate, which fails when
# the base carries no gate. This one has to land once, and on the pull request
# landing it the base has no copy by definition, so a base with no
# .github/locality-gate/ directory is judged by the head copy under a warning
# annotation. A base that has the directory but a broken or empty gate still
# fails: that is a base nobody should be building on.

# The workflow definition comes from the head ref, so a pull request can edit
# or delete the enforcing step. What closes that is a required status check on
# `main`.
jobs:
  locality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The enforcing copy comes out of the base commit, which a shallow
          # checkout does not have.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The head copy, deliberately: this step's subject is the gate this pull
      # request proposes. The suite is negative cases with the positive
      # controls beside them — a clean diff that must pass, a matcher that must
      # match — plus reads of the shipped map, so a proposal that fails its own
      # suite belongs red here.
      - name: Test the proposed gate
        working-directory: .github/locality-gate
        run: python -m unittest

      # The base copy — gate and map together — for the reason above, with the
      # one bootstrap branch argued there.
      - name: Take the enforcing gate and map from the base commit
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GATE_DIR: .github/locality-gate
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/locality-gate"
          mkdir -p "$dest"
          if ! git cat-file -e "$BASE_SHA:$GATE_DIR" 2>/dev/null; then
            echo "::warning::base commit $BASE_SHA carries no $GATE_DIR; this pull request is judged by the gate it proposes (bootstrap)"
            cp "$GATE_DIR/locality_gate.py" "$GATE_DIR/classes.yml" "$dest/"
            echo "enforcing with the HEAD copy, because the base has no gate directory at all"
            exit 0
          fi
          for file in locality_gate.py classes.yml; do
            if ! git cat-file -e "$BASE_SHA:$GATE_DIR/$file" 2>/dev/null; then
              echo "::error::base commit $BASE_SHA carries $GATE_DIR but no $file; rebase onto a base that has both"
              exit 1
            fi
            git show "$BASE_SHA:$GATE_DIR/$file" > "$dest/$file"
            # Fail on an empty subject rather than run a gate that reads
            # nothing and reports a pass — the rule the gate applies to its
            # own input.
            if [ ! -s "$dest/$file" ]; then
              echo "::error::$GATE_DIR/$file at $BASE_SHA is empty"
              exit 1
            fi
          done
          if ! git diff --quiet "$BASE_SHA" -- "$GATE_DIR/" .github/workflows/locality-gate.yml; then
            echo "::notice::this pull request modifies the locality gate, its map or its workflow; the gate below is the copy at $BASE_SHA"
          fi
          echo "enforcing with the gate and map as of $BASE_SHA"

      # Two `gh` calls, and they are the only network in the check. The
      # deciding takes JSON on stdin and is pure — deploy/canary/canary.py's
      # split, for its reason: what is tested is the judgement, not the fetch.

      # The file list comes from the REST files endpoint with `--paginate`
      # rather than `gh pr view --json files`, because the latter is one page
      # and a prefix of a long diff looks exactly like a complete one.
      # Paginated it is still capped, so `changedFiles` travels with the body
      # and the gate refuses a list shorter than it. Each entry arrives as one
      # JSON object on its own line, `filename` and `previous_filename`
      # together, so a rename is judged at both ends and a newline inside a
      # path cannot be a second path; `jq -s` collects them.

      # `shell: bash` rather than the default: the default `run` shell is
      # `bash -e` with no pipefail, so a failing `gh` would be masked by
      # whatever the right-hand side exited with.
      - name: Every changed path is inside the declared class and touch set
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_json=$(gh pr view "$PR" --repo "$REPO" --json number,body,changedFiles)
          gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | {filename, previous_filename}' |
            jq -s --argjson pr "$pr_json" '$pr + {files: .}' |
            python "$RUNNER_TEMP/locality-gate/locality_gate.py" --map "$RUNNER_TEMP/locality-gate/classes.yml"
