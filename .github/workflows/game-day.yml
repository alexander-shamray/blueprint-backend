name: Game day

# `coverage` is the harness's suite and the test that every runbook has a script
# or a reason; it needs no Docker. `run` causes real alerts on the Compose stack,
# one runbook to a job and a stack, and is workflow_dispatch only:
# tools/game-day/README.md's *Running it in CI* argues that from the runtimes.

on:
  pull_request:
    paths:
      - 'tools/game-day/**'
      - '.github/workflows/game-day.yml'
      - 'docs/runbooks/**'
      - 'deploy/observability/**'
      - 'deploy/compose/**'
      - 'deploy/helm/**'
      - 'deploy/compose/walk-an-order.sh'
      - 'src/**'
  push:
    branches: [main]
    paths:
      - 'tools/game-day/**'
      - '.github/workflows/game-day.yml'
      - 'docs/runbooks/**'
      - 'deploy/observability/**'
      - 'deploy/compose/**'
      - 'deploy/helm/**'
      - 'deploy/compose/walk-an-order.sh'
      - 'src/**'
  workflow_dispatch:
    inputs:
      runbooks:
        description: 'Runbook files to run, space-separated, or all'
        default: 'all'

permissions:
  contents: read

concurrency:
  group: game-day-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: The harness, and every runbook has a script or a reason
        working-directory: tools/game-day
        run: python -m unittest

  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runbooks: ${{ steps.plan.outputs.runbooks }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A name without a script fails here, before any stack is started for it.
      - name: The runbooks to run, one job each
        id: plan
        env:
          RUNBOOKS: ${{ inputs.runbooks }}
        run: python tools/game-day/game_day.py --matrix "$RUNBOOKS" >> "$GITHUB_OUTPUT"

  # A job and a stack per runbook, as the runtimes were measured: a scenario that
  # dies cannot poison the next, and the longest runbook bounds the dispatch.
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runbook: ${{ fromJSON(needs.plan.outputs.runbooks) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Start the stack
        run: docker compose -f deploy/compose/docker-compose.yml up -d --wait --quiet-pull

      - name: Cause the alert and check the runbook's first step
        env:
          RUNBOOK: ${{ matrix.runbook }}
        run: python tools/game-day/game_day.py "$RUNBOOK"

      - name: Show state on failure
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml ps -a && docker compose -f deploy/compose/docker-compose.yml logs --tail 50

      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml down -v
