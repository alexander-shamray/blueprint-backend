name: Object store

# §10.8's sentence that neither image credential pair can list a bucket or
# delete, asked of the deployed store between rollouts. ADR-110 owns the
# decision; Compose's store is held to the same sentence by
# ProductImageStoreTests.

# Path-filtered for the suite alone: a schedule has no diff, and the deployed
# job runs the suite itself before it sends a credential anywhere.
on:
  pull_request:
    paths:
      - 'deploy/objectstore/**'
      - '.github/workflows/object-store.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/objectstore/**'
      - '.github/workflows/object-store.yml'
  # Daily, and off the hour, on realm.yml's reasoning. A policy changes when a
  # deployment is edited, which is rarer than a realm, so the realm's hourly
  # cadence would buy nothing here.
  schedule:
    - cron: '43 4 * * *'
  # An operator re-runs the judgement after correcting a policy.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: object-store-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'deployed' || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Stdlib Python against a server the suite starts, so it needs no store.
      - name: The check's negatives
        run: python -m unittest discover -s deploy/objectstore

  deployed:
    # Opted in by `OBJECT_STORE_CHECK_SCHEDULED`, whose scope and
    # once-enabled-nothing-is-optional rule are docs/secrets.md's. A guard
    # that reads a configuration, not a skip that reads a failure as absence.
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.OBJECT_STORE_CHECK_SCHEDULED == 'enabled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
      # `issues: write` is what a red run does, below. It is job-scoped
      # because the `check` job has no business filing anything.
      issues: write
    steps:
      # Judged from `main` and nothing else, on realm.yml's reasoning: this
      # job sends the production pairs to the endpoint using whatever copy of
      # `store_check.py` the dispatched ref carries. docs/secrets.md names what
      # holds the boundary; this step is the guard against accident.
      - name: The store is judged from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Refusing to judge the deployed store from $GITHUB_REF. This job sends the production credential pairs using the check from the dispatched ref, so it is restricted to the protected branch."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: The check's negatives
        run: python -m unittest discover -s deploy/objectstore

      # The endpoint is pinned from the Environment and not read from a
      # release, because the pairs are sent to it (docs/secrets.md). A missing
      # variable, a pair the store does not know, an unreachable store and a
      # delete the store allows all fail the step.
      - name: Neither credential pair can delete or list the bucket
        id: judge
        # A step timeout, so a hung store is a failed step and not a cancelled
        # job: `failure()` below fires on the first and not on the second.
        timeout-minutes: 3
        run: python deploy/objectstore/store_check.py check
        env:
          OBJECT_STORE_ENDPOINT: ${{ vars.OBJECT_STORE_ENDPOINT }}
          OBJECT_STORE_BUCKET: ${{ vars.OBJECT_STORE_BUCKET }}
          OBJECT_STORE_REGION: ${{ vars.OBJECT_STORE_REGION }}
          OBJECT_STORE_BFF_ACCESS_KEY: ${{ secrets.OBJECT_STORE_BFF_ACCESS_KEY }}
          OBJECT_STORE_BFF_SECRET_KEY: ${{ secrets.OBJECT_STORE_BFF_SECRET_KEY }}
          OBJECT_STORE_CATALOG_ACCESS_KEY: ${{ secrets.OBJECT_STORE_CATALOG_ACCESS_KEY }}
          OBJECT_STORE_CATALOG_SECRET_KEY: ${{ secrets.OBJECT_STORE_CATALOG_SECRET_KEY }}

      # What a red run does, on realm.yml's reasoning (ADR-043): a notification
      # is read once and an issue is open until somebody closes it, so a red
      # run files an issue, or comments on the open one, and the tracker holds
      # one issue per drift and not one per day. `deploy/objectstore/README.md`
      # is the procedure it points at. Only the `judge` step's failure files: a
      # dispatch refused for coming from a branch, or a suite that went red,
      # is not a drift in the store. `security` and `high`: a store that lets
      # an image credential delete is a protection that does not protect, but
      # this step cannot tell that from a store it could not reach.
      - name: A drifted store is an issue, not a notification
        if: ${{ failure() && steps.judge.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="The deployed object store no longer refuses an image credential a delete or a list, or could not be reached"
          # `--limit 1000`, for the reason `.claude/scripts/gh-issue-list.sh`
          # gives: a listing that cannot see the open issue files a second one.
          EXISTING=$(gh issue list --state open --label security --limit 1000 \
            --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Still red: $RUN_URL"
          else
            gh issue create --title "$TITLE" --label security --label high --body "$(cat <<EOF
          The deployed object store check (ADR-110) went red: $RUN_URL

          Either the deployed store allows one of the two image credential pairs a
          delete or a list that section 10.8 says it cannot, or the store could not be
          asked at all. The run log says which, per pair. The procedure is in
          \`deploy/objectstore/README.md\`.

          Filed by \`.github/workflows/object-store.yml\`. Each further red run comments
          here rather than filing again; close this issue on a green
          \`workflow_dispatch\` of the same workflow.
          EOF
          )"
          fi
