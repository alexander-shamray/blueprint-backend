name: Observability

# A separate workflow rather than a job in ci.yml because path filtering is
# per-workflow and this proves a tree most pull requests never touch.

# It reaches no Prometheus, no Grafana and no cluster. It asserts that §13.6's
# alerts and §13.9's runbooks agree in both directions, and that every metric a
# loaded rule or a dashboard panel reads is one this platform publishes —
# §13.6's third leg. Whether a rules file is valid to Prometheus is a different
# question, and adopting `promtool` is a decision no chapter has taken.

# The paths below are not maintained here: check.py declares them as
# SOURCE_INPUTS beside the reads that need them, and asserts that both of this
# workflow's triggers cover every entry.
on:
  pull_request:
    paths:
      - 'deploy/observability/**'
      - '.github/workflows/observability.yml'
      - 'deploy/workflow_paths/**'
      - 'docs/runbooks/**'
      - 'src/**'
      - 'docs/backend-architecture/13-observability.md'
  push:
    branches: [main]
    paths:
      - 'deploy/observability/**'
      - '.github/workflows/observability.yml'
      - 'deploy/workflow_paths/**'
      - 'docs/runbooks/**'
      - 'src/**'
      - 'docs/backend-architecture/13-observability.md'

permissions:
  contents: read

concurrency:
  group: observability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Stdlib Python over text files: no restore, no SDK, no containers. The
    # whole run is seconds, which is what makes filtering on src/** affordable.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # The pin is a floor rather than a preference: a newer interpreter
      # accepts APIs this one does not, so a suite green locally can be
      # unrunnable here.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The gate's own checks, over throwaway source trees, ahead of the gate:
      # a scan that read the wrong text passes the real tree, so it is shown a
      # tree it must refuse.
      - name: The gate refuses what it should
        run: python -m unittest discover -s deploy/observability -p "test_*.py"

      - name: Alerts, runbooks and signals agree
        run: python deploy/observability/check.py

      # The SLO run's stock precondition and confirmed-order floor. The pin is
      # a floor: the quoted glob and the extensionless ESM need Node 22.7 or
      # later, and the runner's preinstalled Node is not promised to be.
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'

      - name: The SLO run's floor holds
        run: node --test "deploy/observability/slo/*.test.js"

      # The stress run's staircase arithmetic and its knee rules, as deploy/observability/README.md states them.
      - name: The stress run's knee holds
        run: node --test "deploy/observability/stress/*.test.js"
