# Weekly version updates for NuGet, the Dockerfiles and Actions; global.json's
# SDK moves by hand (§4.4). Security updates are a repository setting, and every
# group below applies to version updates only, so a security update opens on
# its own. docs/change-locality.md section 6 says why the commit and locality
# gates skip a Dependabot pull request.
version: 2
updates:
  # Directory.Packages.props is the central pin file; Dependabot reads it from
  # the root.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      # The 10.0 line's servicing patches move together, as the runtime does.
      dotnet-servicing:
        applies-to: version-updates
        update-types: [patch]
        patterns: ['Microsoft.*', 'System.*']
      grpc:
        applies-to: version-updates
        patterns: ['Grpc.*', 'Google.Protobuf']
      fluentvalidation:
        applies-to: version-updates
        patterns: ['FluentValidation*']
    ignore:
      # Each is a decision with its own issue, not a bump: MassTransit 9 changes
      # the licence, SqlClient 7 the driver, and a framework major the target.
      - dependency-name: 'MassTransit*'
        update-types: [version-update:semver-major]
      - dependency-name: 'Microsoft.Data.SqlClient'
        update-types: [version-update:semver-major]
      - dependency-name: 'Microsoft.AspNetCore.*'
        update-types: [version-update:semver-major]
      - dependency-name: 'Microsoft.EntityFrameworkCore*'
        update-types: [version-update:semver-major]
      - dependency-name: 'Microsoft.Extensions.*'
        update-types: [version-update:semver-major]
      - dependency-name: 'System.Security.Cryptography.*'
        update-types: [version-update:semver-major]

  # Every service image and the broker's.
  - package-ecosystem: docker
    directories:
      - /src/**/*
      - /deploy/compose/rabbitmq
    schedule:
      interval: weekly
    ignore:
      # The SDK image moves with global.json, which disables roll-forward (§4.4), and a runtime
      # major moves with the target framework: each is a deliberate edit, not a bump.
      - dependency-name: '*dotnet/sdk'
      - dependency-name: '*dotnet/aspnet'
        update-types: [version-update:semver-major]
      - dependency-name: '*dotnet/runtime'
        update-types: [version-update:semver-major]
      # The delayed-exchange plugin is built for one broker line (ADR-021); the Dockerfile says why.
      - dependency-name: 'rabbitmq'
        update-types: [version-update:semver-minor, version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
